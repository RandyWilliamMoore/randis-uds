name: Docker

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: [Dockerfile, .dockerignore, "docker/**", .github/workflows/docker.yml, requirements.txt]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke --shm-size=512m -p 6080:6080 smoke:ci
          for i in $(seq 1 120); do
            if docker exec smoke grep -q "ready in" /app/data/launch.log 2>/dev/null && curl -fsS http://localhost:6080/vnc.html -o /dev/null; then
              docker exec smoke cat /app/data/launch.log
              echo "app page up and noVNC answering"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          docker exec smoke cat /app/data/launch.log || true
          exit 1

      - name: Sign in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
