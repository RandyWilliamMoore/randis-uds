<html>
<head>
<meta charset="utf-8">
<title>Funnel Suite</title>

<style>
:root{--bg:#f9f9f7;--bg2:#fcfcfb;--bg3:#efeee9;--line:#dcdbd5;--tx:#0b0b0b;--mut:#52514e;--acc:#c2185b;--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--bad:#d03b3b;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
body[data-theme=dark]{--bg:#0d0d0d;--bg2:#1a1a19;--bg3:#262624;--line:#383835;--tx:#f0efec;--mut:#c3c2b7;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
header b#apptitle{font-size:16px;color:var(--acc);margin-right:6px}
#nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
#nav button{border:0;background:none;padding:5px 9px;border-radius:6px;cursor:pointer;color:var(--mut)}
#nav button.on{background:var(--acc);color:#fff}
#nav button:hover:not(.on){background:var(--bg3)}
#saved{font-size:11px;color:var(--mut)}
main#view{flex:1;overflow:auto;padding:14px 18px}
h2{margin:0 0 4px;font-size:21px}h3{margin:6px 0 8px;font-size:15px;color:var(--acc)}h4{margin:10px 0 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.lead{color:var(--mut);margin:0 0 12px;max-width:980px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.row>.card{flex:1;min-width:300px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px;margin:0 0 6px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
textarea{width:100%;min-height:80px;font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg3);color:var(--tx);border-radius:6px;padding:4px 10px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.x{padding:1px 7px;color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}td input,td select{width:100%;padding:2px 4px}
.num{text-align:right;font-variant-numeric:tabular-nums}
pre,.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}pre{background:var(--bg3);padding:10px;border-radius:6px;overflow:auto;white-space:pre-wrap;margin:6px 0;max-height:420px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--bg3);color:var(--mut)}
.ok{color:var(--good)}.bad{color:var(--bad)}.warnc{color:#b7791f}
.banner{border-left:4px solid var(--serious);background:var(--bg3);padding:8px 12px;border-radius:6px;margin:0 0 12px}
.stat{font-size:26px;font-weight:600}.sub{font-size:12px;color:var(--mut)}
svg text{fill:var(--mut);font-size:11px}svg .ink{fill:var(--tx)}
.lnk{color:var(--s1);cursor:pointer;text-decoration:underline}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:80%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:4px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>

<body>

<main id="view"></main>

<script>

const pct = n => (isFinite(n) ? Math.round(n * 1000) / 10 : 0) + "%";
const SER = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
let toastT; function toast(t, ms) { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => e.style.display = "none", ms || 3200); }
let WEB_ON = false;
function openLink(url) {

let S, MEM = { page: null, sub: {} }, loaded = false, useLocal = true, saveT;
function save() {
  clearTimeout(saveT);

    const data = { [APP.key]: S };
    if (inApp && !useLocal) tell({ uds: "store-set", data });
    try { localStorage.setItem("uds-" + APP.key, JSON.stringify(S)); } catch (e) {}
    const kb = Math.round(JSON.stringify(data).length / 1024), el = $("#saved");

function readLocal() { try { return JSON.parse(localStorage.getItem("uds-" + APP.key) || "null"); } catch (e) { return null; } }
function getP(path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), S); }
function setP(path, val) { const p = path.split("."); let o = S; while (p.length > 1) { const k = p.shift(); if (o[k] == null) o[k] = {}; o = o[k]; } o[p[0]] = val; }
function download(name, data, type) {

  if (inApp) { tell({ uds: "export-file", name, data: blob }); return; }

const csvCell = c => `"${String(c == null ? "" : c).replace(/"/g, '""')}"`;
const toCSV = rows => rows.map(r => r.map(csvCell).join(",")).join("\r\n");
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;

}

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const head = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nm.length), ...u16(0)]);

}

const AIQ = {};
function askAI(prompt, cb) {
  if (!inApp) { cb({ error: "Open this inside Randis UDS with an AI linked to use the AI helper." }); return; }
  const id = "q10-" + uid(); AIQ[id] = cb;
  tell({ uds: "planner-ask", id, history: [{ role: "user", content: String(prompt) }], context: APP.title + " app in Randis UDS." });
}

const F = (label, path, o) => { o = o || {}; const v = getP(path); const t = o.type || (typeof v === "number" ? "number" : "text");
  if (o.opts) return `<label class="f">${esc(label)}<select data-p="${path}"${o.r ? " data-r" : ""}>${o.opts.map(x => { const [k, n] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(k)}"${String(v) === String(k) ? " selected" : ""}>${esc(n)}</option>`; }).join("")}</select></label>`;
  if (t === "area") return `<label class="f">${esc(label)}<textarea data-p="${path}"${o.r ? " data-r" : ""} style="min-height:${o.h || 90}px">${esc(v)}</textarea></label>`;
  if (t === "check") return `<label><input type="checkbox" data-p="${path}" data-r${v ? " checked" : ""}> ${esc(label)}</label>`;
  return `<label class="f">${esc(label)}<input type="${t}" data-p="${path}"${t === "number" ? " data-num" : ""}${o.r ? " data-r" : ""} value="${esc(v)}"${o.step ? ` step="${o.step}"` : ""}${o.w ? ` style="width:${o.w}"` : ""}></label>`; };
function TBL(path, cols, o) {
  o = o || {}; const rows = getP(path) || [];
  const head = cols.map(c => `<th>${esc(c[1])}</th>`).join("") + (o.extra ? o.extra.map(x => `<th>${esc(x[0])}</th>`).join("") : "") + "<th></th>";
  const body = rows.map((r, i) => "<tr>" + cols.map(([k, , t, w]) => {
    const p = `${path}.${i}.${k}`, v = r[k];
    if (Array.isArray(t)) return `<td${w ? ` style="width:${w}"` : ""}><select data-p="${p}" data-r>${t.map(x => `<option${String(v) === String(x) ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></td>`;
    return `<td${w ? ` style="width:${w}"` : ""}><input data-p="${p}"${t === "number" ? ' type="number" data-num step="any"' : ""}${o.live ? " data-r" : ""} value="${esc(v)}"></td>`;
  }).join("") + (o.extra ? o.extra.map(x => `<td class="num">${x[1](r, i)}</td>`).join("") : "") + `<td><button class="x" data-act="rowdel" data-arg="${path}|${i}">✕</button></td></tr>`).join("");

}
function lineChart(series, o) {
  o = o || {}; const W = o.w || 640, H = o.h || 220, P = { l: 46, r: 12, t: 10, b: 24 };
  const all = series.flatMap(s => s.pts); if (!all.length) return `<p class="sub">No data yet.</p>`;
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1, y0 = Math.min(0, ...ys), y1 = Math.max(...ys) * 1.08 || 1;
  const X = x => P.l + (x - x0) / ((x1 - x0) || 1) * (W - P.l - P.r), Y = y => H - P.b - (y - y0) / ((y1 - y0) || 1) * (H - P.t - P.b);
  let g = ""; for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 4}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, 1)}</text>`; }
  g += `<text x="${P.l}" y="${H - 6}">${esc(o.xl ? o.xl(x0) : fmt(x0))}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${esc(o.xl ? o.xl(x1) : fmt(x1))}</text>`;
  const lines = series.map((s, i) => `<polyline fill="none" stroke="${s.color || SER[i % 8]}" stroke-width="2" points="${s.pts.map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ")}"/>` +
    s.pts.filter((p, j) => s.pts.length < 60 || j % Math.ceil(s.pts.length / 40) === 0).map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="6" fill="transparent"><title>${esc(s.name)}: ${esc(o.xl ? o.xl(p[0]) : fmt(p[0]))} → ${fmt(p[1])}</title></circle>`).join("")).join("");
  const leg = series.length > 1 ? `<div class="legend">${series.map((s, i) => `<span><i style="background:${s.color || SER[i % 8]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return leg + `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${g}${lines}</svg>`;
}
function barChart(items, o) {
  o = o || {}; const W = o.w || 640, bh = 22, H = items.length * (bh + 6) + 8, lw = o.lw || 150, max = Math.max(...items.map(i => i.v), 1e-9);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">` + items.map((it, i) => { const y = 4 + i * (bh + 6), w = Math.max(1, (W - lw - 90) * it.v / max);
    return `<text class="ink" x="${lw - 6}" y="${y + 15}" text-anchor="end">${esc(it.name)}</text><rect x="${lw}" y="${y}" width="${w}" height="${bh}" rx="4" fill="${it.color || SER[o.one ? 0 : i % 8]}"><title>${esc(it.name)}: ${esc(o.f ? o.f(it.v) : fmt(it.v))}</title></rect><text x="${lw + w + 6}" y="${y + 15}">${esc(o.f ? o.f(it.v) : fmt(it.v))}</text>`; }).join("") + "</svg>";

function nav() {
  $("#nav").innerHTML = APP.pages.map(([id, label]) => `<button data-page="${id}" class="${MEM.page === id ? "on" : ""}">${esc(label)}</button>`).join("");
}
function go(id) { MEM.page = id; S._page = id; render(); }
function render() {
  nav(); const pg = APP.pages.find(p => p[0] === MEM.page) || APP.pages[0]; MEM.page = pg[0];
  try { $("#view").innerHTML = pg[2](); if (APP.after) APP.after(pg[0]); }
  catch (e) { $("#view").innerHTML = `<div class="card bad">This page hit an error: ${esc(e && e.stack || e)}</div>`; console.error(e); }
}

  S = Object.assign(APP.defaults(), data && typeof data === "object" ? data : {});
  if (S._theme) document.body.dataset.theme = S._theme;
  MEM.page = S._page || APP.pages[0][0]; render();
}
const ACT = {
  theme() { S._theme = document.body.dataset.theme === "dark" ? "" : "dark"; document.body.dataset.theme = S._theme; save(); },
  rowadd(path) { const a = getP(path) || []; const t = APP.rowTemplates && APP.rowTemplates[path]; a.push(t ? t() : {}); setP(path, a); save(); render(); },

  const el = e.target, p = el.dataset && el.dataset.p; if (!p) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.num !== undefined) v = num(v);
  setP(p, v); save();
  if (final && el.dataset.r !== undefined) render();

document.addEventListener("input", e => { if (e.target.tagName === "SELECT" || e.target.type === "checkbox") return; onField(e, false); });
document.addEventListener("change", e => { if (e.target.type === "file") { const a = e.target.dataset.file; if (a && ACT[a]) ACT[a]([...e.target.files], e.target); return; } onField(e, true); });

  const pg = e.target.closest("[data-page]"); if (pg) { go(pg.dataset.page); return; }
  const l = e.target.closest(".lnk"); if (l) { openLink(l.dataset.url); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const f = ACT[b.dataset.act]; if (!f) return;

  const d = e.data; if (!d || typeof d.uds !== "string") return;
  if (d.uds === "store") { if (!loaded) { useLocal = false; boot(d.data && d.data[APP.key] ? d.data[APP.key] : readLocal()); } }
  else if (d.uds === "store-error") toast("Couldn't save: " + (d.note || ""), 6000);
  else if (d.uds === "web-state") WEB_ON = !!d.on;
  else if (d.uds === "exported" || d.uds === "exporting") toast(d.note || (d.ok ? "Saved." : "Not saved."));
  else if (d.uds === "planner" && AIQ[d.id]) { if (d.done) { const cb = AIQ[d.id]; delete AIQ[d.id]; cb(d.error ? { error: d.error } : { text: d.text || "" }); } }
});
</script>
<script>

const PRESETS = {
  "Online shop": [["Visitors", 20000], ["Product views", 45], ["Add to cart", 18], ["Checkout", 55], ["Purchase", 60]],
  "Software free trial": [["Visitors", 10000], ["Sign-up page", 30], ["Trial started", 25], ["Activated", 40], ["Paid", 20]],
  "Webinar lead gen": [["Ad clicks", 5000], ["Registered", 35], ["Attended", 40], ["Booked a call", 15], ["Customer", 30]],
  "App install": [["Impressions", 500000], ["Store visits", 2], ["Installs", 30], ["Day-7 active", 25], ["Subscriber", 5]],
  "Creator support": [["Viewers", 30000], ["Profile visits", 4], ["Follows", 20], ["Supporters", 3]],
};
const APP = {
  key: "funnel", title: "Funnel Suite",
  defaults: () => ({
    stages: PRESETS["Online shop"].map(([name, v], i) => ({ name, v })), preset: "Online shop",
    money: { aov: 45, margin: 40, spend: 6000, repeat: 1.6, monthly: false, churn: 5 },
    ab: { na: 5000, ca: 200, nb: 5000, cb: 240, base: 4, mde: 10, power: 80, alpha: 5 },
    utm: { url: "https://example.com/product", source: "newsletter", medium: "email", campaign: "spring_launch", term: "", content: "", saved: [] },
    seq: [{ day: 0, subject: "Welcome! Here's what you get", goal: "Set expectations" }, { day: 2, subject: "The one thing most people miss", goal: "Value" }, { day: 5, subject: "How others use it", goal: "Social proof" }, { day: 8, subject: "Your offer ends soon", goal: "Convert" }],
  }),
  rowTemplates: { stages: () => ({ name: "New stage", v: 50 }), seq: () => ({ day: 10, subject: "", goal: "" }) },
  pages: [["build", "🔻 Funnel", pageBuild], ["lever", "🎯 Biggest lever", pageLever], ["ab", "🧪 A/B test", pageAB], ["utm", "🔗 UTM links", pageUTM], ["seq", "✉ Sequences", pageSeq]],
  selftest,
};
function counts(st) { st = st || S.stages; const out = []; st.forEach((s, i) => out.push(i === 0 ? num(s.v) : out[i - 1] * num(s.v) / 100)); return out; }
function econ(st) { const c = counts(st), m = S.money, buyers = c[c.length - 1] || 0, rev = buyers * num(m.aov) * num(m.repeat), gross = rev * num(m.margin) / 100;
  return { buyers, rev, gross, roas: num(m.spend) ? rev / num(m.spend) : 0, cac: buyers ? num(m.spend) / buyers : 0, profit: gross - num(m.spend), ltv: num(m.aov) * num(m.repeat) * num(m.margin) / 100, cpv: c[0] ? num(m.spend) / c[0] : 0 }; }
function funnelSVG(st) { const c = counts(st), W = 700, bh = 40, H = c.length * (bh + 8) + 10, max = c[0] || 1;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">` + c.map((v, i) => { const w = Math.max(4, (W - 260) * v / max), x = 130 + (W - 260 - w) / 2, y = 5 + i * (bh + 8);
    return `<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="4" fill="var(--s1)" opacity="${1 - i * 0.12}"><title>${esc(st[i].name)}: ${fmt(v, 0)}</title></rect><text class="ink" x="124" y="${y + 25}" text-anchor="end">${esc(st[i].name)}</text><text x="${W - 124}" y="${y + 25}">${fmt(v, 0)}${i ? ` · ${num(st[i].v)}%` : ""}</text>`; }).join("") + "</svg>"; }
function pageBuild() {
  const c = counts(), M = econ();
  return `<h2>Funnel</h2><p class="lead">The first stage is a count; every later stage is the % of the stage before that moves on. Change any number and the money updates.</p>
  <div class="card">Start from: ${Object.keys(PRESETS).map(k => `<button data-act="preset" data-arg="${esc(k)}" class="${S.preset === k ? "pri" : ""}">${esc(k)}</button>`).join(" ")}</div>
  <div class="row"><div class="card" style="max-width:430px">${TBL("stages", [["name", "Stage", "text"], ["v", "Count / % moving on", "number", "130px"]], { live: true, extra: [["People", (r, i) => fmt(c[i], 0)]] })}
  <h4>Money</h4><div class="row">${F("Average order ($)", "money.aov", { r: 1 })}${F("Orders per customer", "money.repeat", { r: 1 })}${F("Gross margin %", "money.margin", { r: 1 })}${F("Spend ($)", "money.spend", { r: 1 })}</div>
  <button data-act="csv">⬇ Funnel (.csv)</button></div><div class="card">${funnelSVG(S.stages)}
  <div class="grid">${[["Customers", fmt(M.buyers, 0)], ["Revenue", "$" + fmt(M.rev, 0)], ["Gross profit after spend", "$" + fmt(M.profit, 0)], ["Return on ad spend", fmt(M.roas, 2) + "×"], ["Cost per customer", "$" + fmt(M.cac, 2)], ["Customer value (margin)", "$" + fmt(M.ltv, 2)], ["Overall conversion", pct(c[c.length - 1] / (c[0] || 1))], ["Cost per top-stage person", "$" + fmt(M.cpv, 3)]]
    .map(([k, v]) => `<div class="card"><div class="stat">${v}</div><div class="sub">${k}</div></div>`).join("")}</div>
  ${M.cac > M.ltv ? `<div class="banner">Each customer costs more ($${fmt(M.cac, 2)}) than they bring in margin ($${fmt(M.ltv, 2)}). See "Biggest lever".</div>` : ""}</div></div>`;
}
function levers() { const base = econ().gross; return S.stages.map((s, i) => { const st = S.stages.map((x, j) => ({ ...x, v: j === i ? (i === 0 ? num(x.v) * 1.1 : Math.min(100, num(x.v) * 1.1)) : x.v })); return { name: s.name, gain: econ(st).gross - base }; }).sort((a, b) => b.gain - a.gain); }
function pageLever() { const L = levers();
  return `<h2>Biggest lever</h2><p class="lead">If each stage got 10% better on its own (more traffic for the first one), how much more gross profit would you make? Fix the top one first.</p>
  <div class="card">${barChart(L.map(l => ({ name: l.name, v: Math.max(0, l.gain) })), { one: 1, f: v => "$" + fmt(v, 0), lw: 160 })}
  <p>Best first move: <b>${esc(L[0].name)}</b> (+$${fmt(L[0].gain, 0)}). ${L[0].name === S.stages[0].name ? "Getting more people in costs money too: check the cost per person first." : "Improving a later stage is usually cheaper than buying more traffic."}</p></div>`; }
function normCdf(z) { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2), p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
function normInv(p) { let lo = -10, hi = 10; for (let i = 0; i < 100; i++) { const m = (lo + hi) / 2; if (normCdf(m) < p) lo = m; else hi = m; } return (lo + hi) / 2; }
function abTest(a) { const pa = num(a.ca) / num(a.na), pb = num(a.cb) / num(a.nb), pp = (num(a.ca) + num(a.cb)) / (num(a.na) + num(a.nb)), se = Math.sqrt(pp * (1 - pp) * (1 / num(a.na) + 1 / num(a.nb))), z = (pb - pa) / (se || 1e-12);
  const p = 2 * (1 - normCdf(Math.abs(z))), se2 = Math.sqrt(pa * (1 - pa) / num(a.na) + pb * (1 - pb) / num(a.nb)); return { pa, pb, lift: (pb - pa) / (pa || 1e-12), z, p, lo: pb - pa - 1.96 * se2, hi: pb - pa + 1.96 * se2 }; }
function sampleSize(a) { const p1 = num(a.base) / 100, p2 = p1 * (1 + num(a.mde) / 100), za = normInv(1 - num(a.alpha) / 200), zb = normInv(num(a.power) / 100), pbar = (p1 + p2) / 2;
  return Math.ceil(((za * Math.sqrt(2 * pbar * (1 - pbar)) + zb * Math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))) ** 2) / ((p2 - p1) ** 2)); }
function pageAB() { const r = abTest(S.ab), n = sampleSize(S.ab), sig = r.p < num(S.ab.alpha) / 100;
  return `<h2>A/B test</h2><div class="row"><div class="card"><h3>Did B beat A?</h3><div class="row">${F("A visitors", "ab.na", { r: 1 })}${F("A conversions", "ab.ca", { r: 1 })}${F("B visitors", "ab.nb", { r: 1 })}${F("B conversions", "ab.cb", { r: 1 })}</div>
  <table><tr><td>A rate</td><td class="num">${pct(r.pa)}</td></tr><tr><td>B rate</td><td class="num">${pct(r.pb)}</td></tr><tr><td>Lift</td><td class="num"><b>${pct(r.lift)}</b></td></tr><tr><td>p-value (two-sided)</td><td class="num">${r.p.toFixed(4)}</td></tr><tr><td>95% range of the difference</td><td class="num">${pct(r.lo)} … ${pct(r.hi)}</td></tr></table>
  <p class="stat ${sig ? "ok" : "warnc"}">${sig ? "✔ Real difference" : "Not sure yet"}</p><p class="sub">${sig ? "At your significance level, B's result is unlikely to be luck." : "Keep the test running or accept that A and B perform about the same."}</p></div>
  <div class="card"><h3>How many visitors do I need?</h3><div class="row">${F("Current conversion %", "ab.base", { r: 1 })}${F("Smallest lift worth finding (%)", "ab.mde", { r: 1 })}${F("Power %", "ab.power", { r: 1 })}${F("Significance %", "ab.alpha", { r: 1 })}</div>
  <p class="stat">${fmt(n, 0)}</p><p class="sub">visitors in <b>each</b> version (${fmt(2 * n, 0)} total).</p></div></div>`; }
function utmURL(u) { u = u || S.utm; let url; try { url = new URL(u.url); } catch (e) { return ""; } for (const k of ["source", "medium", "campaign", "term", "content"]) if (String(u[k] || "").trim()) url.searchParams.set("utm_" + k, String(u[k]).trim().toLowerCase().replace(/\s+/g, "_")); return url.toString(); }
function pageUTM() { const link = utmURL();
  return `<h2>UTM links</h2><p class="lead">Tag links so your analytics shows which post, email or ad each visitor came from. Lower case and underscores keep reports tidy.</p>
  <div class="row"><div class="card" style="max-width:440px">${F("Page address", "utm.url", { r: 1 })}<div class="row">${F("Source (where)", "utm.source", { r: 1 })}${F("Medium (what kind)", "utm.medium", { r: 1 })}</div>${F("Campaign", "utm.campaign", { r: 1 })}<div class="row">${F("Term (keyword)", "utm.term", { r: 1 })}${F("Content (which version)", "utm.content", { r: 1 })}</div>
  <pre id="utm">${esc(link || "Enter a full address starting with https://")}</pre><button data-act="utmCopy" class="pri">Copy</button> <button data-act="utmSave">Save to list</button></div>
  <div class="card"><h3>Saved links</h3><table><tr><th>Campaign</th><th>Source / medium</th><th>Link</th><th></th></tr>${S.utm.saved.map((s, i) => `<tr><td>${esc(s.campaign)}</td><td>${esc(s.source)} / ${esc(s.medium)}</td><td class="mono" style="word-break:break-all">${esc(s.link)}</td><td><button class="x" data-act="rowdel" data-arg="utm.saved|${i}">✕</button></td></tr>`).join("")}</table><button data-act="utmCsv">⬇ Links (.csv)</button></div></div>`; }
function pageSeq() { const s = [...S.seq].sort((a, b) => num(a.day) - num(b.day)), last = Math.max(1, ...s.map(x => num(x.day)));
  return `<h2>Nurture sequences</h2><p class="lead">Plan the emails or messages that follow a sign-up. This is a plan only: nothing is sent from here.</p>
  <div class="row"><div class="card">${TBL("seq", [["day", "Day", "number", "70px"], ["subject", "Subject", "text"], ["goal", "Goal", ["Set expectations", "Value", "Social proof", "Overcome doubts", "Convert", "Re-engage", "Ask for review"]]], { live: true })}<button data-act="seqCsv">⬇ Plan (.csv)</button></div>
  <div class="card"><h3>Timeline</h3><svg viewBox="0 0 640 ${s.length * 36 + 30}" width="100%" style="max-width:640px"><line x1="20" y1="18" x2="620" y2="18" stroke="var(--line)" stroke-width="2"/>${s.map((x, i) => { const X = 20 + 600 * num(x.day) / last;
    return `<circle cx="${X}" cy="18" r="6" fill="var(--s${(i % 8) + 1})"/><line x1="${X}" y1="24" x2="${X}" y2="${40 + i * 36}" stroke="var(--line)"/><text class="ink" x="${Math.min(X + 6, 420)}" y="${44 + i * 36}">Day ${num(x.day)}: ${esc(x.subject || "(no subject)")}</text>`; }).join("")}</svg></div></div>`; }
Object.assign(ACT, {
  preset(k) { S.stages = PRESETS[k].map(([name, v]) => ({ name, v })); S.preset = k; save(); render(); },
  csv() { const c = counts(); download("funnel.csv", toCSV([["Stage", "% moving on", "People"], ...S.stages.map((s, i) => [s.name, i ? s.v : "", Math.round(c[i])])]), "text/csv"); },
  utmCopy() { copyText(utmURL()); },
  utmSave() { const l = utmURL(); if (!l) return toast("Enter a full address first."); S.utm.saved.unshift({ link: l, campaign: S.utm.campaign, source: S.utm.source, medium: S.utm.medium }); save(); render(); },
  utmCsv() { download("utm_links.csv", toCSV([["Campaign", "Source", "Medium", "Link"], ...S.utm.saved.map(s => [s.campaign, s.source, s.medium, s.link])]), "text/csv"); },
  seqCsv() { download("sequence_plan.csv", toCSV([["Day", "Subject", "Goal"], ...S.seq.map(s => [s.day, s.subject, s.goal])]), "text/csv"); },
});
function selftest() { const keep = S, fail = [], out = {}; S = APP.defaults();
  try { const c = counts(); if (Math.round(c[4]) !== Math.round(20000 * .45 * .18 * .55 * .6)) fail.push("counts " + c);
    const r = abTest({ na: 1000, ca: 100, nb: 1000, cb: 130 }); out.ab = [r.z.toFixed(3), r.p.toFixed(4)]; if (Math.abs(r.z - 2.10) > 0.02) fail.push("z " + r.z);
    const n = sampleSize({ base: 10, mde: 20, power: 80, alpha: 5 }); out.n = n; if (Math.abs(n - 3841) > 60) fail.push("sample size " + n);
    if (Math.abs(normCdf(1.96) - 0.975) > 0.001) fail.push("cdf");
    const u = utmURL({ url: "https://a.com/x?y=1", source: "News Letter", medium: "email", campaign: "c", term: "", content: "" }); if (u !== "https://a.com/x?y=1&utm_source=news_letter&utm_medium=email&utm_campaign=c") fail.push("utm " + u);
    if (levers().length !== S.stages.length) fail.push("levers");
  } catch (e) { fail.push("exception " + e.stack); } finally { S = keep; } return { fail, out }; }

</script>

if (inApp) { tell({ uds: "store-get" }); tell({ uds: "web-hello" }); setTimeout(() => { if (!loaded) { useLocal = true; boot(readLocal()); } }, 1500); }
else boot(readLocal());
