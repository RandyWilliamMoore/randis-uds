<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bot Farm</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1020;--panel:#161a33;--panel2:#1d2244;--ink:#eef0ff;--mute:#9aa0c8;--line:#2e3566;--acc:#8fe3ff;--acc2:#ff9fe0;--good:#7dffb0;--bad:#ff7d8f;--gold:#ffd66b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 70% -10%,#2a2366 0,#0d1020 60%);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:linear-gradient(135deg,#5b6cff,#c06bff);border:0;color:#fff}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:#0f1330;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{resize:vertical;width:100%}
.mute{color:var(--mute)} .small{font-size:12px} .good{color:var(--good)} .bad{color:var(--bad)} .gold{color:var(--gold)}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(13,16,32,.8)}
header h1{font-size:18px;margin:0;letter-spacing:.5px;background:linear-gradient(90deg,#8fe3ff,#ff9fe0,#ffd66b);-webkit-background-clip:text;background-clip:text;color:transparent}
.attrib{margin-left:auto;font-size:11px;color:var(--mute)} .attrib a{color:var(--mute)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs .t{padding:6px 12px;border-radius:9px 9px 0 0;border:1px solid transparent;cursor:pointer;color:var(--mute);user-select:none}
.tabs .t[data-on="1"]{color:var(--ink);background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel)}
.main-tabs .t{font-size:15px;font-weight:600}
.subbar{padding:6px 12px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.view{flex:1;min-height:0;position:relative;overflow:auto}
.pad{padding:14px}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:99;pointer-events:none}
#toast div{background:#1f2550ee;border:1px solid var(--acc);padding:8px 14px;border-radius:10px;box-shadow:0 6px 20px #0008;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.grid{display:grid;gap:14px}
h2{font-size:16px;margin:0 0 8px} h3{font-size:14px;margin:10px 0 6px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px} .kv b{color:var(--mute);font-weight:500}
pre{white-space:pre-wrap;word-break:break-word;background:#0b0e22;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:420px;overflow:auto;font-size:12px}

.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;padding:18px}
.gcard{--g1:#9b5cff;--g2:#5cc8ff;--g3:#ff7ad9;position:relative;width:100%;max-width:330px;aspect-ratio:63/88;border-radius:16px;padding:9px;cursor:pointer;
  background:linear-gradient(135deg,var(--g1),var(--g2) 50%,var(--g3));box-shadow:0 10px 30px #0009,0 0 0 2px #ffffff30 inset;transform-style:preserve-3d;transition:transform .15s ease-out;justify-self:center}
.gcard .facets{position:absolute;inset:0;border-radius:16px;pointer-events:none;mix-blend-mode:overlay;opacity:.75;
  background:conic-gradient(from 30deg at 30% 20%,#fff6 0 8%,transparent 8% 20%,#fff3 20% 26%,transparent 26% 45%,#fff5 45% 50%,transparent 50% 70%,#fff3 70% 78%,transparent 78%),
  conic-gradient(from 200deg at 75% 80%,#fff4 0 10%,transparent 10% 30%,#fff2 30% 40%,transparent 40% 62%,#fff4 62% 68%,transparent 68%)}
.gcard .foil{position:absolute;inset:0;border-radius:16px;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;
  background:repeating-linear-gradient(115deg,#ff000000 0,#ff6ad533 6%,#6affe633 12%,#fff36a33 18%,#7a6aff33 24%,#ff000000 30%);background-size:220% 220%;background-position:var(--fx,50%) var(--fy,50%)}
.gcard .glare{position:absolute;inset:0;border-radius:16px;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),#ffffff55,transparent 45%);mix-blend-mode:soft-light}
.gcard .sparkle{position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;box-shadow:0 0 8px 2px #fff;pointer-events:none;animation:tw 2.6s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.gin{position:relative;height:100%;border-radius:11px;background:linear-gradient(180deg,#fdfbff,#e9e4ff);color:#1b1640;display:flex;flex-direction:column;padding:7px 9px;gap:5px;overflow:hidden;
  box-shadow:0 0 0 3px #ffffffa0 inset,0 0 18px #ffffff80 inset}
.ghead{display:flex;align-items:baseline;gap:6px}
.ghead .stage{font-size:10px;font-weight:700;background:#1b1640;color:#fff;border-radius:8px;padding:1px 6px}
.ghead .nm{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead .hp{font-weight:800;font-size:15px;color:#c0124a} .ghead .hp small{font-size:9px;margin-right:2px}
.gem{display:inline-block;width:16px;height:16px;vertical-align:-3px;clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);background:linear-gradient(135deg,#fff,var(--g1) 40%,var(--g2));box-shadow:0 0 6px var(--g1)}
.gart{position:relative;height:44%;border-radius:6px;overflow:hidden;border:3px solid;border-image:linear-gradient(135deg,#fff,var(--g1),#fff,var(--g2),#fff) 1;background:#223}
.gart img{width:100%;height:100%;object-fit:cover;display:block}
.gart .crys{position:absolute;inset:0;background:linear-gradient(125deg,transparent 30%,#ffffff40 45%,transparent 55%);background-size:300% 300%;animation:sheen 5s infinite linear;mix-blend-mode:screen}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
.gstrip{font-size:10px;text-align:center;background:linear-gradient(90deg,#d8d2ff,#fff,#d8f3ff);border-radius:4px;padding:2px 4px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmove{display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;font-size:11px;border-bottom:1px solid #1b164020;padding-bottom:3px}
.gmove .cost{display:flex;gap:1px}
.gmove .cost .gem{width:11px;height:11px}
.gmove b{font-size:12.5px} .gmove .dmg{font-weight:800;font-size:14px} .gmove .d{grid-column:1/-1;color:#4b4575;font-size:10px;line-height:1.25}
.gfoot{margin-top:auto;display:grid;grid-template-columns:1fr 1fr 1fr;font-size:9.5px;text-align:center;gap:2px}
.gfoot div{background:#1b164010;border-radius:4px;padding:1px 2px} .gfoot b{display:block;font-size:11px}
.gflav{font-size:9.5px;font-style:italic;color:#3d3768;border:1px solid #1b164030;border-radius:4px;padding:3px 5px;max-height:44px;overflow:hidden}
.gset{display:flex;justify-content:space-between;font-size:8.5px;color:#4b4575}
.rar{letter-spacing:1px}

.detail{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:18px;padding:16px;align-items:start}
.cardtabs .t{font-size:12.5px}
.cardpane{background:var(--panel);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:12px;min-height:300px}
.chatlog{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.msg{padding:6px 9px;border-radius:9px;background:#232a57;max-width:90%} .msg[data-who="you"]{align-self:flex-end;background:#3a2f6e}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.item{background:#0f1330;border:1px solid var(--line);border-radius:10px;padding:7px;text-align:center;font-size:12px}
.item .ic{font-size:26px;line-height:1.1} .item[data-r="rare"]{border-color:#5cc8ff} .item[data-r="epic"]{border-color:#c06bff;box-shadow:0 0 10px #c06bff55} .item[data-r="legend"]{border-color:#ffd66b;box-shadow:0 0 12px #ffd66b77}
.bar{height:8px;background:#0b0e22;border-radius:5px;overflow:hidden} .bar i{display:block;height:100%;background:linear-gradient(90deg,#5cc8ff,#c06bff)}

.world{position:absolute;inset:0}
.world canvas{width:100%;height:100%;display:block;cursor:grab}
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#1b1640;border-radius:12px;padding:5px 9px;font-size:12px;max-width:220px;box-shadow:0 4px 12px #0006;white-space:normal}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
.heart{position:absolute;pointer-events:none;font-size:20px;transform:translate(-50%,-50%);animation:heartup 1.5s ease-out forwards;text-shadow:0 2px 6px #0006}
@keyframes heartup{to{transform:translate(-50%,-90px) scale(1.5) rotate(var(--rot,0deg));opacity:0}}
.moodbar{height:6px;background:#0b0e22;border-radius:4px;overflow:hidden;margin:3px 0} .moodbar i{display:block;height:100%;background:linear-gradient(90deg,#ff9fd0,#ff3b6b)}
.tag{position:absolute;transform:translate(-50%,0);font-size:11px;background:#0d1020b0;border-radius:6px;padding:1px 6px;white-space:nowrap}
.hud{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;max-width:300px}
.hud .panel{background:#161a33e8;padding:9px}
.hudr{position:absolute;top:10px;right:10px;width:260px}
.hudr .panel{background:#161a33e8}
.feed{position:absolute;left:10px;bottom:10px;width:330px;max-height:32%;overflow:auto;font-size:12px;background:#0d1020b8;border-radius:10px;padding:6px 9px}
.feed div{border-bottom:1px solid #ffffff10;padding:2px 0}

.studio{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:14px;height:100%}
.studio .pv{position:relative;height:420px;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#3b3a7a,#141633)}
.studio .pv canvas{width:100%;height:100%}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid #fff3;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 9px;border-radius:14px;background:#0f1330;border:1px solid var(--line);cursor:pointer;font-size:12px}
.chip[data-on="1"]{border-color:var(--acc);background:#20306a}
.rpg{display:grid;grid-template-columns:1fr 300px;gap:14px;padding:14px}
.rpg canvas{width:100%;max-width:840px;image-rendering:pixelated;border-radius:10px;border:1px solid var(--line);background:#000;display:block}
.battle{position:absolute;inset:0;background:#05061aee;display:flex;align-items:center;justify-content:center;z-index:5}
.battle .box{width:min(720px,94%);background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:14px}
.fighters{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end}
.fighter{text-align:center} .fighter img{width:190px;height:190px;object-fit:contain} .fighter canvas{background:transparent!important;border:0!important;width:140px!important}
.blog{height:110px;overflow:auto;font-size:12.5px;background:#0b0e22;border-radius:8px;padding:6px;margin:8px 0}
.forum{display:grid;grid-template-columns:220px 1fr;gap:14px;padding:14px;height:100%}
.thread{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;background:var(--panel);cursor:pointer}
.post{display:grid;grid-template-columns:48px 1fr;gap:9px;border-bottom:1px solid var(--line);padding:9px 0}
.post img{width:48px;height:48px;border-radius:10px;background:#223}
.board{padding:6px 9px;border-radius:8px;cursor:pointer} .board[data-on="1"]{background:var(--panel2);color:var(--acc)}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>Bot Farm</h1>
  <div class="tabs main-tabs" id="mainTabs"></div>
  <span id="aiState" class="small mute"></span>
  <div class="attrib">Randis UDS™ by Randy Moore · <a href="https://github.com/RandyWilliamMoore/randis-uds" target="_blank">original</a> · <a href="https://ko-fi.com/moorescombinatoricsmatrix" target="_blank">support</a></div>
 </header>
 <div class="subbar hidden" id="subbar"><div class="tabs" id="subTabs"></div></div>
 <div class="view" id="view"></div>
</div>
<div id="toast"></div>
<script>

"use strict";
const $ = (s, r = document) => r.querySelector(s);
const mk = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(e.dataset, v);
    else if (v !== undefined && v !== null && v !== false) { if (k in e && k !== "list") e[k] = v; else e.setAttribute(k, v); }
  }
  for (const c of kids.flat(9)) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = hash(seed) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const fmtK = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(Math.round(n || 0));
const today = () => new Date().toISOString().slice(0, 10);
function toast(t) { const d = mk("div", {}, t); $("#toast").append(d); setTimeout(() => d.remove(), 4200); }

const IN_APP = window.parent !== window;
let REQ = 0; const WAIT = {};
window.addEventListener("message", e => {
  const d = e.data || {};
  if (d.uds === "codelab" && WAIT[d.id]) { WAIT[d.id](d.r || {}); delete WAIT[d.id]; }
  if (d.uds === "store" && WAIT.store) { WAIT.store(d.data || {}); delete WAIT.store; }
  if (d.uds === "store-error") toast("Couldn't save: " + d.note);
});
function call(op, args = {}, ms = 330000) {
  if (!IN_APP) return Promise.resolve({ error: "Open this tab inside Randis UDS to reach the bots." });
  const id = "f" + (++REQ);
  return new Promise(res => {
    WAIT[id] = res;
    setTimeout(() => { if (WAIT[id]) { delete WAIT[id]; res({ error: "No answer from the app. Restart Randis UDS so it knows Bot Farm." }); } }, ms);
    parent.postMessage({ uds: "codelab", id, op, args }, "*");
  });
}
function storeGet() {
  if (!IN_APP) { try { return Promise.resolve(JSON.parse(localStorage.getItem("botfarm") || "{}")); } catch (_) { return Promise.resolve({}); } }
  return new Promise(res => { WAIT.store = res; parent.postMessage({ uds: "store-get" }, "*"); setTimeout(() => { if (WAIT.store) { delete WAIT.store; res({}); } }, 8000); });
}
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    trimSave();
    if (!IN_APP) { try { localStorage.setItem("botfarm", JSON.stringify(S)); } catch (_) {} return; }
    parent.postMessage({ uds: "store-set", data: S }, "*");
  }, 600);
}
function trimSave() {
  S.forum.threads = S.forum.threads.slice(-120);
  for (const t of S.forum.threads) t.posts = t.posts.slice(-40);
  S.feed = (S.feed || []).slice(-60);
}
async function askAI(history, context, max = 900) {
  const r = await call("farm-ask", { history, context, max }, 30000);
  if (r.error) return { error: r.error };
  if (!r.job) return { error: "The AI didn't start." };
  for (let i = 0; i < 240; i++) {
    await new Promise(z => setTimeout(z, 1000));
    const p = await call("farm-poll", { job: r.job }, 20000);
    if (p.done) return p.error ? { error: p.error } : { text: p.text || "" };
  }
  return { error: "The AI took too long." };
}
const jsonFrom = t => { const m = String(t || "").match(/```json\s*([\s\S]*?)```/) || String(t || "").match(/(\{[\s\S]*\}|\[[\s\S]*\])/); try { return JSON.parse(m ? m[1] : t); } catch (_) { return null; } };

let S = null;
let D = null;
const DEFAULT_STATE = () => ({ v: 1, animals: {}, forum: { threads: [] }, feed: [], settings: { aiChatter: false, labels: true, sound: true }, daily: {} });

const DEMO = () => {
  const mkb = (id, name, label, runs, fails, secs, tin, tout, lvl) => ({ id, name, label, job: `Demo ${label.toLowerCase()} bot.`, where: "the app", status: "approved", running: runs % 2 === 0, trigger: { every: 60 },
    perms: { level: lvl, features: { read: true, edit: lvl !== "read", run: lvl === "full", web: lvl === "full" } },
    state: { runs, fails, last_seconds: secs, seconds: secs * runs, last_end: "2026-11-17 10:20:00", last_summary: "Looked over the newest version and found 2 small things.", tokens: { in: tin, out: tout, cost_usd: tin / 1e6 * 3 } } });
  return { bots: [mkb("B001", "garden_helper1", "Garden helper", 14, 2, 41, 220000, 18000, "read"), mkb("B002", "pantry_keeper1", "Pantry keeper", 6, 0, 22, 90000, 6000, "custom"),
    mkb("B003", "lantern_lighter1", "Lantern lighter", 3, 1, 65, 300000, 40000, "full")], usage: {}, chats: {}, duties: {}, card_tabs: {}, group: [], bus: [], record: {},
    app: { tabs: 77, versions: 412, duck_versions: 14, history_lines: 120, snapshots: 300, voices: 4, tab_names: [{ id: "x", name: "Demo tab", versions: 3 }], now: new Date().toISOString() } };
};

function M(b) {
  const st = b.state || {}, tok = st.tokens || {};
  const runs = st.runs || 0, fails = st.fails || 0;
  const u = (D.usage || {})[b.name] || {};
  const chats = ((D.chats || {})[b.name] || []).length;
  const tokens = (tok.in || 0) + (tok.out || 0) + (tok.cache_read || 0) + (tok.cache_write || 0) || u.tokens || 0;
  const feats = ((b.perms || {}).features) || {};
  return { runs, fails, ok: runs - fails, success: runs ? Math.round(100 * (runs - fails) / runs) : 0, secs: st.last_seconds || 0, working: Math.round(st.seconds || 0),
    tokens, tin: tok.in || 0, tout: tok.out || 0, cost: tok.cost_usd || 0, chats, events: u.events || 0, running: !!b.running, level: (b.perms || {}).level || "read",
    feats, nfeats: Object.values(feats).filter(Boolean).length, questions: b.questions || 0, tabs: (b.tabs || []).length, lastEnd: st.last_end || "", summary: st.last_summary || "" };
}
const GEMS = [["Amethyst", "#9b5cff", "#d6b8ff", "#5b2bd1"], ["Sapphire", "#3f7bff", "#9fd0ff", "#1a3fb3"], ["Emerald", "#1fcf8a", "#a8ffd8", "#0b7a4e"], ["Ruby", "#ff3b6b", "#ffb0c4", "#a3123a"],
  ["Topaz", "#ff9f3b", "#ffe0a8", "#b35b0b"], ["Citrine", "#ffd23b", "#fff4b0", "#b38f0b"], ["Opal", "#7affea", "#ffd2f7", "#5aa7ff"], ["Diamond", "#d8f2ff", "#ffffff", "#8fb4d9"],
  ["Aquamarine", "#3bf0ff", "#c8fbff", "#0b8fa3"], ["Onyx", "#5a5a7a", "#b9b9e0", "#1d1d33"]];
const gemOf = b => GEMS[hash(b.label || b.name) % GEMS.length];
function rarity(m) { const s = m.runs + m.chats + Math.log10(1 + m.tokens) * 2; return s >= 60 ? ["legend", "◆◆◆◆"] : s >= 25 ? ["epic", "◆◆◆"] : s >= 8 ? ["rare", "◆◆"] : ["common", "◆"]; }

function mood(a) { if (!a || a.host) return 100; const h = (Date.now() - (a.moodAt || Date.now())) / 3600000; return Math.max(0, Math.round((a.mood ?? 50) - h * 3)); }
function cheer(a, n) { const now = mood(a); a.mood = Math.min(100, now + n); a.moodAt = Date.now(); }
const moodWord = v => v >= 85 ? "overjoyed" : v >= 65 ? "happy" : v >= 40 ? "content" : v >= 20 ? "a bit lonely" : "lonely";
function A(name) { return S.animals[name]; }
function stats(b) {
  const m = M(b), a = A(b.name), lv = a.level;
  const gear = (a.worn ? Object.values(a.worn) : []).length;
  return { hp: 30 + lv * 8 + Math.round(m.success / 4) + gear * 2, mp: 10 + Math.round(Math.log10(1 + m.tokens) * 3) + lv * 2,
    atk: 5 + Math.min(25, m.runs) + lv * 2 + (a.skills.includes("Power Paws") ? 4 : 0), def: 3 + Math.round(m.success / 12) + lv + (a.skills.includes("Thick Coat") ? 3 : 0),
    spd: 4 + clamp(Math.round(60 / Math.max(5, m.secs || 60) * 4), 0, 12) + lv + (a.skills.includes("Fast Feet") ? 3 : 0), luck: 2 + m.nfeats * 2 + (a.skills.includes("Treasure Nose") ? 5 : 0) + (mood(a) >= 70 ? 3 : 0) };
}
const xpNeed = lv => 60 + lv * lv * 25;

const UI = { main: "cards", sub: "farm", card: null };
