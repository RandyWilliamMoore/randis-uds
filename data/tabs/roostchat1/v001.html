<html>
<head>
<meta charset="utf-8">
<title>Roost Chat</title>

<style>
:root{--bg:#f9f9f7;--bg2:#fcfcfb;--bg3:#efeee9;--line:#dcdbd5;--tx:#0b0b0b;--mut:#52514e;--acc:#0f766e;--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--bad:#d03b3b;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
body[data-theme=dark]{--bg:#0d0d0d;--bg2:#1a1a19;--bg3:#262624;--line:#383835;--tx:#f0efec;--mut:#c3c2b7;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
header b#apptitle{font-size:16px;color:var(--acc);margin-right:6px}
#nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
#nav button{border:0;background:none;padding:5px 9px;border-radius:6px;cursor:pointer;color:var(--mut)}
#nav button.on{background:var(--acc);color:#fff}
#nav button:hover:not(.on){background:var(--bg3)}
#saved{font-size:11px;color:var(--mut)}
main#view{flex:1;overflow:auto;padding:14px 18px}
h2{margin:0 0 4px;font-size:21px}h3{margin:6px 0 8px;font-size:15px;color:var(--acc)}h4{margin:10px 0 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.lead{color:var(--mut);margin:0 0 12px;max-width:980px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.row>.card{flex:1;min-width:300px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px;margin:0 0 6px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
textarea{width:100%;min-height:80px;font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg3);color:var(--tx);border-radius:6px;padding:4px 10px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.x{padding:1px 7px;color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}td input,td select{width:100%;padding:2px 4px}
.num{text-align:right;font-variant-numeric:tabular-nums}
pre,.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}pre{background:var(--bg3);padding:10px;border-radius:6px;overflow:auto;white-space:pre-wrap;margin:6px 0;max-height:420px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--bg3);color:var(--mut)}
.ok{color:var(--good)}.bad{color:var(--bad)}.warnc{color:#b7791f}
.banner{border-left:4px solid var(--serious);background:var(--bg3);padding:8px 12px;border-radius:6px;margin:0 0 12px}
.stat{font-size:26px;font-weight:600}.sub{font-size:12px;color:var(--mut)}
svg text{fill:var(--mut);font-size:11px}svg .ink{fill:var(--tx)}
.lnk{color:var(--s1);cursor:pointer;text-decoration:underline}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:80%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:4px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>

<body>

const AIQ = {};
function askAI(prompt, cb) {
  if (!inApp) { cb({ error: "Open this inside Randis UDS with an AI linked to use the AI helper." }); return; }
  const id = "q10-" + uid(); AIQ[id] = cb;
  tell({ uds: "planner-ask", id, history: [{ role: "user", content: String(prompt) }], context: APP.title + " app in Randis UDS." });

  if (o.opts) return `<label class="f">${esc(label)}<select data-p="${path}"${o.r ? " data-r" : ""}>${o.opts.map(x => { const [k, n] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(k)}"${String(v) === String(k) ? " selected" : ""}>${esc(n)}</option>`; }).join("")}</select></label>`;
  if (t === "area") return `<label class="f">${esc(label)}<textarea data-p="${path}"${o.r ? " data-r" : ""} style="min-height:${o.h || 90}px">${esc(v)}</textarea></label>`;
  if (t === "check") return `<label><input type="checkbox" data-p="${path}" data-r${v ? " checked" : ""}> ${esc(label)}</label>`;
  return `<label class="f">${esc(label)}<input type="${t}" data-p="${path}"${t === "number" ? " data-num" : ""}${o.r ? " data-r" : ""} value="${esc(v)}"${o.step ? ` step="${o.step}"` : ""}${o.w ? ` style="width:${o.w}"` : ""}></label>`; };

  o = o || {}; const rows = getP(path) || [];
  const head = cols.map(c => `<th>${esc(c[1])}</th>`).join("") + (o.extra ? o.extra.map(x => `<th>${esc(x[0])}</th>`).join("") : "") + "<th></th>";

    const p = `${path}.${i}.${k}`, v = r[k];
    if (Array.isArray(t)) return `<td${w ? ` style="width:${w}"` : ""}><select data-p="${p}" data-r>${t.map(x => `<option${String(v) === String(x) ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></td>`;

}
function barChart(items, o) {
  o = o || {}; const W = o.w || 640, bh = 22, H = items.length * (bh + 6) + 8, lw = o.lw || 150, max = Math.max(...items.map(i => i.v), 1e-9);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">` + items.map((it, i) => { const y = 4 + i * (bh + 6), w = Math.max(1, (W - lw - 90) * it.v / max);

  rowadd(path) { const a = getP(path) || []; const t = APP.rowTemplates && APP.rowTemplates[path]; a.push(t ? t() : {}); setP(path, a); save(); render(); },

  const d = e.data; if (!d || typeof d.uds !== "string") return;
  if (d.uds === "store") { if (!loaded) { useLocal = false; boot(d.data && d.data[APP.key] ? d.data[APP.key] : readLocal()); } }
  else if (d.uds === "store-error") toast("Couldn't save: " + (d.note || ""), 6000);
  else if (d.uds === "web-state") WEB_ON = !!d.on;
  else if (d.uds === "exported" || d.uds === "exporting") toast(d.note || (d.ok ? "Saved." : "Not saved."));
  else if (d.uds === "planner" && AIQ[d.id]) { if (d.done) { const cb = AIQ[d.id]; delete AIQ[d.id]; cb(d.error ? { error: d.error } : { text: d.text || "" }); } }

</script>

  const rank = c => c.pres.cls === "off" ? 1 : 0;
  const glist = Object.keys(groups).sort().map(g => { const bs = groups[g].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name)); const on = bs.filter(b => b.pres.cls !== "off").length;
    return `<div class="grp" data-act="grp" data-arg="${esc(g)}">${RT.collapsed[g] ? "▸" : "▾"} ${esc(g)} <span>(${on}/${bs.length})</span></div>` + (RT.collapsed[g] ? "" : bs.map(b => { const k = convKey(b.acct, "chat", b.jid), c = RT.convs[k];
      return `<div class="bud${RT.sel === k ? " on" : ""}" data-act="open" data-arg="${esc(b.acct + "|chat|" + b.jid)}" title="${esc(b.jid)} · sharing: ${esc(b.sub)}${b.ask ? " (asked)" : ""}"><span class="dot ${b.pres.cls}"></span>${avaSrc(b.jid) ? ava(b.name, 0, b.jid) : ""}<span class="nm">${esc(b.name)}<span class="st">${esc(b.pres.cls === "off" ? (b.ask ? "waiting for approval" : b.sub === "none" || b.sub === "from" ? "not sharing status" : "Offline") : b.pres.text)}</span></span>${c && c.unread ? `<span class="badge">${c.unread}</span>` : ""}</div>`; }).join("")); }).join("");
  const rooms = Object.values(RT.convs).filter(c => c.kind === "room").map(c => { const cl = RT.cl[c.acct], r = cl && cl.rooms[c.jid];
    return `<div class="bud${RT.sel === c.key ? " on" : ""}" data-act="open" data-arg="${esc(c.key)}"><span class="dot ${r && r.joined ? "av" : "off"}"></span><span class="nm">#${esc(c.jid.split("@")[0])}<span class="st">${r && r.joined ? Object.keys(r.occ).length + " here" : "not joined"}${esc(tagOf(c.acct))}</span></span>${c.unread ? `<span class="badge">${c.unread}</span>` : ""}</div>`; }).join("");
  const add = MEM.adding ? `<div class="card" style="margin:6px 8px"><b>Add a buddy</b>${acctSelect("add_acct")}<label class="f">Address<input id="add_jid" placeholder="bob@localhost"></label><label class="f">Name (optional)<input id="add_name"></label><label class="f">Group<input id="add_group" value="Friends"></label><button class="pri" data-act="addok">Add + ask to share status</button> <button data-act="addcancel">Cancel</button></div>` : "";
  const join = MEM.joining ? `<div class="card" style="margin:6px 8px"><b>Join a group chat</b>${acctSelect("join_acct")}<label class="f">Room<input id="join_room" placeholder="lounge@conference.localhost" value="lounge@conference.localhost"></label><label class="f">Nickname<input id="join_nick" value="${esc((S.accounts[0] && S.accounts[0].jid.split("@")[0]) || "me")}"></label><label><input type="checkbox" id="join_save"> Remember (join on sign-on)</label><br><button class="pri" data-act="joinok">Join</button> <button data-act="joincancel">Cancel</button></div>` : "";
  const c = RT.convs[RT.sel];
  const r = c && c.kind === "room" && RT.cl[c.acct] && RT.cl[c.acct].rooms[c.jid];
  const occ = r ? `<aside class="occ"><div class="grp">In the room (${Object.keys(r.occ).length})</div>${Object.entries(r.occ).sort((a, b) => a[0].localeCompare(b[0])).map(([n, o]) => `<div class="bud" data-act="pm" data-arg="${esc(n)}" title="${esc((o.jid || "") + " · " + o.role + "/" + o.aff)} (click: private message)"><span class="dot ${o.show || "av"}"></span><span class="nm">${esc(n)}${n === r.nick ? " (you)" : ""}<span class="st">${esc(o.aff === "owner" ? "owner" : o.role)}</span></span></div>`).join("")}</aside>` : "";
  const tabs = RT.order.map(k => { const cc = RT.convs[k]; return `<div class="ctab${k === RT.sel ? " on" : ""}" data-act="open" data-arg="${esc(k)}">${cc.kind === "room" ? "#" : `<span class="dot ${cc.kind === "chat" ? presOf(cc.acct, cc.jid).cls : "av"}"></span>`}${esc(title(cc))}<span class="sub" style="font-weight:400">${esc(tagOf(cc.acct))}</span>${cc.unread ? ` <span class="badge">${cc.unread}</span>` : ""}<button class="x" data-act="close" data-arg="${esc(k)}" title="Close">✕</button></div>`; }).join("");
  const main = c ? `<div class="ctabs">${tabs}</div><div class="chead">${convHead(c)}</div><div class="msgs">${messagesHtml(c)}</div>${composeHtml(c)}` :
    `<div class="empty"><h3>Nobody selected</h3><p>Pick a buddy or a room on the left. ${RT.warn[0] ? `<br><span class="bad">${esc(RT.warn[0].text)}</span>` : ""}</p></div>`;
  return `<div class="roost${occ ? " withocc" : ""}"><aside class="blist">${acctLines}<div style="padding:6px 8px;display:flex;gap:4px"><input id="bsearch" placeholder="Find a buddy…" value="${esc(MEM.q || "")}" style="flex:1"><button data-act="adding" title="Add a buddy">+👤</button><button data-act="joining" title="Join a group chat">+#</button></div>${requestsHtml()}${add}${join}<div class="scroll">${glist || `<p class="sub" style="padding:0 12px">No buddies yet${Object.values(RT.cl).some(x => x.state === "online") ? ": add one with +👤." : ": sign on first (On)."}</p>`}<div class="grp">Group chats</div>${rooms || `<p class="sub" style="padding:0 12px">None open: join one with +#.</p>`}</div>${statusBar()}</aside><section class="conv">${main}</section>${occ}</div>`;
}
function acctSelect(id) { return `<label class="f">Account<select id="${id}">${S.accounts.map(a => `<option value="${a.id}">${esc(a.jid)}</option>`).join("")}</select></label>`; }
function statusBar() {
  return `<div class="statusbar"><select id="pstatus">${PRES.map(([k, n]) => `<option value="${k}"${S.status.show === k ? " selected" : ""}>${n}</option>`).join("")}</select><input id="pstext" placeholder="Status message (optional)" value="${esc(S.status.text)}"></div>`;
}

function phoneChat() {
  const sc = S.ui.screen, c = RT.convs[RT.sel];
  let top, body, navb = true;
  if (sc === "conv" && c) {
    navb = false;
    top = `<button class="back" data-act="pback">‹</button>${convHead(c).replace(/<button data-act="topic"[^>]*>Topic<\/button>/, "")}`;
    body = `<div class="msgs">${messagesHtml(c)}</div>${composeHtml(c)}`;
  } else {
    const t = S.ui.ptab;
    if (t === "contacts") {
      top = `<b>Contacts</b><button data-act="adding">+</button>`;
      const bs = contacts().sort((a, b) => (a.pres.cls === "off") - (b.pres.cls === "off") || a.name.localeCompare(b.name));
      body = requestsHtml() + (MEM.adding ? `<div class="card" style="margin:8px">${acctSelect("add_acct")}<label class="f">Address<input id="add_jid" placeholder="bob@localhost"></label><label class="f">Name<input id="add_name"></label><label class="f">Group<input id="add_group" value="Friends"></label><button class="pri" data-act="addok">Add</button> <button data-act="addcancel">Cancel</button></div>` : "") +
        (bs.map(b => `<div class="prow" data-act="open" data-arg="${esc(b.acct + "|chat|" + b.jid)}">${ava(b.name, 40, b.jid)}<div class="nm"><b>${esc(b.name)}</b><span><span class="dot ${b.pres.cls}" style="display:inline-block;vertical-align:-1px"></span> ${esc(b.pres.cls === "off" ? (b.ask ? "waiting for approval" : "Offline") : b.pres.text)}</span></div></div>`).join("") || `<p class="sub" style="padding:14px">No contacts yet. Sign on in Me, then tap +.</p>`);
    } else if (t === "rooms") {
      top = `<b>Group chats</b><button data-act="joining">+</button>`;
      body = (MEM.joining ? `<div class="card" style="margin:8px">${acctSelect("join_acct")}<label class="f">Room<input id="join_room" value="lounge@conference.localhost"></label><label class="f">Nickname<input id="join_nick" value="${esc((S.accounts[S.accounts.length > 1 ? 1 : 0] || { jid: "me" }).jid.split("@")[0])}"></label><label><input type="checkbox" id="join_save"> Remember</label><br><button class="pri" data-act="joinok">Join</button> <button data-act="joincancel">Cancel</button></div>` : "") +
        (Object.values(RT.convs).filter(x => x.kind === "room").map(x => { const r = RT.cl[x.acct] && RT.cl[x.acct].rooms[x.jid]; return `<div class="prow" data-act="open" data-arg="${esc(x.key)}">${ava(x.jid, 40)}<div class="nm"><b>#${esc(x.jid.split("@")[0])}</b><span>${r && r.joined ? Object.keys(r.occ).length + " here · " + esc(r.subject || "no topic") : "not joined"}</span></div>${x.unread ? `<span class="badge">${x.unread}</span>` : ""}</div>`; }).join("") || `<p class="sub" style="padding:14px">No rooms yet: tap + to join one.</p>`);
    } else if (t === "me") {
      top = `<b>Me</b>`;
      body = `<div style="padding:10px">${S.accounts.map(a => `<div class="prow" style="cursor:default">${ava(a.jid, 36, a.jid)}<button data-act="myinfo" data-arg="${a.id}" title="Buddy icon + my info">🖼</button><div class="nm"><b>${esc(a.jid)}</b><span>${stateBadge(a.id)}</span></div>${RT.cl[a.id] && ["online", "connecting", "authenticating", "roster"].includes(RT.cl[a.id].state) ? `<button data-act="disc" data-arg="${a.id}">Sign off</button>` : `<button class="pri" data-act="conn" data-arg="${a.id}">Sign on</button>`}</div>`).join("")}
        <div class="card" style="margin-top:10px">${statusBar()}</div>
        <div class="grid" style="grid-template-columns:1fr 1fr"><button data-page="accounts">Accounts</button><button data-page="logs">History</button><button data-page="plugins">Plugins</button><button data-page="console">XML console</button><button data-page="about">About</button><button data-act="phone">Desktop layout</button></div>
        ${RT.warn[0] ? `<p class="bad">${esc(RT.warn[0].text)}</p>` : ""}</div>`;
    } else {
      top = `<b>Chats</b><button data-act="ptab" data-arg="contacts">✎</button>`;
      const cs = RT.order.map(k => RT.convs[k]).sort((a, b) => ((b.lines[b.lines.length - 1] || {}).t || 0) - ((a.lines[a.lines.length - 1] || {}).t || 0));
      body = requestsHtml() + (cs.map(x => { const l = x.lines.filter(y => !y.sys).slice(-1)[0]; return `<div class="prow" data-act="open" data-arg="${esc(x.key)}">${ava(title(x), 44, x.kind === "chat" ? x.jid : "")}<div class="nm"><b>${x.kind === "room" ? "#" : ""}${esc(title(x))}</b><span>${l ? esc((l.me ? "You: " : x.kind === "room" ? l.who + ": " : "") + l.body) : "No messages yet"}</span></div><div style="text-align:right">${l ? `<span class="sub">${hhmm(l.t)}</span><br>` : ""}${x.unread ? `<span class="badge">${x.unread}</span>` : ""}</div></div>`; }).join("") || `<p class="sub" style="padding:14px">No chats yet. ${S.accounts.length ? "Sign on in Me, then pick a contact." : `<button class="pri" data-act="testacct">Add local test accounts</button>`}</p>`);
    }
  }
  const tabs = [["chats", "💬", "Chats"], ["contacts", "👥", "Contacts"], ["rooms", "#", "Rooms"], ["me", "🙂", "Me"]];
  const unread = Object.values(RT.convs).reduce((s, x) => s + x.unread, 0);
  return `<div class="phonewrap"><div class="phone"><div class="ptop">${top}</div><div class="pbody">${body}</div>${navb ? `<div class="pnav">${tabs.map(([k, i, n]) => `<button class="${S.ui.ptab === k ? "on" : ""}" data-act="ptab" data-arg="${k}"><span>${i}</span>${n}${k === "chats" && unread ? ` (${unread})` : ""}</button>`).join("")}</div>` : ""}</div></div>`;
}

  <button data-act="infoclose">Close</button></div></div>`;
}

function accountsPage() {

function pouncesPage() {

  <label class="f">Buddy<input id="pn_jid" list="pn_buds" placeholder="bob@localhost" value="${esc(pre.jid || "")}"></label><datalist id="pn_buds">${bud.map(j => `<option value="${esc(j)}">`).join("")}</datalist>
