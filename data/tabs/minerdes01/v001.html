const inApp = parent !== window; let saveT = null;

V.home = () => `<h2>Miner Design Suite</h2><p class="lead">Design mining hardware and software from the ground up, and run "crowd compute" the way Foldit and Folding@home do: many helpers, each doing a checkable piece of real work.</p>
 <div class="card"><b>What stays true here</b><ul><li>Nothing connects to the internet: no pools, no wallets, no coins. The miner mines practice blocks on this computer.</li><li>Every money number comes from numbers <i>you</i> type; nothing is fetched or promised.</li><li>Crowd compute here runs on this computer's own cores (each "volunteer" is a worker thread). Sharing work with other people's computers would be a later step and needs your OK.</li></ul></div>
 <div class="card"><b>Tested</b> <span class="mut">(node, 39/39): our SHA-256 matches the official test vectors and node's crypto on 500 random inputs; it reproduces the real genesis block's hash 000000000019d6…e26f, so the block layout is right; mines a 16-bit practice block; 24 folding work units reach the best known energy (−9) for the classic 20-bead HP protein benchmark; a faked result is caught.</span></div>`;
V.design = () => { const p = Object.assign({algo: "sha256d", hw: "ASIC", hashrate: 100e12, watts: 3000, cost: 2000, kwh: .30, netHash: 600e18, blockReward: 3.125, blocksPerDay: 144, price: 0}, ST.design || {}); ST.design = p; const d = MINER.design(p), a = MINER.ALGOS[p.algo];

  return `<h2>📐 Miner designer</h2><p class="lead">Pick the work (algorithm) and the hardware, type its numbers, see efficiency and what it would earn and cost <b>with the numbers you entered</b>.</p>
  <div class="card"><div class="grid"><label class="f"><span>Algorithm</span><select onchange="ST.design.algo=this.value;save();go('design')">${Object.entries(MINER.ALGOS).map(([k, v]) => `<option value="${k}" ${k === p.algo ? "selected" : ""}>${v.name}</option>`).join("")}</select></label>

   <p class="mut">${a.note} Limited by: <b>${a.bound}</b>. Usually best on: <b>${a.best}</b>.${p.hw !== a.best.split(" ")[0] && !a.best.includes(p.hw) ? ` <span class="warn">A ${p.hw} usually loses to ${a.best} on this work.</span>` : ""}</p>

  <div class="card grid"><div><span class="mut">Efficiency</span><div class="big">${fmt(d.joulesPerHash * 1e12, "J/TH")}</div></div><div><span class="mut">Your share of the network</span><div class="big">${d.sharePct.toExponential(3)} %</div></div><div><span class="mut">Coins per day (average)</span><div class="big">${d.coinsPerDay.toExponential(3)}</div></div>
   <div><span class="mut">Electricity per day</span><div class="big">${d.powerPerDay.toFixed(2)}</div></div><div><span class="mut">Earned − electricity per day</span><div class="big ${d.profitPerDay >= 0 ? "ok" : "bad"}">${d.profitPerDay.toFixed(2)}</div></div><div><span class="mut">Pays back the hardware in</span><div class="big">${isFinite(d.breakEvenDays) ? Math.ceil(d.breakEvenDays) + " days" : "never"}</div></div></div>
  <p class="mut">Averages only: real results swing with luck, difficulty changes and price. This is a design tool, not advice.</p>`; };
V.asic = () => { const c = Object.assign({cores: 200, clockMHz: 600, cyclesPerHash: 1, pjPerHash: 15000, chips: 100, nodeNm: 5}, ST.asic || {}); ST.asic = c; const r = MINER.asic(c);

  return `<h2>🔬 Chip designer</h2><p class="lead">A first-order model of a hashing chip: how many hash cores, how fast, how many clock cycles per hash (1 = fully unrolled pipeline), and energy per hash. Change one number and see the machine.</p>
  <div class="card"><div class="grid">${inp("cores", "Hash cores per chip")}${inp("clockMHz", "Clock (MHz)")}${inp("cyclesPerHash", "Cycles per hash (1 = fully pipelined)")}${inp("pjPerHash", "Energy per hash (picojoules)")}${inp("chips", "Chips per machine")}${inp("nodeNm", "Process node (nm, for your notes)")}</div></div>
  <div class="card grid"><div><span class="mut">Machine hash rate</span><div class="big">${fmt(r.hashrate, "H/s")}</div></div><div><span class="mut">Power</span><div class="big">${fmt(r.watts, "W")}</div></div><div><span class="mut">Efficiency</span><div class="big">${r.jPerTH.toFixed(1)} J/TH</div></div></div>

V.scratch = () => `<h2>⛏️ Miner from scratch</h2><p class="lead">A complete miner, all our own code: SHA-256 written from the standard, the 80-byte block header, double hashing, and a search for a nonce whose hash starts with enough zero bits. It mines <b>practice blocks</b> only.</p>
 <div class="card"><div class="grid"><label class="f"><span>Message in the block</span><input id="msg" value="${esc(ST.msg || "Randis UDS practice block")}"></label><label class="f"><span>Difficulty (zero bits)</span><input id="bits" type="number" min="4" max="28" value="${ST.bits || 18}"></label><label class="f"><span>Helpers (threads)</span><input id="thr" type="number" min="1" max="16" value="${ST.thr || Math.max(1, (navigator.hardwareConcurrency || 4) - 1)}"></label></div>
 <button class="b pri" id="mgo" onclick="mineGo()">Start mining</button><button class="b" onclick="mineStop()">Stop</button> <span id="mst" class="mut"></span></div><div class="card"><table id="blocks"><tr><th>#</th><th>Nonce</th><th>Hash</th><th>Checked</th></tr></table></div>`;
let MW = null, mining = false;

  await Promise.all(MW.map(async w => { while (mining && !found) { const start = next; next += chunk; const r = await run(w, {job: "mine", tpl, target: ST.bits, start, count: chunk}); tried += r.tried; if (r.nonce !== null && !found) found = r; } }));
  clearInterval(tick); if (found) { const h = MINER.sha256d(MINER.header(tpl.ver, tpl.prev, tpl.merkle, tpl.time, tpl.bits, found.nonce)), okz = MINER.zeroBits(h) >= ST.bits; ST.lastHash = found.hash; ST.count = (ST.count || 0) + 1; save();
    $("#blocks").insertAdjacentHTML("beforeend", `<tr><td>${ST.count}</td><td>${found.nonce}</td><td><code>${found.hash}</code></td><td class="${okz ? "ok" : "bad"}">${okz ? "✔ re-hashed: " + MINER.zeroBits(h) + " zero bits" : "✘"}</td></tr>`); }
  const s = (performance.now() - t0) / 1000; $("#mst").textContent = (found ? `Found in ${s.toFixed(1)} s · ` : "Stopped · ") + `${fmt(tried / s, "H/s")} · ${fmt(tried, "")} hashes`; mineStop(); }
function mineStop() { mining = false; if (MW) MW.forEach(w => w && w.terminate()); MW = null; }
V.crowd = () => `<h2>🤝 Crowd compute</h2><p class="lead">Like Folding@home: a science job is cut into work units; volunteers each run units; every answer is <b>checked</b> before it counts (a fold's energy takes microseconds to re-check, so cheating doesn't pay). The job: fold a protein in the HP lattice model (Dill 1985), lowest energy wins.</p>
 <div class="card"><div class="grid"><label class="f"><span>Protein (H = water-fearing, P = water-loving)</span><input id="seq" value="${esc(ST.seq || "HPHPPHHPHPPHPHHPPHPH")}"></label><label class="f"><span>Volunteers</span><input id="vol" type="number" min="1" max="16" value="${ST.vol || 4}"></label><label class="f"><span>Work units</span><input id="units" type="number" min="1" max="200" value="${ST.units || 16}"></label><label class="f"><span>One volunteer cheats (to see it caught)</span><select id="cheat"><option value="0">no</option><option value="1" ${ST.cheat ? "selected" : ""}>yes</option></select></label></div>
 <button class="b pri" onclick="crowdGo()">Run the job</button> <span id="cst" class="mut"></span></div>
 <div class="card" style="display:flex;gap:16px;flex-wrap:wrap"><canvas id="fc" width="360" height="360"></canvas><div style="flex:1;min-width:260px"><table id="board"><tr><th>Volunteer</th><th>Units</th><th>Accepted</th><th>Rejected</th><th>Best</th></tr></table><p class="mut" id="cbest"></p></div></div>`;
async function crowdGo() { const seq = $("#seq").value.toUpperCase().replace(/[^HP]/g, ""); if (seq.length < 4) return; ST.seq = seq; ST.vol = +$("#vol").value; ST.units = +$("#units").value; ST.cheat = $("#cheat").value === "1"; save();
  const W = workers(ST.vol) || Array(ST.vol).fill(null), stats = W.map((_, i) => ({n: i + 1, units: 0, ok: 0, bad: 0, best: 0})); let next = 0, best = {energy: 1}, t0 = performance.now(); stop = () => W.forEach(w => w && w.terminate());
  const draw = () => { $("#board").innerHTML = `<tr><th>Volunteer</th><th>Units</th><th>Accepted</th><th>Rejected</th><th>Best</th></tr>` + stats.map(s => `<tr><td>#${s.n}${ST.cheat && s.n === 1 ? " (cheats)" : ""}</td><td>${s.units}</td><td class="ok">${s.ok}</td><td class="${s.bad ? "bad" : ""}">${s.bad}</td><td>${s.best}</td></tr>`).join(""); };
  await Promise.all(W.map(async (w, i) => { while (next < ST.units) { const u = next++; const r = await run(w, {job: "fold", seq, seed: 1000 + u, iters: 30000, cheat: ST.cheat && i === 0}); const s = stats[i]; s.units++;
    if (MINER.verifyUnit(seq, r)) { s.ok++; s.best = Math.min(s.best, r.energy); if (r.energy < best.energy) { best = r; drawFold($("#fc"), seq, r.moves.split("")); } } else s.bad++;
    draw(); $("#cst").textContent = `${stats.reduce((a, s) => a + s.units, 0)}/${ST.units} units · ${((performance.now() - t0) / 1000).toFixed(1)} s`; } }));
  W.forEach(w => w && w.terminate()); stop = null; ST.crowdBest = best; save(); $("#cbest").innerHTML = `Best checked fold: energy <b>${best.energy}</b> (${best.energy <= -9 && seq === "HPHPPHHPHPPHPHHPPHPH" ? "the best known for this protein" : "lower is better"}). <button class="b" onclick="ST.myFold='${best.moves}';save();go('fold')">Open it in Fold it yourself ›</button>`; }
function drawFold(c, seq, moves) { const g = c.getContext("2d"), pts = MINER.foldCoords(moves), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), mx = Math.min(...xs), my = Math.min(...ys), w = Math.max(...xs) - mx + 1, h = Math.max(...ys) - my + 1, s = Math.min(300 / Math.max(w, h), 40), ox = (c.width - (w - 1) * s) / 2, oy = (c.height - (h - 1) * s) / 2;
  const P = pts.map(([x, y]) => [ox + (x - mx) * s, oy + (y - my) * s]); g.clearRect(0, 0, c.width, c.height);
  const at = new Map(pts.map((p, i) => [p + "", i])); g.strokeStyle = "#f2c14e88"; g.setLineDash([4, 4]); g.lineWidth = 2; pts.forEach(([x, y], i) => { if (seq[i] !== "H") return; for (const [ax, ay] of [[1, 0], [0, 1]]) { const j = at.get([x + ax, y + ay] + ""); if (j !== undefined && seq[j] === "H" && Math.abs(i - j) > 1) { g.beginPath(); g.moveTo(...P[i]); g.lineTo(...P[j]); g.stroke(); } } });
  g.setLineDash([]); g.strokeStyle = "#8fa0b3"; g.lineWidth = 3; g.beginPath(); P.forEach((p, i) => g[i ? "lineTo" : "moveTo"](...p)); g.stroke();
  P.forEach((p, i) => { g.fillStyle = seq[i] === "H" ? "#29c7a8" : "#e8eef4"; g.beginPath(); g.arc(p[0], p[1], s * .28, 0, 7); g.fill(); }); return P; }
V.fold = () => `<h2>🧬 Fold it yourself</h2><p class="lead">The Foldit idea: people are good at seeing folds. Click a bead to bend the chain there (straight → left → right). Bring the teal H beads together; each H-H touch that isn't a chain link scores −1. Can you match the crowd?</p>
 <div class="card" style="display:flex;gap:16px;flex-wrap:wrap"><canvas id="uc" width="420" height="420"></canvas><div><div class="big" id="ue"></div><p class="mut" id="ucmp"></p><button class="b" onclick="ST.myFold=null;save();go('fold')">Start straight</button></div></div>`;
A.fold = () => { const seq = ST.seq || "HPHPPHHPHPPHPHHPPHPH", c = $("#uc"); let mv = (ST.myFold || "S".repeat(seq.length - 2)).split(""); if (mv.length !== seq.length - 2) mv = Array(seq.length - 2).fill("S");
  const show = () => { const P = drawFold(c, seq, mv), e = MINER.energy(seq, mv); $("#ue").textContent = e === null ? "The chain crosses itself" : "Energy " + e; $("#ue").className = "big " + (e === null ? "bad" : "");
    $("#ucmp").textContent = ST.crowdBest ? `Crowd's best: ${ST.crowdBest.energy}` : "Run the crowd job to compare."; c.onclick = ev => { const b = c.getBoundingClientRect(), x = (ev.clientX - b.left) * c.width / b.width, y = (ev.clientY - b.top) * c.height / b.height;
      let k = -1, d = 1e9; P.forEach((p, i) => { const dd = (p[0] - x) ** 2 + (p[1] - y) ** 2; if (dd < d) { d = dd; k = i; } }); if (k >= 1 && k <= mv.length) { mv[k - 1] = {S: "L", L: "R", R: "S"}[mv[k - 1]]; ST.myFold = mv.join(""); save(); show(); } }; }; show(); };
A.crowd = () => { if (ST.crowdBest && ST.crowdBest.moves && (ST.seq || "HPHPPHHPHPPHPHHPPHPH").length === ST.crowdBest.moves.length + 2) drawFold($("#fc"), ST.seq || "HPHPPHHPHPPHPHHPPHPH", ST.crowdBest.moves.split("")); };
go("home");
</script></body></html>
