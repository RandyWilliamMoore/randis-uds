  const [, m1] = time(() => { for (let i = 0; i < 1e6; i++) ENG.mat4.mul(o, a, b); }); const n = ENG.noise2(1); const [, m2] = time(() => { let s = 0; for (let i = 0; i < 1e6; i++) s += n(i * .01, i * .007); return s; });
  P.math = {mat4: Math.round(1e6 / m1 * 1000), noise: Math.round(1e6 / m2 * 1000)}; $("#mres").innerHTML = `4x4 matrix multiplies: <b>${P.math.mat4.toLocaleString()}/s</b> · noise samples: <b>${P.math.noise.toLocaleString()}/s</b> <button class="b" onclick="mathBench()">Again</button>`; }
let SE = null, SEdocs = 0;
V.search = () => `<h2>🔎 Search engine</h2><p class="lead">Load text or Markdown files (or paste), then search. Ranking: BM25; finds word starts ("superconduct") and one-letter typos ("graphne").</p>
  <div class="card"><button class="b pri" onclick="pickDocs()">📂 Load .txt / .md files</button> <button class="b" onclick="pasteDoc()">📋 Paste text</button> <span class="mut" id="sinfo">${SE ? SEdocs + " passages indexed" : "Nothing indexed yet. Big files are split into paragraphs."}</span>
  <div style="margin-top:8px"><input id="q" placeholder="Search…" style="width:60%" onkeydown="if(event.key==='Enter')doSearch()"> <button class="b" onclick="doSearch()">Search</button></div></div><div class="card" id="sres"></div>`;
function indexText(name, t) { SE = SE || new ENG.Search(); const parts = t.split(/\n\s*\n/).map(p => p.replace(/\s+/g, " ").trim()).filter(p => p.length > 40); const [, ms] = time(() => parts.forEach((p, i) => SE.add(name + " §" + (i + 1), p))); SEdocs += parts.length; $("#sinfo").textContent = `${SEdocs} passages indexed (last file: ${parts.length} in ${ms.toFixed(0)} ms)`; P.searchIndex = {docs: SEdocs, ms: Math.round(ms)}; }
function pickDocs() { const i = document.createElement("input"); i.type = "file"; i.multiple = true; i.accept = ".txt,.md,.csv,.json,.html"; i.onchange = async () => { for (const f of i.files) indexText(f.name, await f.text()); }; i.click(); }
function pasteDoc() { const t = prompt("Paste text to index:"); if (t) indexText("pasted", t); }
function doSearch() { if (!SE) return; const q = $("#q").value, [r, ms] = time(() => SE.query(q, 15)); P.searchQuery = +ms.toFixed(2); const words = ENG.tok(q);
  $("#sres").innerHTML = `<div class="mut">${r.length} results in ${ms.toFixed(2)} ms</div>` + r.map(x => `<div class="res"><b>${esc(x.title)}</b> <span class="mut">${x.score}</span><br>${esc(x.snippet).replace(new RegExp("(" + words.map(w => w.replace(/[^a-z0-9]/g, "")).filter(Boolean).join("|") + ")", "gi"), "<mark>$1</mark>")}</div>`).join(""); }
V.physics = () => `<h2>🟠 Physics 2D</h2><p class="lead">Click to drop balls. Walls are static boxes. Sub-steps stop fast balls passing through thin walls.</p><div class="card"><canvas id="pc" width="640" height="400"></canvas><div><button class="b" onclick="PW.rain(60)">Drop 60</button><button class="b" onclick="go('physics')">Reset</button> <span id="pst" class="mut"></span></div></div>`;
let PW = null;
A.physics = () => { const c = $("#pc"), g = c.getContext("2d"), W = new ENG.World(c.width, c.height, 900); W.box(140, 250, 160, 10); W.box(360, 170, 160, 10); W.box(300, 330, 40, 70);
  const r = ENG.rng(5); PW = W; W.rain = n => { for (let i = 0; i < n; i++) W.circle(40 + r() * 560, 10 + r() * 60, 6 + r() * 8, {e: .35}); }; W.rain(80);
  c.onclick = e => { const b = c.getBoundingClientRect(); W.circle((e.clientX - b.left) * c.width / b.width, (e.clientY - b.top) * c.height / b.height, 14, {e: .4}); };
  let run = true, last = performance.now(), stepMs = 0; const loop = now => { if (!run) return; const [, ms] = time(() => W.step(1 / 60)); stepMs = stepMs * .9 + ms * .1;
    g.clearRect(0, 0, c.width, c.height); g.fillStyle = "#3a4466"; for (const w of W.walls) g.fillRect(w.x, w.y, w.w, w.h);
    for (const b of W.b) { g.fillStyle = b.sleep > 60 ? "#7a5a3a" : "#ff8a3d"; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); }
    $("#pst").textContent = `${W.b.length} bodies · ${stepMs.toFixed(2)} ms per step (${W.sub} sub-steps) · ${W.b.filter(b => b.sleep > 60).length} asleep`; P.physics = {bodies: W.b.length, ms: +stepMs.toFixed(2)}; requestAnimationFrame(loop); };
  requestAnimationFrame(loop); stopAnim = () => { run = false; }; };
V.path = () => `<h2>🧭 Pathfinding</h2><p class="lead">Draw walls with the mouse; the shortest path from the green square to the red one updates as you draw.</p><div class="card"><canvas id="gc" width="640" height="400"></canvas><div><label><input type="checkbox" id="diag" checked> diagonal moves</label> <button class="b" onclick="mazeRandom()">Random walls</button><button class="b" onclick="mazeClear()">Clear</button> <span id="gst" class="mut"></span></div></div>`;
let GR = null; const GW = 64, GH = 40;
A.path = () => { GR = GR || new Uint8Array(GW * GH); const c = $("#gc"), g = c.getContext("2d"), cs = 10, S0 = 2 * GW + 2, G0 = (GH - 3) * GW + GW - 3;
  const draw = () => { const [res, ms] = time(() => ENG.astar(GR, GW, GH, S0, G0, $("#diag").checked)); g.fillStyle = "#070a12"; g.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < GW * GH; i++) if (GR[i]) { g.fillStyle = "#3a4466"; g.fillRect(i % GW * cs, (i / GW | 0) * cs, cs, cs); }
    if (res.path) { g.strokeStyle = "#ff8a3d"; g.lineWidth = 3; g.beginPath(); res.path.forEach((i, k) => g[k ? "lineTo" : "moveTo"](i % GW * cs + 5, (i / GW | 0) * cs + 5)); g.stroke(); }
    g.fillStyle = "#3ddc84"; g.fillRect(S0 % GW * cs, (S0 / GW | 0) * cs, cs, cs); g.fillStyle = "#ff6b6b"; g.fillRect(G0 % GW * cs, (G0 / GW | 0) * cs, cs, cs);
    $("#gst").textContent = res.path ? `path ${res.cost.toFixed(1)} long · ${res.seen} cells looked at · ${ms.toFixed(2)} ms` : `no way through · ${ms.toFixed(2)} ms`; P.path = {ms: +ms.toFixed(2)}; };
  let down = 0; const paint = e => { const b = c.getBoundingClientRect(), x = (e.clientX - b.left) * c.width / b.width / cs | 0, y = (e.clientY - b.top) * c.height / b.height / cs | 0, i = y * GW + x; if (i !== S0 && i !== G0 && x < GW && y < GH) { GR[i] = down; draw(); } };
  c.onmousedown = e => { const b = c.getBoundingClientRect(), i = ((e.clientY - b.top) * c.height / b.height / cs | 0) * GW + ((e.clientX - b.left) * c.width / b.width / cs | 0); down = GR[i] ? 0 : 1; c.onmousemove = paint; paint(e); };
  onmouseup = () => c.onmousemove = null; $("#diag").onchange = draw; window.mazeRandom = () => { const r = ENG.rng(Date.now() & 0xffff); for (let i = 0; i < GW * GH; i++) GR[i] = r() < .3 ? 1 : 0; GR[S0] = GR[G0] = 0; draw(); }; window.mazeClear = () => { GR.fill(0); draw(); }; draw(); };
V.rules = () => `<h2>📜 Rules engine</h2><p class="lead">Write rules as "if … and … then …" (use "not"), list what you know, and it works out everything that follows, saying why.</p>
  <div class="card"><textarea id="rr" rows="7">if rain then wet ground
if wet ground and cold then ice
if ice then slippery
if slippery and not salted then close the road
if close the road then send a detour sign</textarea><input id="rf" value="rain, cold" style="width:100%;margin-top:6px"><button class="b pri" onclick="runRules()">Work it out</button></div><div class="card" id="rout"></div>`;
function runRules() { const [r, ms] = time(() => ENG.rules($("#rr").value, $("#rf").value)); $("#rout").innerHTML = `<div class="mut">${r.rules} rules, ${r.rounds} rounds, ${ms.toFixed(2)} ms</div><table>${r.facts.map(f => `<tr><td><b>${esc(f.f)}</b></td><td class="mut">${esc(f.why)}</td></tr>`).join("")}</table>`; }
A.rules = runRules;
V.game = () => `<h2>🎮 Game engine</h2><p class="lead">A small original game built on the engines here: fixed-step game loop + the physics engine. Move the catcher with ← → (or the mouse). Catch the orange orbs, dodge the grey rocks.</p><div class="card"><canvas id="gm" width="640" height="420" tabindex="0"></canvas><div class="mut" id="gs"></div></div>`;
A.game = () => { const c = $("#gm"), g = c.getContext("2d"), G = new ENG.Game(1 / 60), W = new ENG.World(c.width, c.height + 400, 500), r = ENG.rng(9);
  let px = 320, score = 0, lives = 3, spawn = 0, over = false; c.focus(); c.onkeydown = e => G.keys.add(e.key); c.onkeyup = e => G.keys.delete(e.key); c.onmousemove = e => { const b = c.getBoundingClientRect(); px = (e.clientX - b.left) * c.width / b.width; };
  G.add({update(dt) { if (over) return; if (G.keys.has("ArrowLeft")) px -= 420 * dt; if (G.keys.has("ArrowRight")) px += 420 * dt; px = Math.max(50, Math.min(590, px));
    if ((spawn -= dt) < 0) { spawn = .55; const rock = r() < .25; W.circle(30 + r() * 580, -10, rock ? 13 : 9, {e: .5, rock, vx: (r() - .5) * 120}); }
    W.step(dt); for (const b of W.b) { if (b.dead) continue; if (b.y > 380 && b.y < 400 && Math.abs(b.x - px) < 55) { b.dead = true; if (b.rock) { lives--; if (!lives) over = true; } else score++; } if (b.y > c.height + 40) b.dead = true; }
    W.b = W.b.filter(b => !b.dead); }});
  let run = true, last = performance.now(); const loop = now => { if (!run) return; G.tick((now - last) / 1000); last = now; g.fillStyle = "#070a12"; g.fillRect(0, 0, c.width, c.height);
    for (const b of W.b) { g.fillStyle = b.rock ? "#8a93a8" : "#ff8a3d"; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); }
    g.fillStyle = "#3ddc84"; g.fillRect(px - 55, 390, 110, 12); g.fillStyle = "#e9edf6"; g.font = "16px system-ui"; g.fillText(`Score ${score}   Lives ${"♥".repeat(lives)}`, 12, 24);
    if (over) { g.font = "28px system-ui"; g.fillText("Game over — click to play again", 120, 210); c.onclick = () => go("game"); }
    $("#gs").textContent = `fixed step 60/s · ${W.b.length} bodies · frames ${G.frames}`; requestAnimationFrame(loop); };
  requestAnimationFrame(loop); stopAnim = () => { run = false; }; };
V.bench = () => `<h2>📊 Benchmarks</h2><p class="lead">Our numbers, measured on this computer in this tab. Peers (glMatrix, MiniSearch, Rapier, cannon-es) were downloaded and measured against ours on the same inputs; nothing here is guessed.</p><div class="card"><button class="b pri" onclick="runBench()">Run all</button><div id="bout" style="margin-top:8px"></div></div>
  <div class="card"><h3>Ours vs free peers (measured 2026-11-25 in node) Core(TM) i7-9750H CPU @ 2.60GHz)</h3><p class="mut">Same node process, same inputs, best of 5 (physics best of 3). Search corpus: 22,047 paragraphs of 20 public-domain Project Gutenberg books; "relevant" = paragraphs holding every query word as a word start (brute force). Render (three.js, Babylon.js) is downloaded but waits on plan step 1 (our render engine split out of Blockwild).</p><table><tr><th>Test</th><th>Ours</th><th>Peer</th><th></th><th>Notes</th></tr><tr><td>Math: mat4 multiply</td><td><b>6,094,152</b> ops/s</td><td>glMatrix 3.4.4: 17,701,684 ops/s</td><td>behind x0.34</td><td class="mut">same result (max diff 0.0e+0)</td></tr><tr><td>Math: mat4 invert</td><td><b>7,324,966</b> ops/s</td><td>glMatrix 3.4.4: 17,699,037 ops/s</td><td>behind x0.41</td><td class="mut">same result (max diff 0.0e+0)</td></tr><tr><td>Search: index 22,047 paragraphs</td><td><b>1,082</b> ms</td><td>MiniSearch 7.2.0: 2,680 ms</td><td>ahead x2.48</td><td class="mut"></td></tr><tr><td>Search: query (avg of 20)</td><td><b>3.028</b> ms</td><td>MiniSearch 7.2.0 (AND, prefix): 0.619 ms</td><td>behind x0.2</td><td class="mut"></td></tr><tr><td>Search: relevant in top 10</td><td><b>173</b> of 195</td><td>MiniSearch 7.2.0 (AND, prefix): 195 of 195</td><td>behind x0.89</td><td class="mut">MiniSearch default (OR): 193/195</td></tr><tr><td>Physics: 120 balls, 600 steps</td><td><b>1,358</b> steps/s</td><td>Rapier2D 0.21 (wasm): 7,434 steps/s</td><td>behind x0.18</td><td class="mut">ours max overlap 0.61 px, all inside: true; Rapier max overlap 0.50 px, all inside: true</td></tr><tr><td>Physics: 120 balls, 600 steps</td><td><b>1,358</b> steps/s</td><td>cannon-es 0.20 (3D, thin slab): 471 steps/s</td><td>ahead x2.88</td><td class="mut">cannon-es max overlap 0.00 px, all inside: true</td></tr><tr><td>Physics: fast ball (3000 px/s) vs 4 px wall: stopped?</td><td><b>yes</b></td><td>Rapier2D 0.21: yes (CCD on), yes (CCD off)</td><td>tie</td><td class="mut"></td></tr></table></div>
  <div class="card mut">Measured with node (engine tests 15/15): 4x4 matrix multiplies ~5.1 M/s · noise ~33 M samples/s · search: 1,233 passages of a long book indexed in 85 ms, ~1 ms per query, 96 of 99 relevant ideas in the top 10 · physics: 120 balls ~1,190 steps/s, settled overlap 0.6 px · A*: optimal on 30/30 random 120x120 mazes, ~2.3 ms each.</div>`;
function runBench() { const out = []; mathBench && (() => { const a = new Float32Array(16), b = new Float32Array(16), o = new Float32Array(16), r = ENG.rng(3); for (let i = 0; i < 16; i++) a[i] = r() * 4 - 2; ENG.mat4.invert(b, a); const [, m] = time(() => { for (let i = 0; i < 1e6; i++) ENG.mat4.mul(o, a, b); }); out.push(["Math: mat4 multiply", Math.round(1e6 / m * 1000).toLocaleString() + "/s"]); })();
  const W = new ENG.World(400, 400, 900); for (let i = 0; i < 120; i++) W.circle(30 + (i % 12) * 28, 20 + Math.floor(i / 12) * 26, 10, {e: .2}); const [, pm] = time(() => { for (let s = 0; s < 300; s++) W.step(1 / 60); }); out.push(["Physics: 120 balls", Math.round(300 / pm * 1000).toLocaleString() + " steps/s"]);
  const g = new Uint8Array(120 * 120), r = ENG.rng(7); for (let i = 0; i < g.length; i++) g[i] = r() < .28; g[0] = g[g.length - 1] = 0; const [, am] = time(() => ENG.astar(g, 120, 120, 0, g.length - 1, false)); out.push(["Pathfinding: A* 120x120", am.toFixed(2) + " ms"]);
