let osSeq = 0, osTimer = null;
function osCall(op, args) { return new Promise(res => { if (!HOST) return res({error: "Open this tab inside Randis UDS to build here."}); const id = "os" + (++osSeq);
  const h = e => { if (e.data && e.data.uds === "os" && e.data.id === id) { removeEventListener("message", h); res(e.data.r || {}); } };
  addEventListener("message", h); parent.postMessage({uds: "os", id, op, args: args || {}}, "*"); setTimeout(() => { removeEventListener("message", h); res({error: "No answer from the app."}); }, 15000); }); }
async function osFill() { const sel = $("#osiso"); if (!sel || !DESKTOP) return; const r = await osCall("status"); sel.innerHTML = (r.isos || []).map(f => `<option>${esc(f)}</option>`).join("") || "<option value=''>(none built yet)</option>";
  const want = A().hostname + ".iso"; if ((r.isos || []).includes(want)) sel.value = want; if (r.error) $("#osstat").textContent = r.error; if (r.busy) osPoll(); }
async function osPoll() { clearTimeout(osTimer); const r = await osCall("job"), st = $("#osstat"), lg = $("#oslog"); if (!st) return;
  if (r.error) { st.textContent = r.error; return; } if (r.none) return;
  lg.style.display = ""; lg.textContent = r.log || ""; lg.scrollTop = lg.scrollHeight;
  if (r.running) { st.textContent = `⏳ ${r.what}: ${r.took} s`; osTimer = setTimeout(osPoll, 1500); }
  else { const ok = r.rc === 0; st.innerHTML = `<b class="${ok ? "ok" : "bad"}">${ok ? "✔" : "✘"} ${esc(r.what)} ${ok ? "finished" : "failed (code " + r.rc + ")"}</b> in ${r.took} s`; osFill(); } }
async function osBuild(boot) { const passwords = {}; document.querySelectorAll(".ospw").forEach(i => passwords[i.dataset.acct] = i.value);
  const r = await osCall("build", {design: A(), passwords, boot, seconds: 240}); document.querySelectorAll(".ospw").forEach(i => i.value = "");
  if (r.error) { $("#osstat").textContent = r.error; return; } toast("Started: " + r.started); osPoll(); }
async function osBoot() { const iso = $("#osiso").value; if (!iso) return toast("Build an ISO first.");
  const r = await osCall("boot", {iso, seconds: 240}); if (r.error) { $("#osstat").textContent = r.error; return; } toast("Started: " + r.started); osPoll(); }

function pickBlock(layer, id, many) { const s = ST().stack; if (many) { const a = new Set(s[layer] || []); a.has(id) ? a.delete(id) : a.add(id); s[layer] = [...a]; } else s[layer] = s[layer] === id ? null : id; save(); rerender(); }
const HOW = {built: ["built, ready", "ok"], alpine: ["builds now", "ok"], ours: ["ours, from scratch", "warn"], source: ["needs source download", "bad"]};
page("scratch", "Design", "🧱 From scratch", () => {

   ${r.warns.map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}
   <div class="mut">About ${r.mb} MB · licences: ${r.lic.map(esc).join(", ")}</div>
   ${r.alpine ? `<div style="margin-top:6px"><b class="ok">Every block builds today with the Alpine builder.</b> <button class="b pri" onclick="S.alpine=OSCORE.toAlpine(ST().stack,S.alpine);save();go('alpine');toast('Sent to the Alpine designer.')">Send to the Alpine designer ›</button></div>`
     : r.errs.length ? "" : `<div style="margin-top:6px"><b>Build plan for the rest</b><ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`}
   <div style="margin-top:6px"><button class="b" onclick="ST().stack=JSON.parse(JSON.stringify(ALPINE_STACK));save();rerender()">Reset to the Alpine stack</button><button class="b" onclick="ST().stack={};save();rerender()">Clear: start from nothing</button></div></div>
  <div class="card"><table>${layers}</table></div>
  <div class="card"><b>🔩 Boot sector lab: the very first block, made here byte by byte</b>
   <p class="mut" style="margin:4px 0">Your own 512-byte x86 boot sector (16-bit real mode, no outside code). It prints your message on the screen and the serial port, then halts. Saved as a bootable disc that also works as a disk image. Run it in QEMU (<code>qemu-system-i386 -cdrom randis_boot.iso</code>) or in the Randis UDS app's VM Suite.</p>
   <textarea id="bmsg" rows="3" oninput="ST().msg=this.value;save();bootHex()">${esc(st.msg)}</textarea>
   <div class="row"><button class="b pri" onclick="bootSave()">⬇ randis_boot.iso</button><button class="b" onclick="bootSave(true)">⬇ boot.bin (512 bytes)</button> <span id="bstat" class="mut"></span></div>
   <pre id="bhex" style="max-height:220px"></pre>
   <details><summary class="mut">The machine code, line by line</summary><pre>FA            cli                 ; no interrupts while we set up
31 C0         xor ax, ax
8E D8 8E C0   mov ds, ax / es, ax  ; segments = 0
8E D0 BC 00 7C mov ss, ax / sp, 7C00h ; stack just below us
FB            sti
BE 28 7C      mov si, 7C28h       ; the message
AC            print: lodsb        ; next character
08 C0 74 0F   or al, al / jz done ; 0 = end
50 B4 0E BB 07 00 CD 10 58   push ax / BIOS teletype (int 10h) / pop ax
BA F8 03 EE   mov dx, 3F8h / out dx, al ; same character to the serial port
EB EC         jmp print
FA F4 EB FC   done: cli / hlt / jmp done
... message, 0, padding ... 55 AA  (the BIOS boot signature)</pre></details></div>`;
}, () => bootHex());
function bootHex() { const h = $("#bhex"), st = $("#bstat"); if (!h) return; try { const s = OSCORE.bootSector(ST().msg); let o = ""; for (let i = 0; i < 512; i += 16) o += i.toString(16).padStart(3, "0") + "  " + [...s.slice(i, i + 16)].map(b => b.toString(16).padStart(2, "0")).join(" ") + "\n"; h.textContent = o; st.textContent = "✔ 512 bytes, ends 55 AA"; st.className = "ok"; } catch (e) { h.textContent = ""; st.textContent = e.message; st.className = "bad"; } }
function bootSave(raw) { try { const s = OSCORE.bootSector(ST().msg); download(raw ? "boot.bin" : "randis_boot.iso", new Blob([raw ? s : OSCORE.bootISO(s, "randis_boot")], {type: "application/octet-stream"})); } catch (e) { toast(e.message); } }

  <div class="card"><b>Make a patch</b><label class="f"><span>File path in the OS</span><input type="text" value="${esc(p.path)}" onchange="PT().path=this.value.trim();save();rerender()"></label>
   <div class="grid" style="grid-template-columns:1fr 1fr"><label class="f"><span>Before</span><textarea rows="8" onchange="PT().a=this.value;save();rerender()">${esc(p.a)}</textarea></label><label class="f"><span>After</span><textarea rows="8" onchange="PT().b=this.value;save();rerender()">${esc(p.b)}</textarea></label></div>
   ${files.length ? `<div class="mut">Start from one of your design's files: ${files.map((f, i) => `<button class="b" onclick="PT().path='${esc(f.path.replace(/^\//, ""))}';PT().a=PT().b=S.alpine.files[${i}].text;save();rerender()">${esc(f.path)}</button>`).join("")}</div>` : ""}
   <pre>${esc(d || "(no change yet)")}</pre>
   ${d ? `<label class="f"><span>What it does (one line)</span><input type="text" value="${esc(p.subj)}" onchange="PT().subj=this.value;save()"></label><button class="b pri" onclick="PT().list.push({path:PT().path,subj:PT().subj||'Change '+PT().path,diff:OSCORE.diff(PT().a,PT().b,PT().path)});save();rerender()">+ Add to the series</button><button class="b" onclick="download((PT().path||'file').replace(/\\W+/g,'_')+'.patch',OSCORE.diff(PT().a,PT().b,PT().path),'text/x-diff')">⬇ .patch</button>` : ""}</div>
  <div class="card"><b>Patch series</b> <span class="mut">(${p.list.length}) applied in order to your Alpine design's files</span>
   <table>${p.list.map((x, i) => `<tr><td>${i + 1}</td><td><b>${esc(x.subj)}</b><br><code>${esc(x.path)}</code></td><td><button class="b" onclick="applyToDesign(${i})">Apply to the design</button><button class="b" onclick="download('${String(i + 1).padStart(4, "0")}-'+PT().list[${i}].subj.replace(/\\W+/g,'-').slice(0,40)+'.patch',OSCORE.formatPatch(PT().list[${i}].diff,PT().list[${i}].subj,'You','you@example.com',''),'text/x-diff')">⬇ git format</button><button class="b del" onclick="PT().list.splice(${i},1);save();rerender()">✕</button></td></tr>`).join("") || "<tr><td class='mut'>None yet.</td></tr>"}</table></div>
  <div class="card"><b>Apply a patch you got</b><textarea id="inpatch" rows="6" placeholder="paste a unified diff (--- a/… +++ b/… @@ …)"></textarea><button class="b" onclick="applyPasted()">Apply to the design file it names</button><div id="pres" class="mut"></div></div>`;
});
function applyToDesign(i) { const x = PT().list[i], f = (S.alpine.files || []).find(f => f.path.replace(/^\//, "") === x.path.replace(/^\//, ""));
  if (!f) return toast("No design file /" + x.path + " (add it on the Alpine designer first).", 5000); const r = OSCORE.applyPatch(f.text, x.diff);
  if (!r.ok) return toast("Didn't apply: " + r.errors.join("; "), 6000); f.text = r.text; save(); toast("Applied to /" + x.path); }
function applyPasted() { const t = $("#inpatch").value, m = /^\+\+\+ (?:b\/)?(\S+)/m.exec(t); if (!m) return $("#pres").textContent = "No +++ line naming the file.";
  const f = (S.alpine.files || []).find(f => f.path.replace(/^\//, "") === m[1].replace(/^\//, "")); if (!f) return $("#pres").textContent = "No design file /" + m[1];
  const r = OSCORE.applyPatch(f.text, t); if (!r.ok) return $("#pres").textContent = "Didn't apply: " + r.errors.join("; "); f.text = r.text; save(); $("#pres").textContent = "✔ Applied to /" + m[1]; }

</script>
<script>
if (HOST) { parent.postMessage({uds: "store-get"}, "*"); setTimeout(() => { if (!loaded) { fallback = true; let d = null; try { d = JSON.parse(localStorage.getItem("distro-studio")); } catch (e) {} boot(d); } }, 2500); }
else { let d = null; try { d = JSON.parse(localStorage.getItem("distro-studio")); } catch (e) {} boot(d); }
</script>
