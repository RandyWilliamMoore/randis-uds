<html>
<head>

<style>
:root{--bg:#f9f9f7;--bg2:#fcfcfb;--bg3:#efeee9;--line:#dcdbd5;--tx:#0b0b0b;--mut:#52514e;--acc:#256abf;--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--bad:#d03b3b;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948}
body[data-theme=dark]{--bg:#0d0d0d;--bg2:#1a1a19;--bg3:#262624;--line:#383835;--tx:#f0efec;--mut:#c3c2b7;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
header b#apptitle{font-size:16px;color:var(--acc);margin-right:6px}
#nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
#nav button{border:0;background:none;padding:5px 9px;border-radius:6px;cursor:pointer;color:var(--mut)}
#nav button.on{background:var(--acc);color:#fff}
#nav button:hover:not(.on){background:var(--bg3)}
#saved{font-size:11px;color:var(--mut)}
main#view{flex:1;overflow:auto;padding:14px 18px}
h2{margin:0 0 4px;font-size:21px}h3{margin:6px 0 8px;font-size:15px;color:var(--acc)}h4{margin:10px 0 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.lead{color:var(--mut);margin:0 0 12px;max-width:980px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.row>.card{flex:1;min-width:300px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px;margin:0 0 6px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
textarea{width:100%;min-height:80px;font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg3);color:var(--tx);border-radius:6px;padding:4px 10px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.x{padding:1px 7px;color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}td input,td select{width:100%;padding:2px 4px}
.num{text-align:right;font-variant-numeric:tabular-nums}
pre,.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}pre{background:var(--bg3);padding:10px;border-radius:6px;overflow:auto;white-space:pre-wrap;margin:6px 0;max-height:420px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--bg3);color:var(--mut)}
.ok{color:var(--good)}.bad{color:var(--bad)}.warnc{color:#b7791f}
.banner{border-left:4px solid var(--serious);background:var(--bg3);padding:8px 12px;border-radius:6px;margin:0 0 12px}
.stat{font-size:26px;font-weight:600}.sub{font-size:12px;color:var(--mut)}
svg text{fill:var(--mut);font-size:11px}svg .ink{fill:var(--tx)}
.lnk{color:var(--s1);cursor:pointer;text-decoration:underline}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:80%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:4px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>

<body>

<main id="view"></main>

<script>

"use strict";

const inApp = window.parent !== window;

const pct = n => (isFinite(n) ? Math.round(n * 1000) / 10 : 0) + "%";
const SER = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
let toastT; function toast(t, ms) { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => e.style.display = "none", ms || 3200); }
let WEB_ON = false;
function openLink(url) {

function copyText(t, msg) { const fb = () => prompt("Copy this:", t); try { const p = navigator.clipboard && navigator.clipboard.writeText(t); if (p && p.then) p.then(() => toast(msg || "Copied.", 4000), fb); else fb(); } catch (e) { fb(); } }

let S, MEM = { page: null, sub: {} }, loaded = false, useLocal = true, saveT;
function save() {

    const data = { [APP.key]: S };

function readLocal() { try { return JSON.parse(localStorage.getItem("uds-" + APP.key) || "null"); } catch (e) { return null; } }
function getP(path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), S); }

function download(name, data, type) {

const csvCell = c => `"${String(c == null ? "" : c).replace(/"/g, '""')}"`;
const toCSV = rows => rows.map(r => r.map(csvCell).join(",")).join("\r\n");
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }

    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const head = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nm.length), ...u16(0)]);

const AIQ = {};
function askAI(prompt, cb) {
  if (!inApp) { cb({ error: "Open this inside Randis UDS with an AI linked to use the AI helper." }); return; }
  const id = "q10-" + uid(); AIQ[id] = cb;
  tell({ uds: "planner-ask", id, history: [{ role: "user", content: String(prompt) }], context: APP.title + " app in Randis UDS." });
}

const F = (label, path, o) => { o = o || {}; const v = getP(path); const t = o.type || (typeof v === "number" ? "number" : "text");
  if (o.opts) return `<label class="f">${esc(label)}<select data-p="${path}"${o.r ? " data-r" : ""}>${o.opts.map(x => { const [k, n] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(k)}"${String(v) === String(k) ? " selected" : ""}>${esc(n)}</option>`; }).join("")}</select></label>`;
  if (t === "area") return `<label class="f">${esc(label)}<textarea data-p="${path}"${o.r ? " data-r" : ""} style="min-height:${o.h || 90}px">${esc(v)}</textarea></label>`;
  if (t === "check") return `<label><input type="checkbox" data-p="${path}" data-r${v ? " checked" : ""}> ${esc(label)}</label>`;
  return `<label class="f">${esc(label)}<input type="${t}" data-p="${path}"${t === "number" ? " data-num" : ""}${o.r ? " data-r" : ""} value="${esc(v)}"${o.step ? ` step="${o.step}"` : ""}${o.w ? ` style="width:${o.w}"` : ""}></label>`; };
function TBL(path, cols, o) {
  o = o || {}; const rows = getP(path) || [];
  const head = cols.map(c => `<th>${esc(c[1])}</th>`).join("") + (o.extra ? o.extra.map(x => `<th>${esc(x[0])}</th>`).join("") : "") + "<th></th>";
  const body = rows.map((r, i) => "<tr>" + cols.map(([k, , t, w]) => {
    const p = `${path}.${i}.${k}`, v = r[k];
    if (Array.isArray(t)) return `<td${w ? ` style="width:${w}"` : ""}><select data-p="${p}" data-r>${t.map(x => `<option${String(v) === String(x) ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></td>`;
    return `<td${w ? ` style="width:${w}"` : ""}><input data-p="${p}"${t === "number" ? ' type="number" data-num step="any"' : ""}${o.live ? " data-r" : ""} value="${esc(v)}"></td>`;
  }).join("") + (o.extra ? o.extra.map(x => `<td class="num">${x[1](r, i)}</td>`).join("") : "") + `<td><button class="x" data-act="rowdel" data-arg="${path}|${i}">✕</button></td></tr>`).join("");
  return `<table><tr>${head}</tr>${body}</table><button data-act="rowadd" data-arg="${path}">+ Add row</button>`;
}
function lineChart(series, o) {
  o = o || {}; const W = o.w || 640, H = o.h || 220, P = { l: 46, r: 12, t: 10, b: 24 };
  const all = series.flatMap(s => s.pts); if (!all.length) return `<p class="sub">No data yet.</p>`;
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1, y0 = Math.min(0, ...ys), y1 = Math.max(...ys) * 1.08 || 1;
  const X = x => P.l + (x - x0) / ((x1 - x0) || 1) * (W - P.l - P.r), Y = y => H - P.b - (y - y0) / ((y1 - y0) || 1) * (H - P.t - P.b);
  let g = ""; for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 4}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, 1)}</text>`; }
  g += `<text x="${P.l}" y="${H - 6}">${esc(o.xl ? o.xl(x0) : fmt(x0))}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${esc(o.xl ? o.xl(x1) : fmt(x1))}</text>`;
  const lines = series.map((s, i) => `<polyline fill="none" stroke="${s.color || SER[i % 8]}" stroke-width="2" points="${s.pts.map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ")}"/>` +
    s.pts.filter((p, j) => s.pts.length < 60 || j % Math.ceil(s.pts.length / 40) === 0).map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="6" fill="transparent"><title>${esc(s.name)}: ${esc(o.xl ? o.xl(p[0]) : fmt(p[0]))} → ${fmt(p[1])}</title></circle>`).join("")).join("");
  const leg = series.length > 1 ? `<div class="legend">${series.map((s, i) => `<span><i style="background:${s.color || SER[i % 8]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return leg + `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${g}${lines}</svg>`;
}
function barChart(items, o) {
  o = o || {}; const W = o.w || 640, bh = 22, H = items.length * (bh + 6) + 8, lw = o.lw || 150, max = Math.max(...items.map(i => i.v), 1e-9);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">` + items.map((it, i) => { const y = 4 + i * (bh + 6), w = Math.max(1, (W - lw - 90) * it.v / max);
    return `<text class="ink" x="${lw - 6}" y="${y + 15}" text-anchor="end">${esc(it.name)}</text><rect x="${lw}" y="${y}" width="${w}" height="${bh}" rx="4" fill="${it.color || SER[o.one ? 0 : i % 8]}"><title>${esc(it.name)}: ${esc(o.f ? o.f(it.v) : fmt(it.v))}</title></rect><text x="${lw + w + 6}" y="${y + 15}">${esc(o.f ? o.f(it.v) : fmt(it.v))}</text>`; }).join("") + "</svg>";

function nav() {
  $("#nav").innerHTML = APP.pages.map(([id, label]) => `<button data-page="${id}" class="${MEM.page === id ? "on" : ""}">${esc(label)}</button>`).join("");
}
function go(id) { MEM.page = id; S._page = id; render(); }
let PRESS = false, HELD = false, IN_CHANGE = false, heldT;
function flushHeld() { clearTimeout(heldT); if (HELD) { HELD = false; render(); } }
document.addEventListener("pointerdown", e => { PRESS = !!(e.target.closest && e.target.closest("button,[data-act],[data-page],a,.lnk,label.pill")); }, true);

function render() {
  if (IN_CHANGE && PRESS) { HELD = true; clearTimeout(heldT); heldT = setTimeout(() => { PRESS = false; flushHeld(); }, 1000); return; }

  nav(); const pg = APP.pages.find(p => p[0] === MEM.page) || APP.pages[0]; MEM.page = pg[0];
  try { $("#view").innerHTML = pg[2](); if (APP.after) APP.after(pg[0]); }

}
const ACT = {
  theme() { S._theme = document.body.dataset.theme === "dark" ? "" : "dark"; document.body.dataset.theme = S._theme; save(); },
  rowadd(path) { const a = getP(path) || []; const t = APP.rowTemplates && APP.rowTemplates[path]; a.push(t ? t() : {}); setP(path, a); save(); render(); },
  rowdel(arg) { const [path, i] = arg.split("|"); getP(path).splice(+i, 1); save(); render(); },

function onField(e, final) {

document.addEventListener("input", e => { if (e.target.tagName === "SELECT" || e.target.type === "checkbox") return; onField(e, false); });

document.addEventListener("click", e => {
  const pg = e.target.closest("[data-page]"); if (pg) { go(pg.dataset.page); return; }
  const l = e.target.closest(".lnk"); if (l) { openLink(l.dataset.url); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  try { f(b.dataset.arg, b, e); } catch (err) { toast("That didn't work: " + err.message, 6000); console.error(err); }
});

  const d = e.data; if (!d || typeof d.uds !== "string") return;
  if (d.uds === "store") { if (!loaded) { useLocal = false; boot(d.data && d.data[APP.key] ? d.data[APP.key] : readLocal()); } }
  else if (d.uds === "store-error") toast("Couldn't save: " + (d.note || ""), 6000);
  else if (d.uds === "web-state") WEB_ON = !!d.on;
  else if (d.uds === "exported" || d.uds === "exporting") toast(d.note || (d.ok ? "Saved." : "Not saved."));
  else if (d.uds === "planner" && AIQ[d.id]) { if (d.done) { const cb = AIQ[d.id]; delete AIQ[d.id]; cb(d.error ? { error: d.error } : { text: d.text || "" }); } }

</script>
<script>

const DEV_T = {
  "Temperature sensor": { kind: "sensor", metric: "temp", unit: "°C", model: "sine", base: 21, amp: 3, noise: 0.3, period: 120 },
  "Humidity sensor": { kind: "sensor", metric: "humidity", unit: "%", model: "walk", base: 45, amp: 10, noise: 0.8 },
  "Air quality (PM2.5)": { kind: "sensor", metric: "pm25", unit: "µg/m³", model: "walk", base: 12, amp: 15, noise: 1.5 },

function recSummary() { const by = {}; for (const [, n, u, v] of RT.rec.rows) { if (typeof v !== "number") continue; const b = by[n] = by[n] || { n, u, c: 0, s: 0, lo: Infinity, hi: -Infinity, pts: [] }; b.c++; b.s += v; b.lo = Math.min(b.lo, v); b.hi = Math.max(b.hi, v); b.pts.push(v); } return Object.values(by); }
function recCSV() { return toCSV([["time_utc", "device", "unit", "value", "source"], ...RT.rec.rows]); }
function recLoadText(text) { const R = parseCSV(String(text).replace(/^\ufeff/, "")).filter(r => r.length >= 4 && r.some(c => c !== "")); if (!R.length) throw new Error("empty file");
  const h = R[0].map(x => x.trim().toLowerCase()); if (h[0] !== "time_utc" || h[1] !== "device") throw new Error("not an IoT Command recording (first column must be time_utc, then device)");
  const rows = []; let bad = 0; for (const r of R.slice(1)) { const t = Date.parse(r[0]); if (!isFinite(t)) { bad++; continue; } const n = parseFloat(r[3]); rows.push([new Date(t).toISOString(), r[1], r[2] || "", isFinite(n) && String(r[3]).trim() !== "" ? n : r[3], r[4] || "loaded"]); }
  rows.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0); RT.rec.rows = rows.slice(-500000); RT.rec.since = rows.length ? new Date(rows[0][0]) : null; RT.rec.loaded = true;
  let matched = 0; const t0 = rows.length ? Date.parse(rows[0][0]) : 0; for (const d of S.devices) { const mine = rows.filter(r => r[1] === d.name && typeof r[3] === "number"); if (!mine.length) continue; matched++;
    RT.hist[d.id] = mine.slice(-300).map(r => [(Date.parse(r[0]) - t0) / 1000, r[3]]); }
  return { rows: rows.length, bad, matched }; }
const REC_DB = { name: "uds-iot-rec", store: "rec" };
function recDb() { return new Promise((res, rej) => { if (typeof indexedDB === "undefined") return rej(new Error("no IndexedDB in this window")); const q = indexedDB.open(REC_DB.name, 1);
  q.onupgradeneeded = () => q.result.createObjectStore(REC_DB.store); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error || new Error("IndexedDB blocked")); }); }
async function recKeepNow() { const db = await recDb(); return new Promise((res, rej) => { const tx = db.transaction(REC_DB.store, "readwrite"); tx.objectStore(REC_DB.store).put({ rows: RT.rec.rows, since: RT.rec.since ? RT.rec.since.toISOString() : null, at: new Date().toISOString() }, "last");
  tx.oncomplete = () => { db.close(); RT.rec.keptAt = new Date(); res(RT.rec.rows.length); }; tx.onerror = () => { db.close(); rej(tx.error); }; }); }
async function recRestore() { const db = await recDb(); return new Promise((res, rej) => { const q = db.transaction(REC_DB.store, "readonly").objectStore(REC_DB.store).get("last");
  q.onsuccess = () => { db.close(); const v = q.result; if (v && v.rows && v.rows.length) { RT.rec.rows = v.rows; RT.rec.since = v.since ? new Date(v.since) : null; } res(v ? v.rows.length : 0); }; q.onerror = () => { db.close(); rej(q.error); }; }); }
function recCharts() { const sm = recSummary().filter(b => b.c > 1).slice(0, 6); if (!sm.length) return "";
  const t0 = Date.parse(RT.rec.rows[0][0]); return `<div class="card"><h3>Recorded values</h3><div class="row">${sm.map(b => { const pts = RT.rec.rows.filter(r => r[1] === b.n && typeof r[3] === "number"); const step = Math.max(1, Math.ceil(pts.length / 600));
    return `<div style="min-width:300px"><b>${esc(b.n)}</b> <span class="sub">${esc(b.u)}</span>${lineChart([{ name: b.n, pts: pts.filter((_, i) => i % step === 0).map(r => [(Date.parse(r[0]) - t0) / 60000, r[3]]) }], { h: 140, w: 300 })}</div>`; }).join("")}</div><p class="sub">x = minutes from the first row.</p></div>`; }
function pageHist() { const sm = recSummary();
  return `<h2>History</h2><p class="lead">The live charts keep the last 300 points in memory. The recorder samples every device every few seconds for as long as it runs and saves everything to a CSV file.</p>
  <div class="card">${F("Sample every (s)", "rec.every", { w: "80px" })}<button data-act="recStart" class="pri">${RT.rec.timer ? "⏹ Stop recording" : "⏺ Start recording"}</button> <button data-act="recNow">Sample now</button> <button data-act="recSave">⬇ Save (.csv)</button> <label class="pill">Load a saved recording <input type="file" data-file="recLoad" accept=".csv,text/csv" style="width:170px"></label> <button data-act="recClear">Clear</button>
  <div class="row">${F("Keep the recording if this window closes (saved in this window's storage every sample)", "rec.keep", { type: "check", r: 1 })}<button data-act="recRestoreNow">Restore the kept recording</button></div>
  <p>${fmt(RT.rec.rows.length, 0)} rows${RT.rec.since ? " since " + esc(RT.rec.since.toLocaleString()) : ""}${RT.rec.timer ? ' · <span class="ok">recording</span>' : ""}${RT.rec.loaded ? ' · <span class="pill">loaded from a file</span>' : ""}${RT.rec.keptAt ? ' · kept ' + esc(RT.rec.keptAt.toLocaleTimeString()) : ""}</p></div>
  ${recCharts()}
  <div class="card"><table><tr><th>Device</th><th class="num">Samples</th><th class="num">Min</th><th class="num">Average</th><th class="num">Max</th></tr>${sm.length ? sm.map(b => `<tr><td>${esc(b.n)}</td><td class="num">${b.c}</td><td class="num">${fmt(b.lo)}</td><td class="num">${fmt(b.s / b.c)}</td><td class="num">${fmt(b.hi)}</td><td>${esc(b.u)}</td></tr>`).join("") : '<tr><td colspan="5" class="sub">Nothing recorded yet. Run the simulator or an adapter, then start recording.</td></tr>'}</table></div>`; }
Object.assign(ACT, {
  pollStart() { if (RT.poll) { clearInterval(RT.poll); RT.poll = null; logEv("link", "HTTP polling stopped."); } else { RT.poll = setInterval(pollOnce, 1000 * Math.max(2, num(S.poll.every) || 10)); pollOnce(); logEv("link", "HTTP polling started (GET only)."); } render(); },
  pollNow() { pollOnce().then(n => toast(n + " reading(s) updated.")); },
  serialOn() { if (RT.ser) serialClose(); else serialOpen(); },
  recStart() { if (RT.rec.timer) { clearInterval(RT.rec.timer); RT.rec.timer = null; } else { RT.rec.since = RT.rec.since || new Date(); recSample(); RT.rec.timer = setInterval(() => { recSample(); if (S.rec.keep) recKeepNow().catch(() => {}); if (MEM.page === "hist") render(); }, 1000 * Math.max(1, num(S.rec.every) || 5)); } render(); },
  recNow() { RT.rec.since = RT.rec.since || new Date(); recSample(); render(); },
  recLoad(files) { const r = new FileReader(); r.onload = () => { try { const x = recLoadText(r.result); render(); toast(`${fmt(x.rows, 0)} rows loaded${x.bad ? ", " + x.bad + " bad lines skipped" : ""}; ${x.matched} device(s) matched by name.`); } catch (e) { toast("Couldn't load: " + e.message, 7000); } }; r.readAsText(files[0]); },
  recRestoreNow() { recRestore().then(n => { render(); toast(n ? fmt(n, 0) + " kept rows restored." : "Nothing kept yet."); }).catch(e => toast("Can't keep recordings here: " + e.message, 7000)); },
  recSave() { download("iot_recording_" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".csv", recCSV(), "text/csv"); },
  recClear() { RT.rec.rows = []; RT.rec.since = null; render(); },
});

function nodeRed() {
  const flows = [{ id: "tab1", type: "tab", label: "Randis UDS IoT" }, { id: "broker1", type: "mqtt-broker", name: "broker", broker: "localhost", port: "1883", clientid: "", protocolVersion: "4" }]; let y = 40;
  S.rules.forEach((r, i) => { const d = S.devices.find(x => x.id === r.dev); if (!d) return; const tg = S.devices.find(x => x.id === r.target);
    flows.push({ id: "in" + i, type: "mqtt in", z: "tab1", name: d.name, topic: d.topic, qos: "0", datatype: "auto", broker: "broker1", x: 140, y, wires: [["fn" + i]] });
    flows.push({ id: "fn" + i, type: "function", z: "tab1", name: r.name, func: `// ${r.name}: when ${d.name} ${r.op} ${r.val} for ${r.forS}s\nconst v = Number(msg.payload);\nconst hit = v ${r.op === "=" ? "==" : r.op} ${num(r.val)};\nconst t0 = context.get("t0");\nif (!hit) { context.set("t0", null); return null; }\nif (!t0) { context.set("t0", Date.now()); }\nif (Date.now() - (t0 || Date.now()) < ${num(r.forS) * 1000}) return null;\n${r.act === "set" && tg ? `return { topic: "${tg.topic}/set", payload: ${num(r.set)} };` : `node.warn("${r.name}: " + v); return msg;`}`, outputs: 1, x: 360, y, wires: [[r.act === "set" ? "out" + i : "dbg" + i]] });
    if (r.act === "set" && tg) flows.push({ id: "out" + i, type: "mqtt out", z: "tab1", name: tg.name + " (needs a human to enable)", topic: "", qos: "0", broker: "broker1", d: true, x: 600, y, wires: [] });
    else flows.push({ id: "dbg" + i, type: "debug", z: "tab1", name: r.name, x: 600, y, wires: [] });
    y += 60; });
  return JSON.stringify(flows, null, 1);
}
function haYaml() { return "# Home Assistant MQTT entities made by Randis UDS IoT Command\nmqtt:\n  sensor:\n" + S.devices.filter(d => d.kind === "sensor").map(d => `    - name: "${d.name}"\n      state_topic: "${d.topic}"\n      unit_of_measurement: "${d.unit}"\n      unique_id: "uds_${d.id}"`).join("\n") +
  "\n  switch:\n" + S.devices.filter(d => d.kind === "actuator").map(d => `    - name: "${d.name}"\n      state_topic: "${d.topic}"\n      command_topic: "${d.topic}/set"\n      payload_on: "1"\n      payload_off: "0"\n      unique_id: "uds_${d.id}"`).join("\n") + "\n"; }
function pageExport() {
  return `<h2>Export</h2><p class="lead">Take this setup into other systems. Node-RED outputs that command devices are exported <b>disabled</b>, so a person has to switch them on.</p>
  <div class="card"><button data-act="exNodeRed" class="pri">Node-RED flows (.json)</button> <button data-act="exHA">Home Assistant MQTT (.yaml)</button> <button data-act="exCsv">Devices (.csv)</button> <button data-act="exGeo">Devices map (.geojson)</button> <button data-act="exHist">Readings history (.csv)</button> <button data-act="exLog">Event log (.csv)</button> <button data-act="backup">Backup (.json)</button></div>
  <div class="card"><h3>Home Assistant preview</h3><pre>${esc(haYaml())}</pre></div>`;
}

function selftest() {
  const keep = S, fail = []; S = APP.defaults(); RT.vals = {}; RT.hist = {}; RT.log = []; RT.t = 0; RT.held = {}; RT.armedUntil = 0;
  try {
    if (!mqttMatch("home/+/temp", "home/kitchen/temp") || mqttMatch("home/+/temp", "home/a/b/temp") || !mqttMatch("home/#", "home/a/b") || mqttMatch("home/x", "home/x/y")) fail.push("mqttMatch");
    const c = mqttConnect("abc"); if (c[0] !== 0x10 || c[1] !== c.length - 2 || String.fromCharCode(...c.slice(4, 8)) !== "MQTT" || c[8] !== 4) fail.push("connect packet " + [...c]);
    const pub = mqttPublish("a/b", "1"); const pp = mqttParse(pub.buffer); if (pp.topic !== "a/b" || pp.msg !== "1") fail.push("publish roundtrip " + JSON.stringify(pp));
    if (mqLen(321).join() !== "193,2") fail.push("varlen");
    const co2 = S.devices[2], fan = S.devices[5]; co2.model = "fixed"; RT.vals[co2.id] = 1200; co2.source = "manual";
    for (let i = 0; i < 8; i++) tick();
    if (RT.vals[fan.id] !== 1) fail.push("rule did not set fan: " + RT.vals[fan.id] + " log " + JSON.stringify(RT.log.slice(0, 3)));
    fan.source = "real"; if (command(fan, 0, "test") !== "blocked") fail.push("real actuation not blocked");
    if (!nodeRed().includes('"d": true')) fail.push("node-red out not disabled");
    JSON.parse(nodeRed()); if (!haYaml().includes("command_topic")) fail.push("ha yaml");
    if (jsonPath({ current: { t: [1, { v: 21.5 }] } }, "current.t[1].v") !== 21.5 || jsonPath({ a: 1 }, "b.c") !== undefined) fail.push("jsonPath");
    const s1 = parseSerialLine("temp=21.5, hum:40 door=on"), s2 = parseSerialLine('{"temp": "22.0", "x": {"state": "3"}}'), s3 = parseSerialLine("17.25");
    if (s1.temp !== 21.5 || s1.hum !== 40 || s1.door !== 1 || s2.temp !== 22 || s2.x !== 3 || s3.value !== 17.25 || Object.keys(parseSerialLine("garbage")).length) fail.push("serial parse " + JSON.stringify([s1, s2, s3]));
    const kt = S.devices[0]; kt.source = "serial"; kt.addr = "temp"; if (serialLine("temp=23.75 hum=41") !== 1 || RT.vals[kt.id] !== 23.75) fail.push("serial line to device");
    const hd = S.devices[1]; hd.source = "ha"; hd.addr = "sensor.kitchen humidity"; S.ha.base = "http://ha.local:8123/"; if (httpTarget(hd).url !== "http://ha.local:8123/api/states/sensor.kitchen%20humidity") fail.push("ha url " + httpTarget(hd).url);
    hd.source = "http"; hd.addr = "https://x.example/now | a.b"; const ht = httpTarget(hd); if (ht.url !== "https://x.example/now" || ht.path !== "a.b") fail.push("http target");
    if (readingOf({ state: "19.5" }) !== 19.5 || readingOf("off") !== 0) fail.push("readingOf");
    RT.armedUntil = Date.now() + 60000; if (command(hd, 1, "test") !== "readonly") fail.push("read-only adapter accepted a command while armed"); RT.armedUntil = 0;
    RT.rec.rows = []; const nv = S.devices.filter(d => RT.vals[d.id] != null).length; recSample(new Date(0)); RT.vals[kt.id] = 30; recSample(new Date(5000));
    const sm = recSummary().find(b => b.n === kt.name); if (RT.rec.rows.length !== 2 * nv || !sm || sm.lo !== 23.75 || sm.hi !== 30) fail.push("recorder " + RT.rec.rows.length + " vs " + 2 * nv + " " + JSON.stringify(sm && [sm.lo, sm.hi]));
    if (!recCSV().startsWith('"time_utc","device"')) fail.push("recorder csv");
    { const csv = recCSV(), n0 = RT.rec.rows.length, keepRows = RT.rec.rows; RT.rec.rows = []; const x = recLoadText(csv); if (x.rows !== n0 || !x.matched || recSummary().find(b => b.n === kt.name).hi !== 30) fail.push("recorder reload " + JSON.stringify(x));
      let threw = false; try { recLoadText("a,b,c,d\n1,2,3,4"); } catch (e) { threw = true; } if (!threw) fail.push("wrong csv accepted"); RT.rec.rows = keepRows; RT.rec.loaded = false; }
    { const a = modbusAddr("192.168.1.50:5020/3/IR7/f32*0.5"), b = modbusAddr("plc.local/1/CO12");
      if (!a || a.port !== 5020 || a.unit !== 3 || a.fc !== 4 || a.addr !== 7 || a.type !== "f32" || a.scale !== 0.5) fail.push("modbus addr " + JSON.stringify(a));
      if (!b || b.fc !== 1 || b.type !== "bool" || b.port !== 502) fail.push("modbus coil addr"); if (modbusAddr("1.2.3.4/1/XX3") || modbusAddr("nohost")) fail.push("bad modbus address accepted");
      const md = { ...S.devices[0], source: "modbus", addr: "10.0.0.9/1/HR100/i16*0.1" }; const tg = httpTarget(md); if (!/\/read\?host=10\.0\.0\.9&port=502&unit=1&fc=3&addr=100&type=i16&scale=0\.1$/.test(tg.url) || tg.path !== "value") fail.push("modbus url " + tg.url);
      { const sw = modbusAddr("10.0.0.9/1/HR300/f32sw"), be = modbusAddr("10.0.0.9/1/HR300/f32"); if (!sw || !sw.swap || be.swap || modbusAddr("10.0.0.9/1/HR3/u16sw").swap) fail.push("modbus swap parse");
        const dv = new DataView(new ArrayBuffer(4)); dv.setFloat32(0, 21.5); const H = dv.getUint16(0), L = dv.getUint16(2);
        if (mbDecode([H, L], 0, "f32", false, 1) !== 21.5 || mbDecode([L, H], 0, "f32", true, 1) !== 21.5 || mbDecode([L, H], 0, "f32", false, 1) === 21.5) fail.push("modbus word order");
        if (mbDecode([65535], 0, "i16", false, 0.1) !== -0.1 || mbDecode([1, 2], 0, "u32", true, 1) !== 131073 || mbDecode([5], 0, "f32", false, 1) !== undefined) fail.push("modbus decode");
        { const W = { be: [0x41AC, 0], sw: [0, 0x41AC], bs: [0xAC41, 0], le: [0, 0xAC41] };
          for (const o in W) { if (mbDecode(W[o], 0, "f32", o, 1) !== 21.5) fail.push("modbus order " + o); if (mbDecode(W[o], 0, "f32", o === "be" ? "le" : "be", 1) === 21.5) fail.push("modbus wrong order " + o + " still 21.5"); }
          if (["f32bs", "f32le", "u16bs", "u16sw", "f64"].map(t => modbusAddr("10.0.0.9/1/HR1/" + t).order).join() !== "bs,le,bs,be,be") fail.push("modbus order parse");
          if (mbDecode([0x3412], 0, "u16", "bs", 1) !== 0x1234 || mbDecode([0x3F, 0xF0 << 8, 0, 0].reverse().map(x => x), 0, "f64", "be", 1) === undefined) fail.push("modbus 16/64 order"); }
        const mk = a => ({ id: a, addr: a }), B = mbBatches(["h/1/HR100", "h/1/HR101/f32", "h/1/HR109", "h/1/HR200", "h/1/IR100", "h:503/1/HR100", "h/1/HR500/f32", "junk"].map(mk));
        const sig = B.batches.map(b => [b.fc, b.port, b.start, b.end - b.start, b.members.length].join(":")).sort().join(" ");
        if (sig !== "3:502:100:10:3 3:502:200:1:1 3:502:500:2:1 3:503:100:1:1 4:502:100:1:1" || B.bad.length !== 1) fail.push("modbus batches " + sig);
        const big = mbBatches(Array.from({ length: 130 }, (_, i) => mk("h/1/HR" + i))).batches; if (big.length !== 2 || big[0].end - big[0].start > 125) fail.push("modbus batch limit"); }
      RT.armedUntil = Date.now() + 60000; if (command(md, 1, "test") !== "readonly") fail.push("modbus accepted a command while armed"); RT.armedUntil = 0; }
    RT.rec.rows = [];
  } catch (e) { fail.push("exception " + e.message); }
  finally { S = keep; RT.vals = {}; RT.hist = {}; RT.held = {}; }
  return { fail };
}
