  return out; }
function gateHits(t) { t = String(t); return {mat: !!(mainMaterial(t) || /\b(alloy|polymer|oxide|composite|fiber|resin|ceramic|membrane|film|foam|fabric)\b/i.test(t)),
  size: /\d[\d.,]*\s?(nm|µm|μm|mm|cm|m|km|in|inch(es)?|ft|°C|°F|g|kg|mg|L|mL|m²)\b/i.test(t),
  proc: /\b(deposit\w*|sinter\w*|anneal\w*|laminat\w*|extrud\w*|cur(e|ed|ing)|etch\w*|coat\w*|mold\w*|mould\w*|weav\w*|cast(ing)?|spray\w*|print\w*|ferment\w*|press(ed|ing)?|bond\w*|machin\w*|stamp\w*|embed\w*|stitch\w*|sew\w*|blown|cut|sand\w*|heat-treated|grow\w*)\b/i.test(t),
  phys: /\b(effect|law|principle|resonance|piezoelectric|thermoelectric|faraday|bernoulli|capillary|diffusion|convection|conduction|induction|fluorescence|photoelectric|triboelectric|hysteresis|doppler|tunneling|phase change|latent heat|evaporative|osmo\w*|adsorption|catalys\w*|viscosity|buoyancy|friction|scatter\w*)\b/i.test(t),
  perf: /\d[\d.,]*\s?(%|percent|W\b|kW|mW|V\b|mAh|Hz|dB|lm|lux|psi|hours?|minutes|seconds|years?|cycles|times)/i.test(t),
  market: /\$\s?\d/.test(t) && /\b(store|shop|market|industr|retail|consumer|compan|families|schools|cafes|units)\w*/i.test(t),
  lever: /\b(moat|barrier|network effect|patent\w*|regulat\w*|exclusiv\w*|registered design|cannot be (copied|replicated)|category|platform)\b/i.test(t)}; }
const failing = i => checkIdea(i).some(c => c.sev >= 2);

function rubricScore(sc, rid) { const R = RUBRICS[rid]; if (!sc || !R) return null; let s = 0, w = 0; for (const d of R.dims) { const v = sc[d[0]]; if (v == null) continue; const wt = d[2] || 1, x = d[3] ? 11 - v : v; s += wt * (x - 1) / 9; w += wt; } return w ? Math.round(100 * s / w) : null; }
function autoScore(i) { const g = gateHits((i.title || "") + " " + (i.text || "")), ch = checkIdea(i); let s = 30 + 10 * Object.values(g).filter(Boolean).length; ch.forEach(c => s -= c.sev >= 3 ? 20 : c.sev === 2 ? 10 : 4); return clamp(s, 0, 100); }
function overall(i) { const r = i.scores || {}; for (const k of [S.cfg.rubric, "card10", "weighted"]) { const v = rubricScore(r[k], k); if (v != null) return v; } return autoScore(i); }
const isGraded = i => Object.keys(i.scores || {}).some(k => rubricScore(i.scores[k], k) != null);
const letter = s => s >= 85 ? "A" : s >= 70 ? "B" : s >= 55 ? "C" : s >= 40 ? "D" : "F";
const gradeBox = i => { const s = overall(i); return `<div class="grade g${letter(s)}" title="${isGraded(i) ? "Scorecard grade" : "Auto score (not graded yet)"}">${letter(s)}<div class="tiny">${s}${isGraded(i) ? "" : "*"}</div></div>`; };
function parseScores(t, rid) { const out = {}; for (const d of RUBRICS[rid].dims) { const re = new RegExp(d[0].replace(/_/g, "[_ ]?") + "\\s*[:=\\-]\\s*(\\d{1,2})", "i"), m = String(t).match(re); if (m) { const v = +m[1]; if (v >= 1 && v <= 10) out[d[0]] = v; } } return Object.keys(out).length >= Math.ceil(RUBRICS[rid].dims.length * .6) ? out : null; }
function gradePrompt(i, rid) { const R = RUBRICS[rid]; return `You are evaluating an invention idea. Rate it on ${R.dims.length} dimensions from 1 to 10.\n\nIDEA:\n${i.title}\n${i.text}\n\nWORDS COMBINED: ${i.a} + ${i.b}\n\nRate these (1 = poor, 10 = excellent${R.dims.some(d => d[3]) ? "; for the ones marked (high = …) give the plain amount" : ""}):\n${R.dims.map((d, k) => `${k + 1}. ${d[0]} - ${d[1]}`).join("\n")}\n\nRespond only with scores in this format:\n${R.dims.map(d => `${d[0]}: 7`).join("\n")}\n\nThen one line starting WHY: with the single biggest weakness.`; }

function ideaCard(i) { const ch = checkIdea(i); return `<div class="idea"><div class="row">${gradeBox(i)}<div class="grow"><div class="t">${esc(i.title)}</div><div class="small muted">${esc(i.a)} + ${esc(i.b)} · ${esc((MODES[i.mode] || ["by hand"])[0])}${i.ai ? " · " + esc(i.ai) : ""}</div></div><button class="sm" onclick="go('grade','${i.id}')">Open</button></div>
  ${i.card && i.card.hook ? `<div class="small" style="margin-top:6px;color:var(--acc)"><i>${esc(i.card.hook)}</i></div>` : ""}<div class="body small">${esc(i.text)}</div>
  ${ch.length ? `<div>${ch.map(c => `<span class="pill ${c.sev >= 2 ? "r" : "y"}" title="${attr(c.msg)}">${esc(c.k.replace(/_/g, " "))}</span>`).join("")}</div>` : `<span class="pill g">passes all checks</span>`}</div>`; }

VIEWS.gen = () => { const A = ARG || {}; if (A.a) { S.genA = A.a; S.genB = A.b; save(); } const a = S.genA || "water", b = S.genB || "magnets", m = S.cfg.mode, w = bankWords();
  return `<h1>⚡ Generator</h1><p class="sub">Two words in, ideas out. Build the prompt for each idea, run it in an AI, paste the answer back, and every idea is checked for the usual weak spots.</p>
  <div class="spark">${esc(a)}<i>+</i><span>${esc(b)}</span></div>
  <datalist id="wl">${w.map(x => `<option value="${attr(x)}">`).join("")}</datalist>
  <div class="grid g2"><div class="card"><h3>1 · The pair</h3>
   <div class="row"><input id="ga" list="wl" value="${attr(a)}" class="grow" onchange="go('gen',{a:this.value.trim()||'water',b:S.genB})"><b>+</b><input id="gb" list="wl" value="${attr(b)}" class="grow" onchange="go('gen',{a:S.genA,b:this.value.trim()||'magnets'})"></div>
   <div class="row" style="margin-top:6px"><button class="sm pri" onclick="const c=randomCombo();go('gen',{a:c[0],b:c[1]})">🎲 Random pair</button><button class="sm" onclick="const p=posPair();go('gen',{a:p[0],b:p[1]})">🎲 Word-combo pair</button><button class="sm" onclick="go('gen',{a:S.genB||'magnets',b:S.genA||'water'})">⇄ Swap</button></div>
   <h3 style="margin-top:12px">2 · Style</h3><select style="width:100%" onchange="S.cfg.mode=this.value;save();rerender()">${Object.entries(MODES).map(([k, v]) => `<option value="${k}" ${k === m ? "selected" : ""}>${esc(v[0])}</option>`).join("")}</select>
   <p class="small muted">${esc(MODES[m][1])}</p>
   <div class="row"><label>7D lens</label><select onchange="S.cfg.coordUse=+this.value;save();rerender()">${[[1, "1 · none (the AI picks freely)"], [2, "2 · light lens (plain words)"], [3, "3 · full 7D coordinate"]].map(([v, l]) => `<option value="${v}" ${S.cfg.coordUse === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
   <div class="row" style="margin-top:6px"><label>Ideas per pair</label><input type="number" min="1" max="50" value="${S.cfg.perCombo}" style="width:60px" onchange="S.cfg.perCombo=clamp(+this.value||10,1,50);save()">
    ${m === "balanced" || m === "tech7d" ? `<label>Words</label><input type="number" value="${S.cfg.wMin}" style="width:56px" onchange="S.cfg.wMin=+this.value||90;save()">–<input type="number" value="${S.cfg.wMax}" style="width:56px" onchange="S.cfg.wMax=+this.value||130;save()">` : ""}</div>
   <h3 style="margin-top:12px">3 · Make it</h3>
   <div class="row"><button class="pri" onclick="aiOne()">⚡ Write 1 idea with AI</button><button onclick="copy($('#pp').textContent)">📋 Copy the prompt</button><button onclick="download('mcm_prompts_'+S.genA+'_'+S.genB+'.txt',pairPrompts())">⬇ All ${S.cfg.perCombo} prompts</button></div>
   <div id="aibox">${APP ? "" : GETAPP}</div></div>
  <div class="card"><h3>Prompt for idea #${ideasOf(a, b).length + 1}</h3><pre class="stream" id="pp"></pre>
   <h3 style="margin-top:12px">Paste the AI's answer</h3><p class="small muted">Paste one idea or several. Several are split on "IDEA n:" or "NAME:" lines.</p><textarea id="paste" rows="5" placeholder="Title on the first line, then the idea…"></textarea><div class="row" style="margin-top:6px"><button class="pri" onclick="pasteIdeas()">➕ Add as ideas for this pair</button></div></div></div>
  <h2>Ideas for ${esc(a)} + ${esc(b)}</h2><div id="clist"></div>`; };
AFTER.gen = () => { drawComboList(); const a = S.genA, b = S.genB, n = ideasOf(a, b).length + 1; $("#pp").textContent = buildPrompt(S.cfg.mode, n, a, b, {coord: coordFor(n), spec: outSpec(n, S.cfg.mode), used: ideasOf(a, b).map(s => s.mat).filter(Boolean)}); };
function pairPrompts() { const a = S.genA, b = S.genB, start = ideasOf(a, b).length; return Array.from({length: S.cfg.perCombo}, (_, k) => { const n = start + k + 1; return `===== ${a} + ${b} · idea ${n} =====\n` + buildPrompt(S.cfg.mode, n, a, b, {coord: coordFor(n), spec: outSpec(n, S.cfg.mode)}); }).join("\n\n"); }
function drawComboList() { const el = $("#clist"); if (!el) return; const L = ideasOf(S.genA, S.genB);
  el.innerHTML = L.length ? L.slice().reverse().map(ideaCard).join("") : `<p class="muted">None yet for this pair. Copy the prompt, or <a onclick="go('write',{a:S.genA,b:S.genB})">write one by hand</a>.</p>`; }
function addParsed(a, b, p, mode, src) { const q = parseIdea(p, mode), i = newIdea({a, b, n: ideasOf(a, b).length + 1, mode, title: q.title, text: q.text, card: q.card, ai: src, mat: mainMaterial(q.text)}); return i; }
function pasteIdeas() { const a = S.genA, b = S.genB, t = $("#paste").value; if (!t.trim()) return toast("Paste an answer first.");
  const parts = t.split(/\n(?=\s*(?:\*\*)?(?:IDEA\s*#?\d+\s*[:.]|NAME:))/i).map(s => s.trim()).filter(s => wc(s) > 4); let k = 0;
  for (const p of parts) { addParsed(a, b, p, /^\s*NAME:/im.test(p) ? "card" : S.cfg.mode, "pasted"); k++; }
  if (!k) return toast("That looks too short to be an idea.");
  save(); toast(`Added ${k} idea(s).`); rerender(); }
async function aiOne() { const box = $("#aibox"); if (!APP) { box.innerHTML = GETAPP; return; }
  const a = S.genA, b = S.genB, n = ideasOf(a, b).length + 1, prompt = buildPrompt(S.cfg.mode, n, a, b, {coord: coordFor(n), spec: outSpec(n, S.cfg.mode), used: ideasOf(a, b).map(s => s.mat).filter(Boolean)});
  box.innerHTML = `<pre class="stream">Thinking…</pre>`;
  try { const raw = await ask(prompt, "Write exactly one idea.", p => { const s = $("#aibox .stream"); if (s) s.textContent = p; }); addParsed(a, b, raw, S.cfg.mode, AI.name || "AI"); save(); toast("New idea added."); rerender(); }
  catch (e) { box.innerHTML = `<div class="warn">${esc(e.message)}</div>`; } }

VIEWS.write = () => { const A = ARG || {}; const a = A.a || S.genA || "water", b = A.b || S.genB || "magnets", c = A.c || pick(COORDS);
  return `<h1>✍️ Write by hand</h1><p class="sub">The matrix is a human method first. Take a pair, explode every dimension, climb the abstraction ladder, and write. The checks run live as you type.</p>
  <div class="grid g2"><div class="card"><div class="row"><input id="wa" list="wl2" value="${attr(a)}" class="grow"><b>+</b><input id="wb" list="wl2" value="${attr(b)}" class="grow"><button class="sm" onclick="const r=randomCombo();go('write',{a:r[0],b:r[1]})">🎲</button></div>
   <datalist id="wl2">${bankWords().map(x => `<option value="${attr(x)}">`).join("")}</datalist>
   <p class="small" style="margin-top:10px"><b>Lens</b> <button class="sm" onclick="go('write',{a:$('#wa').value,b:$('#wb').value,c:pick(COORDS)})">🎲 new coordinate</button></p>
   <p>${c.map((v, k) => `<span class="pill b" title="${attr(DIMS[k].name)}">${DIMS[k].k} ${esc(v)}</span>`).join("")}</p>
   <input id="wt" placeholder="Title" style="width:100%;margin-top:8px" oninput="liveCheck()"><textarea id="wx" rows="9" placeholder="How the two words combine… the material, size, process, principle and a measured result… who buys it… why it is hard to copy…" style="margin-top:6px" oninput="liveCheck()"></textarea>
   <div class="row" style="margin-top:6px"><span id="wcn" class="small muted">0 words</span><button class="pri" style="margin-left:auto" onclick="saveHand(${attr(JSON.stringify(c))})">💾 Save idea</button></div></div>
  <div class="card"><h3>Live checks</h3><div id="lc"></div><h3 style="margin-top:12px">7 big questions</h3><ol class="small">${SEVEN_Q.map(q => `<li>${esc(q)}</li>`).join("")}</ol>
   <h3>Explode every dimension</h3><p class="small muted">Read each word as: ${DEF_EX.map(d => esc(d[0])).join(" · ")}.</p></div></div>`; };
AFTER.write = () => liveCheck();
function liveCheck() { const i = {a: $("#wa").value, b: $("#wb").value, title: $("#wt").value, text: $("#wx").value, mode: "tech7d", hand: true}; const ch = checkIdea(i), g = gateHits(i.text);
  $("#wcn").textContent = wc(i.text) + " words"; $("#lc").innerHTML = `<p>${FIVE_Q.map(([k, n]) => `<span class="pill ${g[k] ? "g" : ""}">${g[k] ? "✓" : "○"} ${esc(n)}</span>`).join("")}<span class="pill ${g.market ? "g" : ""}">${g.market ? "✓" : "○"} Market $ + buyers</span><span class="pill ${g.lever ? "g" : ""}">${g.lever ? "✓" : "○"} Barrier</span></p>` + (i.text.trim() ? ch.map(x => `<div class="small" style="color:${x.sev >= 2 ? "var(--red)" : "#9c6b00"}">• ${esc(x.msg)}</div>`).join("") || `<div class="ok">No problems found. 🎉</div>` : `<p class="muted small">Start writing…</p>`); }
function saveHand(c) { const a = $("#wa").value.trim(), b = $("#wb").value.trim(), t = $("#wx").value.trim(); if (!t) return toast("Write the idea first."); const i = newIdea({a, b, n: ideasOf(a, b).length + 1, mode: "tech7d", hand: true, title: $("#wt").value.trim() || words(t).slice(0, 6).join(" "), text: t, coord: c, ai: "by hand", mat: mainMaterial(t)}); save(); toast("Saved to the Library."); go("grade", i.id); }

VIEWS.grade = id => { let i = id ? idea(id) : null; const list = S.ideas; if (!i && list.length) i = list.find(x => !isGraded(x)) || list[list.length - 1];
  if (!i) return `<h1>🎯 Grader</h1><p class="muted">No ideas yet. Make some on the <a onclick="go('gen')">Generator</a> or <a onclick="go('write')">write one by hand</a>.</p>`;
  const k = list.indexOf(i), ch = checkIdea(i), g = gateHits(i.title + " " + i.text), ung = list.filter(x => !isGraded(x)).length;
  const slid = rid => { const R = RUBRICS[rid], sc = (i.scores || {})[rid] || {}; return `<div class="card"><div class="row"><h3 class="grow">${esc(R.name)}</h3><b>${rubricScore(sc, rid) ?? "—"}</b><span class="small muted">/100</span></div><p class="tiny muted">${esc(R.src)}</p>
    ${R.dims.map(d => `<div class="slider"><span title="${attr(d[1])}">${esc(d[0].replace(/_/g, " ").toLowerCase())}${d[2] > 1 ? " ×2" : ""}${d[3] ? " ↓" : ""}</span><input type="range" min="1" max="10" value="${sc[d[0]] || 5}" oninput="this.nextElementSibling.textContent=this.value" onchange="setScore('${i.id}','${rid}','${d[0]}',+this.value)"><b>${sc[d[0]] || "·"}</b></div>`).join("")}
    <div class="row" style="margin-top:8px"><button class="sm" onclick="gradeNow('${i.id}','${rid}')">🤖 AI grade</button><button class="sm" onclick="const x=idea('${i.id}');if(x)copy(gradePrompt(x,'${rid}'))">📋 Copy grading prompt</button>${Object.keys(sc).length ? `<button class="sm" onclick="const x=idea('${i.id}');if(x&&x.scores)delete x.scores['${rid}'];save();rerender()">Clear</button>` : ""}</div></div>`; };
  return `<h1>🎯 Grader</h1><p class="sub">Idea ${k + 1} of ${list.length} · ${ung} not graded yet. Drag the sliders to grade by hand. Edit the text and the checks update.</p>
  <div class="row" style="margin-bottom:10px"><button onclick="go('grade','${(list[k - 1] || i).id}')">◀ Prev</button><button onclick="go('grade','${(list[k + 1] || i).id}')">Next ▶</button><button onclick="const n=S.ideas.find(x=>!isGraded(x));n?go('grade',n.id):toast('All graded.')">Next ungraded</button>
   <button class="bad" style="margin-left:auto" onclick="if(confirm('Delete this idea?')){S.ideas=S.ideas.filter(x=>x.id!=='${i.id}');save();go('grade')}">Delete</button></div>
  <div id="gstat"></div>
  <div class="grid g2"><div><div class="idea"><div class="row">${gradeBox(i)}<div class="grow"><input value="${attr(i.title)}" style="width:100%;font-weight:700" onchange="const x=idea('${i.id}');if(x){x.title=this.value;save()}"><div class="small muted">${esc(i.a)} + ${esc(i.b)} · ${esc((MODES[i.mode] || ["by hand"])[0])} · ${esc(i.ai || "")}</div></div></div>
   <textarea rows="10" style="margin-top:6px" onchange="const x=idea('${i.id}');if(x){x.text=this.value;x.mat=mainMaterial(this.value);save();rerender()}">${esc(i.text)}</textarea>
   <p class="small muted">${wc(i.text)} words · primary material: ${esc(i.mat || mainMaterial(i.text) || "—")}${i.coord ? ` · lens ${i.coord.map(esc).join(" × ")}` : ""}</p>
   ${i.why ? `<p class="small"><b>Reviewer:</b> ${esc(i.why)}</p>` : ""}</div>
   <div class="card"><h3>Checks</h3>${ch.length ? ch.map(c => `<div class="small" style="color:${c.sev >= 2 ? "var(--red)" : "#9c6b00"}">• ${esc(c.msg)}</div>`).join("") : `<div class="ok">Passes every check. 🎉</div>`}
   <h3 style="margin-top:10px">The 5 questions + market + barrier</h3><p>${FIVE_Q.map(([q, n, h]) => `<span class="pill ${g[q] ? "g" : ""}" title="${attr(h)}">${g[q] ? "✓" : "○"} ${esc(n)}</span>`).join("")}<span class="pill ${g.market ? "g" : ""}">${g.market ? "✓" : "○"} Market</span><span class="pill ${g.lever ? "g" : ""}">${g.lever ? "✓" : "○"} Barrier</span></p><p class="tiny muted">Found by pattern matching, so treat them as hints.</p></div></div>
  <div class="grid" style="align-content:start">${slid(S.cfg.rubric)}${Object.keys(RUBRICS).filter(r => r !== S.cfg.rubric).map(slid).join("")}
   <div class="card"><label>Main scorecard (used for the letter grade)</label> <select onchange="S.cfg.rubric=this.value;save();rerender()">${Object.entries(RUBRICS).map(([k, r]) => `<option value="${k}" ${k === S.cfg.rubric ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></div></div></div>`; };
function setScore(id, rid, k, v) { const i = idea(id); if (!i) return; i.scores = i.scores || {}; i.scores[rid] = i.scores[rid] || {}; i.scores[rid][k] = v; save(); rerender(); }
async function gradeNow(id, rid) { const st = $("#gstat"); if (!idea(id) || !st) return; if (!APP) { st.innerHTML = GETAPP.replace("paste the answer back below", "set the sliders from its answer"); return; }
  st.innerHTML = `<div class="ok">Grading…</div>`; try { const i = idea(id), r = await ask(gradePrompt(i, rid), "Grade one idea. Be strict and consistent."), sc = parseScores(r, rid); if (!sc) throw new Error("The AI's scores couldn't be read."); i.scores = i.scores || {}; i.scores[rid] = sc; const w = r.match(/WHY:\s*(.+)/i); if (w) i.why = w[1].trim(); save(); rerender(); } catch (e) { st.innerHTML = `<div class="warn">${esc(e.message)}</div>`; } }

VIEWS.library = () => { const A = Object.assign({q: "", st: "", sort: "new"}, ARG || {}); ARG = A; let L = S.ideas.slice();
  if (A.q) { const q = A.q.toLowerCase(); L = L.filter(i => (i.title + " " + i.text + " " + i.a + " " + i.b).toLowerCase().includes(q)); }
  if (A.st === "flagged") L = L.filter(failing); if (A.st === "ok") L = L.filter(i => !failing(i)); if (A.st === "ungraded") L = L.filter(i => !isGraded(i));
  L.sort(A.sort === "grade" ? (a, b) => overall(b) - overall(a) : A.sort === "old" ? (a, b) => a.created - b.created : A.sort === "combo" ? (a, b) => comboKey(a.a, a.b).localeCompare(comboKey(b.a, b.b)) : (a, b) => b.created - a.created);
  const set = (k, v) => `go('library',Object.assign({},ARG,{${k}:${v}}))`;
  return `<h1>📚 Library</h1><p class="sub">${fmtN(S.ideas.length)} ideas across ${new Set(S.ideas.map(i => comboKey(i.a, i.b))).size} pairs.</p>
  <div class="row" style="margin-bottom:10px"><input id="lq" placeholder="🔎 Search ideas…" value="${attr(A.q)}" onchange="${set("q", "this.value")}" style="width:220px">
   <select onchange="${set("st", "this.value")}"><option value="">Any status</option><option value="ok" ${A.st === "ok" ? "selected" : ""}>Passes checks</option><option value="flagged" ${A.st === "flagged" ? "selected" : ""}>Flagged</option><option value="ungraded" ${A.st === "ungraded" ? "selected" : ""}>Not graded</option></select>
   <select onchange="${set("sort", "this.value")}">${[["new", "Newest"], ["old", "Oldest"], ["grade", "Best grade"], ["combo", "By pair"]].map(([k, v]) => `<option value="${k}" ${A.sort === k ? "selected" : ""}>${v}</option>`).join("")}</select>
   <span class="small muted">${L.length} shown</span><span class="grow"></span><button onclick="download('mcm_ideas.md',libraryMD())">⬇ Markdown</button><button onclick="download('mcm_ideas.csv',libraryCSV(),'text/csv')">⬇ CSV</button></div>
  ${L.length ? `<table><tr><th>Grade</th><th>Idea</th><th>Pair</th><th>Checks</th></tr>
  ${L.map(i => { const bad = checkIdea(i).filter(x => x.sev >= 2).length; return `<tr class="click" onclick="go('grade','${i.id}')"><td>${gradeBox(i)}</td><td><b>${esc(i.title)}</b><div class="small muted">${esc(String(i.text).slice(0, 150))}…</div></td><td class="small">${esc(i.a)} + ${esc(i.b)}</td><td>${bad ? `<span class="pill r">${bad} issue(s)</span>` : `<span class="pill g">ok</span>`}</td></tr>`; }).join("")}</table>` : `<p class="muted">No ideas match.</p>`}`; };
function libraryMD() { return `# My Moore's Combinatorics Matrix ideas\n\n${S.ideas.map(i => `## ${i.title}\n\n*${i.a} + ${i.b} · grade ${letter(overall(i))} (${overall(i)})*\n\n${i.text}\n`).join("\n")}`; }
function libraryCSV() { const q = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [["title", "word_a", "word_b", "grade", "score", "passes_checks", "text"]].concat(S.ideas.map(i => [i.title, i.a, i.b, letter(overall(i)), overall(i), failing(i) ? "no" : "yes", i.text])).map(r => r.map(q).join(",")).join("\n"); }

VIEWS.home = () => { const n = S.ideas.length, g = S.ideas.filter(isGraded).length, ok = S.ideas.filter(i => !failing(i)).length, combos = new Set(S.ideas.map(i => comboKey(i.a, i.b))).size, best = S.ideas.slice().sort((a, b) => overall(b) - overall(a)).slice(0, 3);
  return `<h1>Moore's Combinatorics Matrix</h1><p class="sub">A systematic idea engine: cross two words, look at the point in seven dimensions where they meet, and turn what you find into ideas you can grade, keep and share.</p>
  <div class="grid g4"><div class="kpi k1"><div class="v">${fmtN(n)}</div><div class="l">ideas</div><div class="s">${combos} pairs</div></div><div class="kpi k2"><div class="v">${n ? Math.round(100 * ok / n) : 0}%</div><div class="l">pass all checks</div><div class="s">aim for 85% or more</div></div><div class="kpi k3"><div class="v">${g}</div><div class="l">graded</div><div class="s">by hand or AI</div></div><div class="kpi k4"><div class="v">${fmtN(bankWords().length)}</div><div class="l">words in the list</div><div class="s">${fmtN(bankWords().length * (bankWords().length - 1))} pairs</div></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>✨ Start here</h3><ol class="small"><li>Open the <a onclick="go('matrix')">Matrix</a> and click any square, or press the dice for a random pair.</li><li>On the <a onclick="go('gen')">Generator</a>, copy the prompt into any AI chat and paste the answer back. In the Randis UDS app the linked AI writes it for you.</li><li>Every idea is checked as it arrives. Grade it on the <a onclick="go('grade')">Grader</a>.</li><li>Keep your work: <a onclick="go('data')">export a backup</a>, or download the library as Markdown or CSV.</li></ol>
   <div class="row"><button class="pri" onclick="const c=randomCombo();go('gen',{a:c[0],b:c[1]})">🎲 Spark a random pair</button><button onclick="go('write')">✍️ Write one by hand</button></div></div>
   <div class="card"><h3>🏆 Best ideas</h3>${best.map(i => `<div class="row" style="margin:6px 0">${gradeBox(i)}<div><a onclick="go('grade','${i.id}')"><b>${esc(i.title)}</b></a><div class="small muted">${esc(i.a)} × ${esc(i.b)}</div></div></div>`).join("") || `<p class="muted small">None yet.</p>`}</div></div>`; };

VIEWS.coords = () => { const used = {}; S.ideas.forEach(i => { if (i.coord) { const k = i.coord.join("|"); used[k] = (used[k] || 0) + 1; } });
  return `<h1>🧭 The 7-dimensional coordinate system</h1><p class="sub">Each idea is a point in seven dimensions. They are conceptual, not literal: a Nano idea doesn't need nano parts, it thinks with nano-level principles.</p>
  <div class="grid g3">${DIMS.map(d => `<div class="card"><h3>${d.k} · ${d.name}</h3><p class="tiny muted">${esc(d.note)}</p><p>${d.vals.map(v => `<span class="pill">${esc(v)}</span>`).join("")}</p></div>`).join("")}</div>
  <h2>Dimension G: the meanings of "wood screw"</h2><table><tr><th>Type</th><th>Meaning</th><th>Example</th></tr>${DEF_EX.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table>
  <h2>Sample coordinates</h2><p class="small muted">The Generator cycles through these, one per idea. The 7D lens setting decides how much of the coordinate the AI sees (it is never printed in the idea).</p>
  <table><tr><th>#</th>${DIMS.map(d => `<th>${d.name}</th>`).join("")}<th>Used</th><th></th></tr>${COORDS.map((c, k) => `<tr><td>${k + 1}</td>${c.map(v => `<td class="small">${esc(v)}</td>`).join("")}<td>${used[c.join("|")] || ""}</td><td><button class="sm" title="Write with this lens" onclick="go('write',{c:COORDS[${k}]})">✍️</button></td></tr>`).join("")}</table>`; };

VIEWS.method = () => `<h1>🧠 The method</h1><p class="sub">The principles behind the matrix, the questions every idea should answer, and tips for getting great ideas out of an AI.</p>
  <div class="grid g2"><div class="card"><h3>Five core principles</h3>${PRINCIPLES.map(([a, b], k) => `<p><b>${k + 1}. ${esc(a)}</b><br><span class="small muted">${esc(b)}</span></p>`).join("")}</div>
  <div class="card"><h3>7 big questions per idea</h3><ol>${SEVEN_Q.map(q => `<li>${esc(q)}</li>`).join("")}</ol><h3>The abstraction ladder</h3><p>${DIMS[5].vals.map((v, k) => `<span class="pill ${["", "b", "y", "g", "r"][k]}">${k + 1}. ${esc(v)}</span>`).join(" → ")}</p>
   <p class="small">High scores for innovation and abstraction leverage can make up for a harder build, a longer timeline or more money needed. The goal is a leap, not a small tweak. That is why the weighted scorecard counts those two double.</p></div></div>
  <h2>The 5 questions every mechanism should answer</h2><table>${FIVE_Q.map(([k, a, b], j) => `<tr><td>${j + 1}</td><td><b>${esc(a)}</b></td><td class="small">${esc(b)}</td></tr>`).join("")}</table>
  <h2>Tips for working with an AI</h2><div class="grid g2">${TIPS.map(([a, b]) => `<div class="card"><h3>${esc(a)}</h3><p class="small muted">${esc(b)}</p></div>`).join("")}</div>`;

VIEWS.data = () => { const kb = Math.round(JSON.stringify(S).length / 1024);
  return `<h1>💾 Save & export</h1><div class="grid g2"><div class="card"><h3>Where your work lives</h3>
   <p>${store.ok ? "✅ Saved in this browser as you work." : "ℹ️ Here your work is kept while the page is open. Export a backup to keep it."} (${kb} KB)</p>
   <div class="row"><button class="pri" onclick="download('mcm_backup.json',JSON.stringify(S),'application/json')">⬇ Full backup (.json)</button><button onclick="pickFile('.json',restoreBackup)">⬆ Restore or merge a backup…</button></div>
   <div class="row" style="margin-top:8px"><button onclick="download('mcm_ideas.md',libraryMD())">⬇ Ideas as Markdown</button><button onclick="download('mcm_ideas.csv',libraryCSV(),'text/csv')">⬇ Ideas as CSV</button><button onclick="download('mcm_words_${S.bank}.txt',bankWords().join('\\n'))">⬇ Word list</button></div></div>
  <div class="card"><h3>Start fresh</h3><p class="small muted">Put the five sample ideas back, or clear everything. Export a backup first if you want to keep your ideas.</p>
   <div class="row"><button onclick="if(confirm('Replace your ideas with the five samples?')){S.ideas=sampleIdeas();S.ideas.forEach(i=>i.mat=mainMaterial(i.text));S.nextId=S.ideas.length+1;save();toast('Samples are back.');go('library')}">↺ Load the samples</button><button class="bad" onclick="if(confirm('Delete all ideas and your words?')){const k=S.cfg;S=DEFAULTS();S.cfg=k;save();go('home')}">Delete everything</button></div></div></div>
  <h2>About</h2><p class="small">MCM Software · Moore's Combinatorics Matrix™ · made with Randis UDS. In the Randis UDS app, the Generator and Grader can use your linked AI directly.</p>`; };
function restoreBackup(f) { f.text().then(t => { let d; try { d = JSON.parse(t); } catch (e) { return toast("That isn't a backup file."); } if (!d || !Array.isArray(d.ideas)) return toast("That isn't an MCM backup.");
  const merge = S.ideas.length && confirm("Merge with what's here? (Cancel replaces everything)"); if (merge) { const have = new Set(S.ideas.map(i => i.id)); d.ideas.forEach(i => { if (have.has(i.id)) i.id = "i" + (S.nextId++); S.ideas.push(i); }); S.custom = uniq(S.custom.concat(d.custom || [])); } else { const D = DEFAULTS(); S = Object.assign(D, d); S.cfg = Object.assign(D.cfg, d.cfg || {}); }
  S.nextId = Math.max(S.nextId || 1, ...S.ideas.map(i => +String(i.id).slice(1) || 0)) + 1; save(); toast(`Loaded ${d.ideas.length} ideas.`); go("library"); }); }

boot();
if (HOST) { try { parent.postMessage({uds: "store-get"}, "*"); } catch (e) {} }
</script></body></html>
