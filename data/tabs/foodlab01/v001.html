rm with DEC whether the old cottage food exemption is fully repealed.", "status": "UNCHECKED"}, {"code": "AZ", "state": "Arizona", "program": "Arizona Cottage Food Program (Arizona Revised Statutes 36-931 to 36-933; Administrative Code R9-8-101.02)", "allowed": "Foods prepared in a home kitchen (up to 1,000 square feet), both non-potentially hazardous and, by department rule, time/temperature controlled foods; meat or poultry only if federally inspected or exempt.", "not_allowed": "Alcoholic beverages, unpasteurized milk, fish and shellfish, uninspected meat/poultry, marijuana products; use as an ingredient in food sold at a permitted retail establishment; using the kitchen as a commissary for a mobile food unit.", "sales_cap": "Not stated in the statute or rule read.", "label": "Name and registration number of preparer; all ingredients; production date; statement: 'This product was produced in a home kitchen that may come in contact with common food allergens and pet allergens and is not subject to public health inspection.'; department website address for reporting illness and verifying registration; disclosure if made in a developmental disabilities facility.", "permit": "Registration with the ADHS online registry plus an accredited food handler course; registration renews every three years. Fee not stated on pages read.", "where": "Arizona only. Non-temperature-controlled foods: direct or via third-party vendor, carrier or delivery platform; online allowed. Dairy, meat, poultry or temperature-controlled foods: in-person delivery only, no delivery platforms. Third-party stores must keep them separate with a sign.", "source_url": "https://www.azleg.gov/ars/36/00932.htm", "source_title": "Arizona Revised Statutes 36-932 - Arizona Legislature", "second_url": "https://www.azdhs.gov/documents/preparedness/epidemiology-disease-control/food-safety-environmental-services/cottage-food-program/r9-8-101-02-cottage-food.pdf", "checked": true, "date_read": "2026-11-24", "notes": "The ADHS program landing page URL returned not found; read the statute and the rule PDF published Feb 2025 in the Arizona Administrative Register. Registration fee not on pages read.", "status": "CHECKED"}, {"code": "AR", "state": "Arkansas", "program": "Food Freedom Act (Act 1040 of 2021) - Homemade Non-TCS Food", "allowed": "Homemade foods that need no time/temperature control: baked goods and other non-TCS foods, pickled cucumbers and acidified vegetables with pH 4.6 or less (with recipe and pH records), whole uncut raw fruits and vegetables, maple syrup, sorghum, honey.", "not_allowed": "Time/temperature controlled foods (dairy, meat, poultry, seafood, cut melons or tomatoes, cut leafy greens, garlic in oil, sprouts), canned low-acid foods, meat products; sales to restaurants for use in the restaurant.", "sales_cap": "Not stated in the guide.", "label": "Date made; producer name, address and phone (or a state Department of Agriculture ID number); common name; ingredients in descending order; statement: 'This product was produced in a private residence that is exempt from state licensing and inspection. This product may contain allergens.' Online listings must show the same, and the package must be labeled.", "permit": "No permit from the Department of Health for homemade non-TCS food. Training not stated in the guide.", "where": "Direct to the informed end consumer in person, by phone or online, by producer, agent or third-party vendor (retail shop or grocery store); from home, farm or office; within Arkansas, or other states if federal law is followed; delivery by mail or carrier allowed.", "source_url": "https://healthy.arkansas.gov/wp-content/uploads/Homemade-Food-Guide-5.21.2026-Update.pdf", "source_title": "Arkansas Homemade Food Production Guide (May 21, 2026) - Arkansas Department of Health", "second_url": "", "checked": false, "date_read": "2026-11-24", "notes": "The Department of Health cottage food landing page URL returned 404. Act 1040 text was not read directly.", "status": "UNCHECKED"}, {"code": "CA", "state": "California", "program": "California Homemade Food Act - Cottage Food Operations (Health and Safety Code 113758 and 114365; AB 1144)", "allowed": "Non-potentially hazardous foods prepared in a home kitchen, limited to the CDPH Approved Cottage Food List (the list itself was not read).", "not_allowed": "Foods not on the Approved Cottage Food List; potentially hazardous foods.", "sales_cap": "Class A: $88,878 in verifiable gross annual sales for 2026 (base $75,000, inflation adjusted). Class B: $177,756 for 2026 (base $150,000).", "label": "Not stated on the pages read (CDPH says labels must comply with state and federal requirements).", "permit": "Class A: register with the local environmental health department and submit a self-certification checklist; no routine inspection. Class B: permit from the local agency after an initial inspection, up to one inspection a year. Cottage Food Operator training within three months of registration or permit. Renewed annually; fees set locally.", "where": "Class A: direct sales to the public, including phone, internet, mail or third-party delivery, statewide. Class B: direct and indirect (restaurants, food markets) statewide.", "source_url": "https://www.cdph.ca.gov/Programs/CEH/DFDCS/Pages/FDBPrograms/FoodSafetyProgram/CottageFoodOperations.aspx", "source_title": "Cottage Food Operations - California Department of Public Health", "second_url": "https://www.cdph.ca.gov/Programs/CEH/DFDCS/CDPH%20Document%20Library/FDB/FoodSafetyProgram/CottageFood/CFOAdjustedGrossAnnualSalesLimit2026.pdf", "checked": false, "date_read": "2026-11-24", "notes": "Caps confirmed on the CDPH page, the CDPH 2026 limit sheet and statute text; the approved foods list and label wording were not read. Local fees differ by county.", "status": "UNCHECKED"}, {"code": "CO", "state": "Colorado", "program": "Colorado Cottage Foods Act (current law); Tamale Act HB26-1033 starts January 1, 2027", "allowed": "Non-potentially hazardous foods: baked goods (muffins, fruit pies, cookies, cakes), jams, jellies, honey, candies, dry spices and teas, dehydrated and freeze-dried produce, nuts, roasted coffee, tortillas, pickled produce at pH 4.6 or below, up to 250 dozen eggs a month.", "not_allowed": "Meat, fish, cream/custard/meringue fillings, butter-based buttercream, sauces, condiments, beverages, cut fresh produce, juices, pepper jellies, freeze-dried meals, CBD and THC products.", "sales_cap": "Current law: $10,000 net revenue per product per year. From January 1, 2027: $150,000 total gross per calendar year.", "label": "Point-of-sale sign: 'This product was produced in a home kitchen that is not subject to state licensure or inspection. This product is not intended for resale.' Informed consumer info: product name, where prepared, producer phone or email, date produced, ingredients, home-kitchen and allergen disclaimer. From 2027: registration number, county, contact, date, department website.", "permit": "Current law: no registration, but a food safety course is required (CSU Extension, food handler card, or local public health agency course). From 2027: annual CDPHE registration and training certificate required.", "where": "Directly from producer or designated representative to the informed end consumer, in Colorado only, including internet sales. Not to restaurants or grocery stores, not through consignment, no catering.", "source_url": "https://cdphe.colorado.gov/dehs/cottage-foods", "source_title": "Cottage Foods Act - Colorado Department of Public Health and Environment", "second_url": "https://cdphe.colorado.gov/dehs/cf/2027-tamale-act/colorado-cottage-food-act-updates", "checked": false, "date_read": "2026-11-24", "notes": "Second CDPHE page confirms the 2027 changes but not the current cap; main page undated. The fetch tool was blocked by CDPHE (403), so pages were read with a direct request.", "status": "UNCHECKED"}, {"code": "CT", "state": "Connecticut", "program": "Connecticut Cottage Food Operator License (Public Act 18-141; Connecticut General Statutes chapter 417)", "allowed": "Non-potentially hazardous foods: loaf breads, rolls, biscuits, cakes (not cheesecake), pastries, cookies, candies, fruit pies (not pumpkin), jams and jellies, dried fruits, dry herbs and seasonings, cereals, granola, nuts, vinegars, popcorn, cotton candy, roasted coffee beans (list not inclusive).", "not_allowed": "Cooked vegetable products, salsa, sauces, fruit butters, beverages including cider, meat and poultry, cheesecake, cream pies; wholesale, consignment, grocery stores, restaurants, schools, care facilities.", "sales_cap": "$50,000 in gross sales per calendar year; records of all sales required.", "label": "Allergen info per federal rules and the statement in at least 10-point type: 'Made in a Cottage Food Operation that is not Subject to Routine Government Food Safety Inspection.' Also home address (not P.O. Box) and ingredients in descending order by weight (from the DCP guide).", "permit": "License from the Department of Consumer Protection, $50 application fee, approved food safety course, written proof of local zoning approval, water test if private well. No pre-license kitchen inspection.", "where": "Directly to consumers, in person, or online orders that you deliver yourself within Connecticut. Not by mail, UPS or FedEx, or delivery apps. Some farmers markets require more.", "source_url": "https://portal.ct.gov/dcp/knowledge-base/articles/cottage-foods/sales-and-doing-business-in-connecticut", "source_title": "Sales and Doing Business in Connecticut - Department of Consumer Protection", "second_url": "https://portal.ct.gov/-/media/dcp/news-releases-from-the-department-of-consumer-protection/cottage_food_manual.pdf", "checked": false, "date_read": "2026-11-24", "notes": "The DCP guide PDF is undated (written 2018) and the cap figure came from the sales page only; foods and label came from the guide, so the two pages were not a full cross-check.", "status": "UNCHECKED"}, {"code": "DE", "state": "Delaware", "program": "Cottage Food Regulations (16 Delaware Administrative Code 4458A)", "allowed": "Non-TCS foods on the Division's approved list: baked goods (cakes, breads, cookies, rolls, muffins, brownies, fruit pies, pastries), jams, jellies, fruit preserves, candy that is non-TCS.", "not_allowed": "TCS foods; bakery items with cream filling or meat; cannabis products; online sales (advertising is allowed); wholesale or sales to resellers or food establishments.", "sales_cap": "No sales cap in the regulations.", "label": "CFE name; product name; town/city, Delaware; phone or email; net weight or count; production date or lot number; ingredients in descending order; major allergens; statement: 'This food is made in a Cottage Food Establishment and is NOT subject to routine Government Food Safety Inspections' in at least 10-point type.", "permit": "Annual registration, $30 per establishment (April 1 to March 31); application with floor plan, labels and proof of training; preoperational inspection possible; a staff member must have passed an approved food safety test.", "where": "Direct to consumers within Delaware only, at farmers markets, craft fairs, charity functions or other approved venues; registration displayed.", "source_url": "https://archive.regulations.delaware.gov/AdminCode/title16/Department%20of%20Health%20and%20Social%20Services/Division%20of%20Public%20Health/Health%20Systems%20Protection%20(HSP)/4458A.shtml", "source_title": "16 DE Admin. Code 4458A Cottage Food Regulations - Delaware Division of Public Health", "second_url": "https://dhss.delaware.gov/dph/hsp/ofpcfe/", "checked": false, "date_read": "2026-11-24", "notes": "Page last updated Nov 29, 2023. A February 2026 Delaware Register notice proposes revisions, so rules may be changing. The DPH program page was seen only in search results (the fetch returned 404).", "status": "UNCHECKED"}, {"code": "DC", "state": "District of Columbia", "program": "Cottage Food Business Registry (D.C. Code 7-742.01 and 7-742.02; 25-K DCMR)", "allowed": "Non-potentially hazardous foods per Department of Health regulations; the code also allows temperature-controlled foods on the Department's approved list.", "not_allowed": "Foods not approved by the Department; businesses that need a food establishment license; alcohol (per the 2018 FAQ).", "sales_cap": "Code sections read state no cap. The 2018 DC Health FAQ says annual revenue may not exceed $25,000. These conflict.", "label": "Prepackaged with: registry identification number; product name; ingredients in descending order by weight; net weight or volume; allergen info; nutrition info if a claim is made; statement in at least 10-point type: 'Made by a cottage food business that is not subject to the District of Columbia's food safety regulations.'", "permit": "Register with the Cottage Food Business Registry (2018 FAQ: $50 for two years); pre-operational kitchen inspection; home occupancy permit; DC Health certification.", "where": "D.C. Code 7-742.01 says direct, retail, wholesale to licensed food establishments or online, within the District. The 2018 FAQ says only farmers markets and public events.", "source_url": "https://code.dccouncil.gov/us/dc/council/code/sections/7-742.02", "source_title": "D.C. Code 7-742.02 Cottage food businesses - Council of the District of Columbia", "second_url": "https://dchealth.dc.gov/sites/default/files/dc/sites/doh/publication/attachments/Cottage%20Food%20FAQs-%20Apr%202018.pdf", "checked": false, "date_read": "2026-11-24", "notes": "Official sources conflict: the 2018 DC Health FAQ is older than the current D.C. Code text (the law appears amended since 2018). Treat the Code as current but confirm with DC Health at food.safety@dc.gov.", "status": "UNCHECKED"}, {"code": "FL", "state": "Florida", "program": "Florida Cottage Food Law (Florida Statutes 500.80)", "allowed": "Low-risk foods: breads, rolls, biscuits, cakes, pastries, cookies, candies, honey, jams, jellies, fruit pies, dried fruits, dry herbs and seasonings, homemade pasta, cereals, trail mixes, granola, nuts, vinegars, popcorn.", "not_allowed": "Wholesale sales; foods needing time/temperature control (page says only low-risk foods qualify); selling products not stored on the premises.", "sales_cap": "$250,000 in annual gross sales across all locations.", "label": "Prepackaged with: name and address; product name; ingredients in descending order by weight; net weight or volume; allergen info; nutrition info if a claim is made; statement in at least 10-point type: 'Made in a cottage food operation that is not subject to Florida's food safety regulations.'", "permit": "No food permit from FDACS if under the cap. Training not stated. Inspection only after a complaint.", "where": "Online, mail order, direct to consumers in person, by mail or carrier, or to an event venue. Wholesale is prohibited. Local governments cannot prohibit cottage food operations.", "source_url": "https://www.fdacs.gov/Business-Services/Food-Establishments/Cottage-Foods", "source_title": "Cottage Foods - Florida Department of Agriculture and Consumer Services", "second_url": "https://www.flsenate.gov/Laws/Statutes/2025/0500.80", "checked": false, "date_read": "2026-11-24", "notes": "Statute read was the 2025 edition. The food list is on the FDACS page only; the statute section read does not list foods, so the food list is unconfirmed.", "status": "UNCHECKED"}, {"code": "GA", "state": "Georgia", "program": "Cottage Food program (Georgia Rule 40-7-19; HB 398 effective July 1, 2025)", "allowed": "Non-potentially hazardous foods: breads, rolls, biscuits, cakes without refrigerated fillings, pastries, cookies, candies, fruit pies, jams, jellies, dried fruits, dry herbs and seasonings, cereals, trail mixes, granola, coated nuts, vinegars, popcorn, cotton candy.", "not_allowed": "Potentially hazardous foods; fruit butters; home-canned produce as an ingredient (except jams and jellies); pet food (needs a feed license).", "sales_cap": "Not stated on either official page.", "label": "Business name and home address; common name; ingredients in descending order; net weight; allergens; nutrition info if a claim is made; statement: 'MADE IN A COTTAGE FOOD OPERATION THAT IS NOT SUBJECT TO STATE FOOD SAFETY INSPECTIONS' in Times New Roman or Arial, at least 10-point (from the rule).", "permit": "Conflict: the rule text says a $100 yearly Cottage Food License; the current GDA page says HB 398 removes the state licensing requirement and lists an identification number registration form. ANSI-accredited food safety training required (food handler training accepted).", "where": "Directly to consumers: events (non-profit and for-profit), online, and under HB 398 retail stores. The older rule bars wholesale and sales to restaurants or institutions.", "source_url": "https://agr.georgia.gov/cottage-food", "source_title": "Cottage Food - Georgia Department of Agriculture", "second_url": "https://rules.sos.ga.gov/GAC/40-7-19", "checked": true, "date_read": "2026-11-24", "notes": "Foods and the no-cap point agree on both pages; license, fee and retail sales differ because the rule text predates HB 398 and the GDA page says the law is still under revision.", "status": "CHECKED"}, {"code": "HI", "state": "Hawaii", "program": "Homemade Food Operations (Hawaii Administrative Rules Chapter 11-50, Food Safety Branch)", "allowed": "Foods that do not need time or temperature control for safety made in a home kitchen, such as jams and jellies, baked goods without custard or cream fillings, and pickled, fermented or acidified plant foods (pH 4.2 or lower, or water activity below 0.88). Salsa with cut tomatoes is allowed if kept at or below 41 F. Juice sold direct to consumer.", "not_allowed": "Dried meats and seafood (beef jerky, dried fish), fruits from the melon family, vacuum packaging, and canning other than jams and jellies.", "sales_cap": "not stated on the official pages", "label": "Package as sold. Label: 'Made in a home kitchen not routinely inspected by the Department of Health', common name, ingredients in descending order if 2 or more, major allergens (milk, eggs, fish, shellfish, tree nuts, peanuts, wheat, soybeans, sesame), and operator name and contact information.", "permit": "No food establishment permit. Operator must complete food safety training from the Department of Health or an approved program (ANSI accredited courses count). Some events may require a Special Event permit.", "where": "Direct to consumers at fundraisers, craft fairs, farmers markets and similar events, and online. State law also allows wholesale to permitted food establishments (restaurants must disclose it is homemade). Mail or shipping rules not stated.", "source_url": "https://health.hawaii.gov/san/files/2019/09/hmf-foods-01.29.2026.pdf", "source_title": "Homemade Food Products, Hawaii Department of Health Food Safety Branch (dated 01.29.2026 in file name)", "second_url": "https://health.hawaii.gov/san/files/2024/11/Ch-50-revision-11.12.2024.pdf", "checked": true, "date_read": "2026-11-24", "notes": "Second page is a Department of Health proposed revision of Chapter 11-50 (dated 11.12.2024); its definition of homemade food products and the permit exemption match the program page. Neither page states a sales cap.", "status": "CHECKED"}, {"code": "ID", "state": "Idaho", "program": "Idaho Direct-to-Consumer Commerce Act (Idaho Code Title 37, Chapter 2; Senate Bill 1283, 2026)", "allowed": "Homemade shelf-stable and perishable food and nonalcoholic drinks sold to informed end consumers, made at a home kitchen, farm or other unlicensed facility. Includes foods needing temperature control. Some meat allowed (poultry up to 1,000 birds a year, rabbit, farm-raised fish, inspected beef, sheep, swine, goat).", "not_allowed": "Food prepared for immediate consumption (restaurant-style, mobile food units), uninspected meat other than listed exceptions, dairy unless dairy laws are met, resale or use as an ingredient in a licensed food establishment or school kitchen, and sales outside Idaho or to wholesale.", "sales_cap": "no cap stated in the act or on the Department of Health and Welfare page", "label": "Sign, label or card stating: 'This product is not subject to government food safety inspection or licensing requirements. It may contain allergens.' plus producer name and contact information, and an ingredient list if 2 or more ingredients. Perishable food needs handling instructions.", "permit": "none (exempt from licensing and inspection). Department provides educational material that producers must become familiar with.", "where": "Direct to the informed end consumer at farm stands, homes, through a named designated agent or consignment market; delivery allowed; must occur entirely within Idaho. Wholesale not exempted.", "source_url": "https://healthandwelfare.idaho.gov/health-wellness/food-safety", "source_title": "Food Safety, Idaho Department of Health and Welfare", "second_url": "https://legislature.idaho.gov/wp-content/uploads/sessioninfo/2026/legislation/S1283.pdf", "checked": true, "date_read": "2026-11-24", "notes": "Health and Welfare page says SB 1283 was signed, effective March 20, 2026, replacing the old cottage food rule IDAPA 16.02.19. Bill text read for allowed foods and label. House Bill 526 (TCS foods up to $5,000) passed the House but showed no final action on the legislature page. Local health district pages (for example Southwest District Health) were empty or outdated.", "status": "CHECKED"}, {"code": "IL", "state": "Illinois", "program": "Cottage Food Operation (410 ILCS 625/4, Illinois Department of Public Health)", "allowed": "Homemade food and drink made in the primary home kitchen (or a farm kitchen) that is not on the prohibited list; baked goods, candy, jams, fermented or acidified foods with a tested recipe or food safety plan, canned tomatoes with a tested recipe. Alcohol allowed only in extracts or baked goods.", "not_allowed": "Meat, poultry, fish, seafood, most dairy and eggs except as ingredients, cheesecake and custard/cream pies, garlic in oil (unless acidified), low-acid canned foods, sprouts, cut leafy greens (some exceptions), cut or pureed fresh tomato or melon, wild mushrooms, alcoholic beverages, kombucha.", "sales_cap": "not stated in the statute or the Department of Public Health page", "label": "Prepackaged with: operation name and local government, registration number, common name, ingredients, date processed, allergens, and 'This product was produced in a home kitchen not inspected by a health department that may also process common food allergens. If you have safety concerns, contact your local health department.' Same notice at point of sale (placard or online).", "permit": "Register annually with the local health department (fee up to $50). The person making or packaging the food must be a Department-approved certified food protection manager.", "where": "Direct to consumers for their own consumption, not for resale: farmers markets, fairs, festivals, online, home pickup, delivery, mobile farmers markets. Non-TCS foods may be shipped in-state in tamper-evident packaging; no shipping out of state.", "source_url": "https://ilga.gov/legislation/ilcs/documents/041006250K4.htm", "source_title": "410 ILCS 625/4, Illinois General Assembly (Food, Drug and Cosmetic Act, cottage food section)", "second_url": "https://dph.illinois.gov/topics-services/food-safety/cottage-food.html", "checked": true, "date_read": "2026-11-24", "notes": "IDPH page repeats registration with local health department, home kitchen, direct sales and no resale, but does not give the list of foods or label wording. Chicago has its own registration. Local rules may differ.", "status": "CHECKED"}, {"code": "IN", "state": "Indiana", "program": "Home Based Vendor (Indiana Code 16-42-5.3, Indiana Department of Health)", "allowed": "Food made, grown or raised at the producer's primary residence (or a structure on the same property) that is not a potentially hazardous food, prepared with sanitary procedures. Handbook has tested recipes; some limits on frostings, cut produce and cheese items.", "not_allowed": "Potentially hazardous (time/temperature control) foods, resale of the product, sale to warehouses, stores or wholesalers, and shipping or delivery to consumers outside Indiana.", "sales_cap": "no cap stated in the statute or handbook", "label": "Name and address of producer, common name, ingredients in descending order by weight, net weight or volume, date processed, and in at least 10 point type: 'This product is home produced and processed and the production area has not been inspected by the Indiana Department of Health. NOT FOR RESALE.' Label must also be posted on the vendor's website.", "permit": "No food establishment permit. Must hold a food handler certificate from an ANSI-accredited issuer and give a copy to the local health department. No routine inspections; sampling or inspection after a complaint or if product is misbranded or adulterated.", "where": "Direct to the end consumer in person, by telephone or on the internet; delivered in person, by mail or by a third-party carrier, in-state only in tamper-evident sealed packages with shipping records kept one year. Event organizers may restrict sales.", "source_url": "https://www.in.gov/localhealth/harrisoncounty/food-protection/files/IC-16-42-5dot3-re-2022-HBV-rule.pdf", "source_title": "IC 16-42-5.3 Home Based Food Products (copy of statute on in.gov)", "second_url": "https://secure.in.gov/health/food-protection/files/Indiana-Home-Based-Vendor-Handbook-2.pdf", "checked": true, "date_read": "2026-11-24", "notes": "Statute copy is on a county health department page on in.gov; handbook is from the state Department of Health (last updated summer 2025). A May 2026 Department of Health memo on 2026 Public Law 163 (farm and homestead food sales) appeared in search but was not read, so later changes are possible.", "status": "CHECKED"}, {"code": "IA", "state": "Iowa", "program": "Cottage Food exemption (Iowa Code 137F.20; Iowa Administrative Code 481-30.13); separate Home Food Processing Establishment license (chapter 481-34)", "allowed": "Food produced in a private residence that does not need time/temperature control for safety, plus home-canned pickles, vegetables or fruits with finished pH 4.6 or lower or water activity 0.85 or less (each batch measured).", "not_allowed": "Foods needing time/temperature control, milk and milk products, meat and poultry products, unpasteurized juice. Cottage food may not be offered in a food establishment except a temporary food establishment run by the producer.", "sales_cap": "no cap stated in the rule or the code section", "label": "Name and address, phone or email of the producer; common name; ingredients in descending order; 'This product was produced at a residential property that is exempt from state licensing and inspection.'; allergen statement; date canned for home-canned items.", "permit": "none for cottage food (exempt from licensing, permitting and inspection). A Home Food Processing Establishment license is a different, inspected option (needed for wholesale or resale).", "where": "Sold and delivered by the producer directly to the consumer: in person, remotely, by telephone, internet, mail, or an agent such as an employee. Not for resale.", "source_url": "https://www.legis.iowa.gov/docs/iac/chapter/10-15-2025.481.30.pdf", "source_title": "Iowa Administrative Code, Inspections and Appeals [481] Chapter 30 Food and Consumer Safety (rule 30.13)", "second_url": "https://www.legis.iowa.gov/docs/code/137F.20.pdf", "checked": true, "date_read": "2026-11-24", "notes": "Rule PDF is the Oct 15 2025 version; agency is now called the Department of Inspections, Appeals, and Licensing. Rule says the cottage food exemption does not represent compliance with federal law. Home Food Processing Establishment license rules (chapter 34) not read in detail.", "status": "CHECKED"}, {"code": "KS", "state": "Kansas", "program": "Direct-to-consumer exemption from food establishment license (K.S.A. 65-689(d)); Kansas Department of Agriculture guidance, no separate cottage food law", "allowed": "Producers may sell food directly to end consumers without a license if it needs no time/temperature control for safety or specialized processing, as the Secretary of Agriculture determines. K-State Extension guide lists baked goods, jams and jellies, candy, uncut produce, honey, dry mixes, and others, made in a regular home kitchen.", "not_allowed": "Foods needing time/temperature control or specialized processing (for example jerky, vacuum-packaged foods, pickling, fermenting, sprouting) need a license. Wholesale sales need a different license.", "sales_cap": "no cap stated in the statute or the guide read", "label": "Statute does not set label wording. The guide says uninspected products do not need to be labeled 'homemade'; foods must be labeled properly (baked goods follow the guide's labeling requirements) and sold in a sanitary manner.", "permit": "none for exempt foods; exempt sellers can still be inspected after a violation is reported.", "where": "Direct to consumers at farmers markets, festivals, craft shows and similar events; online and shipped or delivered by the producer to the home (guide says out-of-state sales must follow the receiving state's rules). Not wholesale.", "source_url": "https://www.ksrevisor.gov/statutes/chapters/ch65/065_006_0089.html", "source_title": "K.S.A. 65-689, Kansas Office of the Revisor of Statutes", "second_url": "https://www.ksre.k-state.edu/kvafl/doc/MF3138_rev_2024.pdf", "checked": false, "date_read": "2026-11-24", "notes": "Kansas Department of Agriculture pages returned access denied, so the agency's own page was not read. Second page is a K-State Research and Extension guide (state university, revised January 2024, written with the agency), not a department page, so checked is false. Some foods are exempt only if sold 6 or fewer days a year.", "status": "UNCHECKED"}, {"code": "KY", "state": "Kentucky", "program": "Home-Based Processor and Home-Based Microprocessor (902 KAR 45:090, Food Safety Branch)", "allowed": "Home-based processors: foods on the approved list in KRS 217.015, dried or freeze-dried whole fruits and vegetables, alcohol-free candy made without bare-hand contact, maple syrup, pecan pies, granola, trail mix, popcorn. Microprocessors (farmers who grow the main ingredient) may also make acid and acidified foods and some low-acid canned foods.", "not_allowed": "Cream-filled pies, custard and meringue pies, cheesecake, cream/custard/meringue pastries, raw seed sprouts, garlic-in-oil, pureed baby foods, vacuum packaging except mason-type jars. Microprocessors cannot sell to retail food establishments or across state lines.", "sales_cap": "no cap stated in the regulation", "label": "Common name; name and address of the home-based operation; ingredients in descending order; net weight or volume; 'This product is home-produced and processed.' in 10-point type; date processed; major allergens identified.", "permit": "Processors register with the Food Safety Branch (form DFS-250), $50 per year, expires March 31; no training required. Microprocessors apply on DFS-251, $50 per year, must complete a Food Processing School every three years, and get label and process approval; inspected at least once every four years.", "where": "Processors: direct to consumers in Kentucky by pick-up or delivery, farmers markets, flea markets, festivals, fairs, charity events, roadside stands, and orders taken in person, online or by phone. Microprocessors: only at farmers markets, certified roadside stands or the farm.", "source_url": "https://apps.legislature.ky.gov/law/kar/titles/902/045/090", "source_title": "902 KAR 45:090 Home-based processors and microprocessors, Kentucky Legislative Research Commission", "second_url": "https://www.chfs.ky.gov/agencies/dph/dphps/fsb/Pages/default.aspx", "checked": true, "date_read": "2026-11-24", "notes": "The Food Safety Branch page confirms the home-based processing program (residents, home kitchen, approved locations, direct to consumer) but does not list foods or fees; those came from the regulation text. Label wording quoted from the regulation summary and the Food Safety Branch label guide: 'This product is home-produced and processed.'", "status": "CHECKED"}, {"code": "LA", "state": "Louisiana", "program": "Low-risk foods prepared in the home (Louisiana Revised Statutes 40:4.9)", "allowed": "Low-risk foods made in the home: baked goods (breads, cakes, cookies, pies), candies, cane syrup, dried mixes, honey and honeycomb products, jams, jellies and preserves, pickles and acidified foods, sauces and syrups, spices.", "not_allowed": "Any food containing animal muscle protein or fish protein; foods with cannabidiol; any unwholesome food. Breads, cakes, cookies and pies are not covered if the preparer hires someone to help make them. Baked goods may not be sold to retailers or for resale.", "sales_cap": "Exemption does not apply to a home preparer whose gross annual sales equal $30,000 or more", "label": "Each food must carry a label clearly stating it was not produced in a licensed or regulated facility. Raw unfiltered honey is exempt from this label.", "permit": "No health permit. Seller must be registered to collect local sales and use taxes, shown by a current sales tax certificate from the parish sales tax collector. Baked goods must meet listed sanitation rules (pest-proofing, pasteurized milk in fillings, cooling to 45 F).", "where": "The statute says sales are from the home to the public; locations not specified. Baked goods cannot be resold by retailers.", "source_url": "https://legis.la.gov/legis/Law.aspx?d=98431", "source_title": "RS 40:4.9 Low-risk foods; preparation in home for public consumption, Louisiana State Legislature", "second_url": "", "checked": false, "date_read": "2026-11-24", "notes": "Only the statute was read; no Louisiana Department of Health or Agriculture guidance page was found. The page lists amendments through Acts 2022 No. 357. A 2025 bill (HB 150) adding penalties was seen in search but its outcome was not confirmed.", "status": "UNCHECKED"}, {"code": "ME", "state": "Maine", "program": "Home Food License (Maine Department of Agriculture, Conservation and Forestry, Quality Assurance and Regulations)", "allowed": "Shelf-stable (non-potentially hazardous) foods made in a home kitchen, sold from home and at retail stores and wholesale. Canned or acidified products such as pickles, relishes and barbecue sauce need a process review (University of Maine Food Testing Services or another process authority) before licensing.", "not_allowed": "Foods that must be refrigerated or frozen (a commercial license is required instead). Home license not needed for only fresh produce, eggs from farms under 3,000 birds, or poultry under the fewer-than-1,000-bird exemption.", "sales_cap": "not stated on the official page", "label": "Foods sold outside the home need: common name, ingredients in order of predominance, net weight or volume or count, and name and address with zip code of the producer. No label required if sold directly to the consumer from the home.", "permit": "Home Food License, $20 per year; initial inspection required, annual inspections not required. Kitchen needs a two-bay sink (or one bay plus dishwasher) and a refrigerator thermometer; private wells need an annual water test.", "where": "From home, at retail stores, and wholesale throughout Maine and the United States (per the department's description of the license).", "source_url": "https://www.maine.gov/DACF/qar/permits_and_licenses/documents/home-license-101.pdf", "source_title": "Home Food License 101, Maine DACF Quality Assurance and Regulations", "second_url": "https://www.maine.gov/dacf/qar/permits_and_licenses/index.shtml", "checked": true, "date_read": "2026-11-24", "notes": "Maine is a license state rather than a pure exemption state. The department page confirms the license for shelf-stable foods sold from the home and at wholesale. Maine's Food Sovereignty law and local town ordinances were not researched and may allow some license-free direct sales. Cap not stated on either page.", "status": "CHECKED"}, {"code": "MD", "state": "Maryland", "program": "Cottage Food Business (COMAR 10.15.03; Maryland Department of Health Office of Food Protection)", "allowed": "Non-potentially hazardous foods made in a residential kitchen: breads, cookies, pastries, cakes and cupcakes, pies and tarts from fruit with natural pH 4.6 or less, hot-filled jams, jellies, preserves and fruit butters, non-hazardous candy. Some items (icings, moist quick breads) allowed only with lab testing.", "not_allowed": "Baked goods needing refrigeration (meringue, pumpkin, cheesecake, cream pies), low-acid canned foods, acidified or pickled products (pickles, salsa, relish, mustard, sauces), garlic or vegetables in oil, sprouts, fish, meat, poultry, dairy, beverages. Interstate sales prohibited.", "sales_cap": "annual revenue not exceeding $50,000", "label": "Prepackaged with: business name and address (or Department-issued ID number plus phone), product name, ingredients, net weight or count, allergens, and in 10-point or larger type: 'Made by a cottage food business that is not subject to Maryland's food safety regulations'. Retail store sales also need phone, email and date made.", "permit": "No license. Optional request to the Department for a unique ID number (form) to use instead of a home address; the same form is needed to sell to a retail food store. Home kitchen may be inspected by the local health department; local rules may be stricter.", "where": "In Maryland only: from the residence, farmers markets, public events, personal delivery, mail within the state, and directly to retail food stores. No sales outside Maryland.", "source_url": "https://health.maryland.gov/phpa/OEHFP/OFPCHS/Documents/Updated_CF_Guidelines_2025.pdf", "source_title": "Guidelines for Cottage Food Businesses (last updated 11/2025), Maryland Department of Health Office of Food Protection", "second_url": "https://health.maryland.gov/phpa/OEHFP/OFPCHS/Documents/Copy%20of%20CF%20FAQs%20Updated%20Revised_September_2025_FINAL_SBed09242025.docx%20(1).pdf", "checked": false, "date_read": "2026-11-24", "notes": "The Department FAQ (September 2025) confirms no license, in-state mail only and local rules, but the $50,000 figure was only found in the guidelines (quoting COMAR), so checked is false. The Department cottage foods landing page loaded with no body text.", "status": "UNCHECKED"}, {"code": "MA", "state": "Massachusetts", "program": "Residential kitchen permit (called Cottage Food Operation) under 105 CMR 590.009, Retail Food Code standards for permitted residential kitchens", "allowed": "Only foods that are safe at room temperature (non-TCS), such as baked goods, jams and jellies, made in a permitted home kitchen and sold directly to consumers.", "not_allowed": "Foods needing temperature control; selling to stores or restaurants (that needs a separate state Department of Public Health wholesale license). No permit needed for whole fresh produce, unprocessed honey, pure maple, or food made for qualifying charities.", "sales_cap": "not found on an official page", "label": "Operation name and address, product name, ingredients in descending order by weight, net weight or volume, allergen information; nutrition labeling only if a nutrition or health claim is made.", "permit": "Permit and inspection by the local board of health in the city or town; fee and training not found on an official page (Boston also requires a food allergen awareness certificate).", "where": "Direct to consumer, including farmers markets, craft fairs, and internet or mail sales, all under the local permit. Wholesale, retail stores and restaurants: no (separate state license).", "source_url": "https://www.mass.gov/guidance/retail-food-code-standards-for-permitted-residential-kitchens", "source_title": "Retail Food Code Standards for Permitted Residential Kitchens - Massachusetts Department of Public Health (mass.gov)", "second_url": "", "checked": false, "date_read": "2026-11-24", "notes": "mass.gov returned HTTP 403 to every automated fetch (page, Q&A and 105 CMR 590 PDFs), so these fields come from search-result excerpts of the official mass.gov pages, not a full page read. Material is dated 2018-2019; local boards of health may add rules. Confirm sales cap, fees and exact label wording on the page.", "status": "UNCHECKED"}, {"code": "MI", "state": "Michigan", "program": "Michigan Cottage Food exemption under the Michigan Food Law (MDARD Cottage Food program), 2026 update", "allowed": "Non-potentially hazardous foods made in the home kitchen of your primary residence: breads, cookies, cakes, shelf-stable pies, jams and jellies (21 CFR 150) in glass jars, vinegars, extracts, dry mixes, granola, popcorn, nuts, dried pasta, roasted coffee beans, dehydrated fruit and vegetables.", "not_allowed": "Meat, fish, dairy, beverages, canned or pickled foods, cream or custard pies, refrigerated cakes and frostings, sauces and dressings, fresh pasta, pet food, CBD or cannabis, dietary supplements, tinctures, ice.", "sales_cap": "Up to $50,000 per year in gross sales; $75,000 if products sell for $250 or more per unit.", "label": "Must include 'Made in a home kitchen not inspected by the Michigan Department of Agriculture and Rural Development.' plus operation name and home address (a voluntary MSU Product Center registration number and phone may replace the address), ingredients in descending order, federal allergen labeling.", "permit": "None: no license, registration or routine inspection. Keep sales records for MDARD on request. Local zoning rules still apply.", "where": "Direct to consumer in Michigan: farmers markets, farm stands, home. Internet, mail order and third-party delivery allowed only in Michigan and only if the consumer can interact with the operator before the sale. Wholesale, restaurants, grocery stores and consignment: no.", "source_url": "https://www.michigan.gov/mdard/food-dairy/cottage-food/selling-and-samples", "source_title": "Selling and Samples (Cottage Food) - Michigan Department of Agriculture and Rural Development", "second_url": "https://www.michigan.gov/mdard/-/media/Project/Websites/mdard/documents/food-dairy/cottage/Cottage-Food-One-Pager.pdf", "checked": true, "date_read": "2026-11-24", "notes": "One-pager is dated 03/2026. Getting Started and FAQ page also confirms the same cap. Older pages and secondary sites may still show a $25,000 cap.", "status": "CHECKED"}, {"code": "MN", "state": "Minnesota", "program": "Cottage Foods Exemption, Minnesota Statutes 28A.152, with Minnesota Department of Agriculture Cottage Food Producer Registration", "allowed": "Non-potentially hazardous prepared foods, plus home-canned pickles, vegetables or fruits with pH 4.6 or lower or water activity 0.85 or less, processed in Minnesota.", "not_allowed": "Potentially hazardous foods; anyone holding a food handler license under 28A.04; businesses other than an individual, sole proprietor, or small single-residence LLC. Home-canned goods cannot be sold outside Minnesota.", "sales_cap": "$78,000 gross receipts per calendar year (to be adjusted for inflation every two years from August 1, 2027).", "label": "Name and registration number or address, preparation date, ingredients, allergens, and 'These products are homemade and not subject to state inspection.' Statement also on a sign at point of sale and on the website for online sales.", "permit": "Register with the Minnesota Department of Agriculture each year before selling. Current fee: $0 for sales up to $5,000, $50 above that. Training: Tier 1 (up to $7,665) yearly online course and exam; Tier 2 ($7,666-$78,000) approved food safety course every three years.", "where": "Direct to consumers at farmers markets, community events and from home (if local rules allow); online and delivery by mail or commercial carrier appear in the statute. Wholesale not addressed.", "source_url": "https://www.revisor.mn.gov/statutes/cite/28A.152", "source_title": "Minnesota Statutes 28A.152 Cottage Foods Exemption - Office of the Revisor of Statutes", "second_url": "https://mn.gov/elicense/a-z/?id=1083-231647", "checked": true, "date_read": "2026-11-24", "notes": "Changes in Laws 2025 ch. 34 (House File 2446) take effect August 1, 2027: one registration tier, $30 yearly fee, advanced training, shipping. The statute page shows a $30 fee and mail delivery, while the state registration page shows the current $50 tier fee and says shipping is coming, so the two pages differ on current detail. Check with the department before registering.", "status": "CHECKED"}, {"code": "MS", "state": "Mississippi", "program": "Mississippi Cottage Food Operations law, Miss. Code 75-29-951", "allowed": "Non-potentially hazardous foods that do not need refrigeration, such as baked goods, jams, jellies and acidified foods; some products judged case by case.", "not_allowed": "Potentially hazardous foods; meats; pork skins; internet, mail order, wholesale and retail-establishment sales.", "sales_cap": "$35,000 annual gross sales from all cottage food sales at any location.", "label": "Operation name and address, product name, ingredients in descending order by weight, net weight or volume, allergens; and in at least 10-point contrasting type: 'Made in a cottage food operation that is not subject to Mississippi's food safety regulations.'", "permit": "Exempt from the Department of Health food permit if under the cap and compliant. No registration or training requirement stated in the current law (2025-2026 bills proposing training were introduced).", "where": "Direct to consumers. Internet, mail order, wholesale and sales to retail establishments: no (advertising online is allowed). Farmers market sales are covered by the cottage food exemption.", "source_url": "https://agnet.mdac.ms.gov/agManage/uploads/1796.pdf", "source_title": "July 2025 Permit Requirements for Farmers Market Vendors - Mississippi Department of Agriculture and Commerce", "second_url": "https://billstatus.ls.state.ms.us/documents/2025/html/SB/2200-2299/SB2265IN.htm", "checked": true, "date_read": "2026-11-24", "notes": "Second page is Mississippi Legislature bill text (SB 2265, 2025) that quotes existing 75-29-951 (cap $35,000, label, online ban) with the bill's changes marked; the bill proposed $59,000 and food handler training. A 2026 search result said HB 1108 ($200,000 cap) died in committee; other 2026 bills (SB 2394, SB 2398) were not verified. Official Department of Health cottage food PDFs returned 404.", "status": "CHECKED"}, {"code": "MO", "state": "Missouri", "program": "Missouri Cottage Law, RSMo 196.298 (Department of Health and Senior Services guidance)", "allowed": "Baked goods (cookies, cakes, breads, pastries, pies, donuts), canned jam or jelly, and dried herbs or herb mixes, made in the home kitchen.", "not_allowed": "Potentially hazardous foods; salsa, pickles, sauces, cut produce, freeze-dried foods, sprouts, meats, dairy, eggs, pet food; sugar-free and hot pepper jams. Sales across state lines.", "sales_cap": "no cap (the old $50,000 limit was removed in the August 28, 2022 law change)", "label": "Full name and address of the operation, common name of the food, ingredients in descending order by weight, net weight, allergens, and a statement that the food is prepared in a kitchen not subject to inspection by the Missouri Department of Health and Senior Services.", "permit": "none; not subject to state or local food code. Local health departments cannot regulate production but may investigate outbreaks.", "where": "Direct to consumers, from the home; internet sales only if both seller and buyer are in Missouri. Wholesale: no. Seller must be the maker or a knowledgeable household member.", "source_url": "https://revisor.mo.gov/main/OneSection.aspx?section=196.298", "source_title": "RSMo Section 196.298 - Missouri Revisor of Statutes", "second_url": "https://health.mo.gov/sites/health/files/media/pdf/2026/03/home-based-kitchen-food-prod-guidance.pdf", "checked": true, "date_read": "2026-11-24", "notes": "Guidance PDF is dated August 2023 (posted 2026/03 folder). The statute says the label statement is set by department rule; exact wording is not given in either page. Other non-hazardous foods may be sold from a stand under a separate Food Code exemption where the local health agency allows it.", "status": "CHECKED"}, {"code": "MT", "state": "Montana", "program": "Montana Cottage Food Operation registration (DPHHS Food and Consumer Safety), ARM 37.110.504", "allowed": "Approved non-hazardous foods: breads, rolls, muffins, cakes, cookies, crackers, granola, nuts, snack mixes, non-custard baked pies, dried fruit, standardized jams, jellies and fruit butters, dry herb and spice mixes, popcorn, cotton candy, fudge and cooked candies, molded chocolate, honey.", "not_allowed": "Dairy, eggs, meat, cheese, custard or cream pies, cheesecake, freezer jams, fermented foods, canned fruit, pet treats, some frostings; sales to restaurants, stores, wholesale, mail order, other states.", "sales_cap": "not stated on the official pages read", "label": "Business name and address, product name, ingredients and sub-ingredients by weight, net quantity, allergens, and in 11-point or larger type: 'Made in a home kitchen that is not subject to retail food establishment regulations or inspections.'", "permit": "Register with the local county or tribal environmental health office: one-time $40 fee; re-register if you move or add recipes. Not required if selling only approved items at farmers markets. No training requirement stated.", "where": "Face-to-face sales to consumers in Montana: from home, farmers markets, craft fairs, delivery by the operator. Online orders only for face-to-face pickup; mail, couriers, Amazon or eBay not allowed. Wholesale: no.", "source_url": "https://dphhs.mt.gov/assets/publichealth/FCS/CottageFood/cottagefoodregistrationfillable2020Dec.pdf", "source_title": "Cottage Food Operation Guidance and Registration (March 2020) - Montana DPHHS Food and Consumer Safety Section", "second_url": "https://dphhs.mt.gov/assets/publichealth/FCS/CottageFood/cottagefoodfrequentlyaskedquestions2024.pdf", "checked": true, "date_read": "2026-11-24", "notes": "Source pages are dated 2020 and 2018 (FAQ file name says 2024); neither states a sales cap, so checked covers foods, fee and sales rules only. Montana also has a separate Local Food Choice Act pathway (DPHHS guidance) that was not read.", "status": "CHECKED"}, {"code": "NE", "state": "Nebraska", "program": "Nebraska cottage food exemption, Neb. Rev. Stat. 81-2,280 (Department of Agriculture Cottage Food Registration)", "allowed": "Home-produced foods, including some time/temperature controlled foods such as cheesecake and ice cream made from approved-source ingredients, cakes, jams, chocolate covered strawberries; all must be made in a private home.", "not_allowed": "Meat or animal parts, fluid milk products, raw eggs, unpasteurized juice, infused oils or honey, sprouts, low-acid canned and acidified canned foods, tofu and tempeh, kimchi, kombucha and similar fermented foods.", "sales_cap": "not stated on the official pages (no dollar cap)", "label": "Producer name and address on the package; time/temperature controlled foods also list ingredients. A clearly visible notice that the food was made in a kitchen not subject to regulation or inspection and may contain allergens, at the sale location, home, website and ads.", "permit": "Register with the Department of Agriculture before any sales (no fee listed) and complete an approved food safety course first (not needed for non-TCS food sold directly at a farmers market). Well water test proof required if using a private well.", "where": "Direct to consumer at farmers markets, fairs, events, and by pickup or delivery from the home. Non-TCS food may be mailed or shipped; TCS food must be delivered in person within two hours. Wholesale and resale: no.", "source_url": "https://nda.nebraska.gov/fscp/foods/cottagefood", "source_title": "Nebraska Cottage Food Registration - Nebraska Department of Agriculture", "second_url": "https://nebraskalegislature.gov/laws/statutes.php?statute=81-2%2C280", "checked": true, "date_read": "2026-11-24", "notes": "Statute was amended by LB 262 (2024). Neither page states a registration fee or sales cap. Local rules are preempted by the statute.", "status": "CHECKED"}, {"code": "NV", "state": "Nevada", "program": "Cottage food operation, NRS 580.600 (effective through June 30, 2027; moves to the Department of Agriculture under NRS 585.700-585.770 on July 1, 2027)", "allowed": "Nuts and nut mixes, candies (no cream-based truffles), jams, jellies and preserves, vinegar and flavored vinegar, dry herbs and seasoning mixes, dried fruits, cereals, trail mixes and granola, popcorn, and baked goods without cream, uncooked egg, custard, meringue or cream cheese frosting.", "not_allowed": "Anything not on that list; baked goods needing time or temperature control; fruit butter, sugar-free jams; sales to restaurants or stores, wholesale, consignment; sale by phone or internet with shipping or third-party delivery.", "sales_cap": "$100,000 gross sales per calendar year (adjusted yearly for inflation starting fiscal 2026-2027).", "label": "Federal food labeling requirements plus 'MADE IN A COTTAGE FOOD OPERATION THAT IS NOT SUBJECT TO GOVERNMENT FOOD SAFETY INSPECTION' printed prominently; food prepackaged at home.", "permit": "Register before selling with the local food safety authority; no health permit. Southern Nevada Health District fee is $220, and its registrations end June 30, 2027. Only a single natural person may operate; training not stated.", "where": "In-person sales from home, farmers markets, flea markets, swap meets, church bazaars, garage sales or craft fairs, directly to a person for their own use. Internet or phone orders allowed only for in-person pickup by the operator. Wholesale, restaurants: no.", "source_url": "https://www.leg.state.nv.us/nrs/nrs-580.html", "source_title": "Nevada Revised Statutes Chapter 580, section 580.600 - Nevada Legislature", "second_url": "https://www.southernnevadahealthdistrict.org/permits-and-regulations/cottage-food-operations/cottage-food-faq/", "checked": false, "date_read": "2026-11-24", "notes": "Second page is the Southern Nevada Health District (Clark County) FAQ, which agrees on the $100,000 cap and foods. Outside Clark County, registration goes through the local health authority; the Nevada Department of Agriculture becomes the statewide registering authority July 1, 2027, with rules still to be written.", "status": "UNCHECKED"}, {"code": "NH", "state": "New Hampshire", "program": "Homestead Food Operations, RSA 143-A:12 and rules He-P 2310 (exempt) and He-P 2311 (licensed Class H)", "allowed": "Non-hazardous foods: baked items (breads, rolls, muffins, cookies, brownies, cakes), double-crusted fruit pies, candy and fudge, packaged dry products including spices and herbs, acid foods like vinegars, jams and jellies, acidified foods.", "not_allowed": "Potentially hazardous foods, anything needing refrigeration, low-acid canned foods. Exempt operations cannot sell to restaurants, online, by mail order or to wholesalers (those need a license). Freeze-dried foods need a license.", "sales_cap": "not stated in the statute or rules read", "label": "Name, address (physical or email) and phone of the operation, product name, ingredients by weight (or QR code), major allergens, product code or date; statement 'This product is exempt from New Hampshire licensing and inspection' in at least 10-point type.", "permit": "Exempt (no license) if selling from the home, own farm stand, farmers markets or retail food stores. A Class H license (fee $150 per He-P 2300) is needed to sell to restaurants, online, by mail order or wholesale.", "where": "Exempt: home, own farm stand, farmers markets, retail food stores. Online, mail order, restaurants, wholesalers: only with a Class H license. Some towns have their own inspection rules.", "source_url": "https://gc.nh.gov/rsa/html/x/143-A/143-A-12.htm", "source_title": "RSA 143-A:12 Homestead Food License Required - New Hampshire General Court", "second_url": "https://gc.nh.gov/Rules/state_agencies/he-p2300.html", "checked": true, "date_read": "2026-11-24", "notes": "The Department of Health and Human Services program page returned HTTP 403, so the statute and the He-P 2300 rule (new version effective 8-25-26) were used. Statute amended several times through November 2025. Search results mentioned an older $20,000 threshold on a 2019 form; the current statute and rule set no dollar cap.", "status": "CHECKED"}, {"code": "NJ", "state": "New Jersey", "program": "Cottage Food Operator Permit, N.J.A.C. 8:24-11 (New Jersey Department of Health)", "allowed": "Non-TCS foods made in the home kitchen: baked goods, candy, fudge, jams, preserves, dried fruit, nuts and nut butters, granola, popcorn, roasted coffee, dried tea, vinegar, mustard, dried pasta, dry baking mixes; fruit pies, empanadas and tamales except pumpkin.", "not_allowed": "TCS (refrigerated) foods, pet food and treats, sales to retail stores, wholesalers or restaurants, mail or carrier shipping, sales outside New Jersey, classes at the home. Raw unprocessed honey needs no permit.", "sales_cap": "$50,000 gross annual sales", "label": "Common name, ingredients by weight, 'Contains' allergen line, operator's full name and permit number, town and NJ, and 'This food is prepared pursuant to N.J.A.C. 8:24-11 in a home kitchen that has not been inspected by the Department of Health.'", "permit": "Permit required: $100 application fee, valid 2 years, $100 renewal. Needs a Food Protection Manager certificate (a food handler card does not qualify) and proof of water potability; only New Jersey residents may apply.", "where": "Direct to consumer in New Jersey: home, consumer's home, New Jersey farmers markets and farm stands, temporary retail events (extra permit). Online orders and payments allowed, but pickup must be in person; no mail or carriers. Wholesale and retail stores: no.", "source_url": "https://www.nj.gov/health/cottagefood/rules-resources/faq/", "source_title": "Cottage Food Operator Frequently Asked Questions - New Jersey Department of Health", "second_url": "https://www.nj.gov/health/cottagefood/rules-resources/rules/", "checked": true, "date_read": "2026-11-24", "notes": "The rules page (N.J.A.C. 8:24-11) confirms the $50,000 cap, $100 fee, 2-year term, label wording and delivery limits.", "status": "CHECKED"}, {"code": "NM", "state": "New Mexico", "program": "Homemade Food Act (2021, House Bill 177)", "allowed": "Non-time/temperature-controlled foods made at a private farm, ranch or residence: cakes, cookies, yeast breads, pies, pastries without refrigeration, candy, popcorn, dehydrated fruit, granola/dry mixes, roasted coffee, whole fruits and vegetables, high-sugar fruit jams.", "not_allowed": "Foods needing refrigeration (meat, jerky, salsa, fish, dairy, cut produce, cream pies, cheesecake, acidified or canned foods, pickles, juices, kombucha), alcohol-containing foods, foods with CBD or hemp.", "sales_cap": "not stated on the official page", "label": "Name, home address, phone and email of the maker; common name; ingredients with sub-ingredients; and this statement: \"This product is home produced and is exempt from state licensing and inspection. This product may contain allergens.\" May be on label, bulk container label, place card, or the sales webpage.", "permit": "No state permit or inspection; maker must hold a food handler card from an approved program before production.", "where": "Direct to consumers inside New Mexico: farmers markets, festivals, internet, roadside stands, home pickup or delivery, mail delivery. Not to restaurants, wholesalers, distributors, grocery resale, or outside New Mexico.", "source_url": "https://www.env.nm.gov/foodprogram/wp-content/uploads/sites/8/2025/06/Homemade-Food-Act-FAQ.pdf", "source_title": "Homemade Food Act FAQ, New Mexico Environment Department Food Program (updated August 16, 2021)", "second_url": "https://www.nmlegis.gov/sessions/21%20Regular/final/HB0177.PDF", "checked": true, "date_read": "2026-11-24", "notes": "Enacted bill text (nmlegis.gov) is the second official page; I only skimmed it for sales limits (none found) and its food handler certification and home-produced statement, so food lists rest on the department FAQ. Neither page shows a sales cap.", "status": "CHECKED"}, {"code": "NY", "state": "New York", "program": "Home Processor exemption (1 CRR-NY 276.4), Department of Agriculture and Markets", "allowed": "Non-potentially hazardous foods: breads, rolls, muffins, cookies, brownies, cakes without perishable frosting, double-crust high-acid fruit pies, jams and jellies, pastries, dry mixes, spices, fudge, popcorn, granola, hard candy, caramels, crackers.", "not_allowed": "Anything refrigerated; cream or dairy or egg frostings; cheesecake; cream pies; pickles, sauces, salsas; canned goods; syrups; nut butters; tempered chocolate coating; cheese, dairy, meat, fish, beverages, coffee roasting; alcohol or raw nuts.", "sales_cap": "not stated on the official page (no cap listed)", "label": "Common name, ingredients by weight, net quantity, processor name and full address, allergens identified, and a phrase such as \"Made in a Home Kitchen\" in type at least 1/16 inch.", "permit": "Registration required (Home Processor Registration Request); no fee currently; approved food handler course and Basic Sanitation Practices training; private well water test; registration tied to the location; reviews can take up to 16 weeks.", "where": "Within New York only: farms, farm stands, farmers markets, craft fairs, wholesale to local restaurants, cafes and grocery stores, home delivery and internet sales. No out-of-state shipping or interstate sales.", "source_url": "https://agriculture.ny.gov/food-safety/home-processing", "source_title": "Home Processing, New York State Department of Agriculture and Markets", "second_url": "https://agriculture.ny.gov/system/files/documents/2019/03/smallfoodprocessors.pdf", "checked": true, "date_read": "2026-11-24", "notes": "Second page is a 2019 department training slide deck that lists the same exempt foods (cakes, cookies, brownies, double-crust pies, jams, breads) and wholesale at agricultural venues; it is older and less detailed. Neither page states a sales cap. Local zoning is separate.", "status": "CHECKED"}, {"code": "NC", "state": "North Carolina", "program": "Home Processor program (NCDA&CS Food and Drug Protection Division); no separate cottage food law found", "allowed": "Low-risk shelf-stable foods: baked goods not needing refrigeration, jams and jellies, candies, dry mixes and spices, some liquids such as tea, coffee and lemonade, some sauces after review, acid or acidified foods after contacting the office, freeze-dried candy.", "not_allowed": "Refrigerated or frozen foods, low-acid canned foods, dairy, seafood, bottled water or juice, cream or cream-cheese fillings, cheesecake. Kitchens in a garage, basement or separate building do not qualify. Homes with indoor pets not allowed.", "sales_cap": "not stated on the official page", "label": "Required if packaged for self-service, sold wholesale, or shipped: product name, maker name and address, net weight in ounces/pounds and grams, ingredients by predominance, allergens. Exempt when sold on demand directly to the consumer (ingredients on request).", "permit": "Application plus inspection of the home kitchen before selling (no permit issued; inspection report and Notice of Inspection). Well water test for coliform and E. coli. Local zoning and HOA approval required. Fee not stated on the page.", "where": "Direct from home, farmers markets, delivery to consumers and events, and to retail stores, restaurants and wholesale (labels required for those).", "source_url": "https://www.ncagr.gov/divisions/food-drug-protection/food-program/fdpd-food-program-home-processer", "source_title": "Food Program - Home Processor, North Carolina Department of Agriculture and Consumer Services", "second_url": "", "checked": false, "date_read": "2026-11-24", "notes": "Only one official page read; a second NCDA&CS page returned a connection error. A 2026 rulemaking petition about pets in the home was seen in search results only, not read. NC treats the home as a food manufacturer under federal good manufacturing practices rather than offering a cottage food exemption.", "status": "UNCHECKED"}, {"code": "ND", "state": "North Dakota", "program": "Cottage Food Act, North Dakota Century Code chapter 23-09.5", "allowed": "Cottage food products: baked goods, jams, jellies, and other food and drink products made in a home kitchen by the operator (statute does not list specific foods).", "not_allowed": "Uninspected meat; poultry only under narrow limits and never in interstate commerce. Food may not be sold or used in food establishments, processing plants or food stores, except whole unprocessed fruits and vegetables.", "sales_cap": "no cap stated in the statute", "label": "Sign at point of sale or label stating: \"This product is made in a home kitchen that is not inspected by the state or local health department.\" Items needing refrigeration need safe-handling instructions.", "permit": "none; the state or local government may not require licensure, permitting, certification, inspection, packaging or labeling for these sales", "where": "Directly from operator to informed end consumer for home consumption: farm, ranch, farmers market, farm stand, home kitchen, or delivery. Not to stores, restaurants or food establishments.", "source_url": "https://ndlegis.gov/cencode/t23c09-5.pdf", "source_title": "Chapter 23-09.5 Cottage Food Production and Sales, North Dakota Century Code", "second_url": "https://www.hhs.nd.gov/health/food-and-lodging/cottage-food", "checked": true, "date_read": "2026-11-24", "notes": "Department page confirms the law, the August 1, 2017 start, and the home-kitchen disclosure; it gives no food list or cap. Search results mentioned 2020 department rules (NDAC 33-33-10) and a 2025 bill SB 2386; I did not read either, so current status is unconfirmed.", "status": "CHECKED"}, {"code": "OH", "state": "Ohio", "program": "Cottage food production operation (Ohio Revised Code 3715.01 and 3715.023; Ohio Administrative Code chapter 901:3-20)", "allowed": "Non-potentially hazardous items: baked goods, jams, jellies, candy, fruit butters and chutneys, certain granola and popcorn, unfilled baked donuts, waffle cones, pizzelles, dry nut and cereal mixes, roasted coffee, dry baking, soup, seasoning and tea mixes, flavored honey and maple sugar from exempt producers.", "not_allowed": "Potentially hazardous foods, reduced-oxygen packaging, acidified or low-acid canned foods, items not on the approved list, selling outside Ohio.", "sales_cap": "not stated in the rules or statute read", "label": "Business name and address, product name, ingredients by weight, net weight and volume, and the statement \"This product is home produced.\" in ten-point type (Ohio Revised Code 3715.023).", "permit": "No license or inspection stated in the rules read; sampling by the department for labeling compliance applies.", "where": "Sales outside Ohio are prohibited. Labeled products may be sold by, or used at, licensed retail food establishments and food service operations.", "source_url": "https://codes.ohio.gov/ohio-administrative-code/chapter-901:3-20", "source_title": "Ohio Administrative Code chapter 901:3-20, Cottage Food (Ohio Department of Agriculture rules)", "second_url": "https://codes.ohio.gov/ohio-revised-code/section-3715.023", "checked": true, "date_read": "2026-11-24", "notes": "Ohio Department of Agriculture web pages for cottage food and home bakery returned page-not-found, so license/fee/training and the separate home bakery license (reported in search results as $10 a year) are not confirmed on an official page I could read. Search results mention a late-2025 bill for a microenterprise home kitchen registration; status unknown.", "status": "CHECKED"}, {"code": "OK", "state": "Oklahoma", "program": "Homemade Food Freedom Act (2 O.S. section 5-4.3, as amended by House Bill 2975, effective November 1, 2024)", "allowed": "Homemade food products, including non-time/temperature-controlled foods; time/temperature-controlled foods are also allowed if the producer passes approved food safety training.", "not_allowed": "Seafood, meat and meat products, poultry and poultry products.", "sales_cap": "not stated in the statute text read", "label": "Producer name and phone, physical address where made, description, ingredients in descending order, allergens (milk, eggs, peanuts, tree nuts, soy, wheat), and \"This product was produced in a private residence that is exempt from government licensing and inspection.\" in at least 10-point type. Third-party sellers post a placard.", "permit": "Exempt from state licensing; optional registration number for $15 a year to put on labels instead of name and address; food safety training required only for time/temperature-controlled foods.", "where": "Non-time/temperature-controlled foods: direct to consumer in person, internet or phone, through agents or third-party vendors (stores, farm stands, farmers markets, craft fairs), and by parcel carrier. Time/temperature-controlled foods: producer directly to consumer only.", "source_url": "https://www.oklegislature.gov/cf_pdf/2023-24%20ENR/hB/HB2975%20ENR.PDF", "source_title": "Enrolled House Bill 2975 (2024), Oklahoma Legislature", "second_url": "", "checked": false, "date_read": "2026-11-24", "notes": "Only the enrolled bill read; an unofficial summary in search results claimed a $75,000 cap, which the bill text does not contain. Later amendments after 2024 not checked.", "status": "UNCHECKED"}, {"code": "OR", "state": "Oregon", "program": "Cottage Food Exemption (Senate Bill 643, 2023; Oregon Administrative Rules 603-025-0320 to 0335)", "allowed": "Baked goods, confectionery including freeze-dried, coffee beans, dried tea/spice blends, jams and jellies from fruit under pH 4.6, honey products, syrups, fruit butters under pH 4.6, nut mixes, repackaged dried or freeze-dried commercial foods, powdered drink mixes, popcorn.", "not_allowed": "Time/temperature-controlled foods and anything containing marijuana. Cannot be sold to institutions such as restaurants, caterers, schools, day cares, hospitals, nursing homes, prisons.", "sales_cap": "$52,700 per year in gross sales (2026 figure)", "label": "\"This product is homemade, is not prepared in an inspected food establishment, and must be stored and displayed separately if merchandised by a retailer.\" Plus food name, ingredients, business name, phone, address or state ID number, net weight in US and metric, allergens, and species of any household pets.", "permit": "No license or inspection; food handler training program; sales records kept 3 years; optional unique ID number for $25 a year to use instead of the address on labels.", "where": "Direct to consumers in any manner, including home, online, by mail, and at events; to retail stores if packaged, labeled and displayed separately with signage. Not to restaurants or other institutions.", "source_url": "https://www.oregon.gov/oda/Documents/Publications/FoodSafety/CottageFoodExemptionENG.pdf", "source_title": "Oregon's Cottage Food Exemption (March 2026), Oregon Department of Agriculture Food Safety Program", "second_url": "https://oregon.gov/oda/Documents/Publications/FoodSafety/CottageFoodExemptionFAQENG.pdf", "checked": true, "date_read": "2026-11-24", "notes": "The department FAQ confirms the $52,700 cap and the food handler training requirement. Domestic kitchen license is a separate path for larger or other foods.", "status": "CHECKED"}, {"code": "PA", "state": "Pennsylvania", "program": "Limited Food Establishment registration (Pennsylvania Department of Agriculture); no cottage food exemption found", "allowed": "Shelf-stable, non-potentially hazardous foods from a home or residential-style kitchen: baked goods without cream fillings, jams, jellies, candies, certain snack mixes.", "not_allowed": "Foods needing refrigeration or hot holding, such as shellfish.", "sales_cap": "not stated on the official page", "label": "not found on the official page read (see application packet)", "permit": "Registration required with plan review and on-site inspection by the department; fee $35 at first registration and $35 annual renewal; submit materials at least 60 days before operating.", "where": "Sales direct from the production site including internet sales are covered; a Retail Food Facility License may be needed for events or farmers markets; selling across state lines may require FDA registration.", "source_url": "https://www.pa.gov/agencies/pda/food/food-safety/limited-food-establishment-.html", "source_title": "Apply for or Renew a Limited Food Establishment Registration, Pennsylvania Department of Agriculture", "second_url": "", "checked": false, "date_read": "2026-11-24", "notes": "Only one official page read; the application packet PDF (labeling and testing details) was not read. Pennsylvania does not exempt home foods from inspection.", "status": "UNCHECKED"}, {"code": "RI", "state": "Rhode Island", "program": "Cottage food manufacture (R.I. General Laws 21-27-6.2)", "allowed": "Baked goods not needing refrigeration or time/temperature control: double-crust pies, yeast breads, biscuits, brownies, cookies, muffins, cakes without refrigeration, and others defined by the Department of Health.", "not_allowed": "Anything needing refrigeration or time/temperature control. No consignment or wholesale; no sales to grocery stores, restaurants, care facilities, group homes, day cares or schools.", "sales_cap": "$50,000 per calendar year in gross sales", "label": "Name, address and phone; ingredients in descending order; allergens; and in at least 10-point type: \"Made by a Cottage Food Business Registrant that is not Subject to Routine Government Food Safety Inspection\" (unless made in a licensed commercial kitchen).", "permit": "Registration with the Department of Health: $65 a year, notarized affidavit of compliance, food safety manager or approved food handler course, private well water test; kitchen standards apply; recipes kept on site.", "where": "Direct to consumers by pickup or delivery within Rhode Island; internet, mail and phone orders allowed if the seller delivers in person within the state. Sales tax applies.", "source_url": "https://webserver.rilegislature.gov/Statutes/TITLE21/21-27/21-27-6.2.htm", "source_title": "R.I. General Laws 21-27-6.2 Cottage food manufacture (Rhode Island Legislature)", "second_url": "https://health.ri.gov/applications/CottageFoodManufacture.pdf", "checked": true, "date_read": "2026-11-24", "notes": "Department of Health registration form confirms the $65 fee, the under $50,000 gross sales limit and the training requirement. Statute amended effective June 26, 2024. The health.ri.gov cottage food web page blocked access. Farm home food manufacture is a separate category not covered here.", "status": "CHECKED"}, {"code": "SC", "state": "South Carolina", "program": "Home-based Food Production Law (S.C. Code 44-1-143), South Carolina Department of Agriculture", "allowed": "Non-time/temperature-controlled foods from a home kitchen: shelf-stable cakes, cookies, cupcakes, dried herbs and spices, high-acid pies, roasted nuts, sourdough bread, candies, and other non-TCS foods per the department guidance.", "not_allowed": "Time/temperature-controlled foods (casseroles, meats, seafood, ice cream), bottled beverages, cheesecake, charcuterie boards, hot sauce and BBQ sauce.", "sales_cap": "no cap stated; operations with net earnings under $1,500 a year are exempt from the labeling and other provisions but may only sell in person directly to the consumer", "label": "Name and address (or department-issued ID number), standard product name, ingredients by weight, allergens, and in all capital letters: \"PROCESSED AND PREPARED BY A HOME-BASED FOOD PRODUCTION OPERATION THAT IS NOT SUBJECT TO SOUTH CAROLINA'S FOOD SAFETY REGULATIONS.\" No health claims.", "permit": "No retail food permit or inspection; optional department ID number; private well water tested yearly for coliform.", "where": "Direct to consumers including online and mail order but delivered only inside South Carolina; retail stores including grocery stores in original packaging with a posted sign; restaurants only with a department variance.", "source_url": "https://agriculture.sc.gov/wp-content/uploads/2026/05/Home-basedFoodProduction2026.pdf", "source_title": "Home-Based Food Production (Cottage Law), South Carolina Department of Agriculture (May 2026)", "second_url": "https://agriculture.sc.gov/wp-content/uploads/2025/07/SCHome-basedFoodProductionLawBook2025_digital.pdf", "checked": true, "date_read": "2026-11-24", "notes": "Second page is the department's 2025 law guidance (version 1.4), which confirms the allowed foods, the no-cap structure, and in-state-only delivery.", "status": "CHECKED"}, {"code": "SD", "state": "South Dakota", "program": "South Dakota home-processed food (cottage) laws, SDCL 34-18 as amended", "allowed": "Non-temperature-controlled foods (baked goods, jams, dry mixes, nuts, acidic canned goods with pH 4.6 or less, fermented foods); some temperature-controlled foods if the producer is trained and delivers in person. Whole fresh produce needs no license.", "not_allowed": "Meat, poultry, jerky, fish, dairy, honey, eggs and non-food items fall under other agencies. Low-acid canned goods (pH above 4.6), fresh-cut produce, juices, take-and-bake, and prepared hot dishes need a license under the 2022 Health Department handout.", "sales_cap": "Conflicting: the 2021 bill text on the legislature site says $150,000 gross per year; the June 2022 Health Department handout says no monetary limits.", "label": "Product name, producer name, production address, mailing address, phone, date made, ingredients, refrigerate directive if needed, and a disclaimer that it was not produced in a commercial kitchen and may contain common allergens.", "permit": "No state license for qualifying sales. Canned, fermented, frozen or temperature-controlled foods need a food safety course every five years or written third-party processing authority approval (per 2022 handout).", "where": "2022 handout: from a home, farmers market or similar venue, in the seller's presence; no wholesale, no internet, no retail store. The 2021 bill text allows non-temperature-controlled items through third-party vendors such as stores. Retailers must post a not-inspected sign (bill text).", "source_url": "https://doh.sd.gov/media/jskjetg5/farmersmarketguideance.pdf", "source_title": "Farmers Market Guidance, South Dakota Department of Health (updated June 2022)", "second_url": "https://mylrc.sdlegislature.gov/api/Documents/Bill/214371.html?Year=2021", "checked": false, "date_read": "2026-11-24", "notes": "Official sources conflict (handout is 2022, bill text is 2021 merged text; later 2022 and 2025 amendments exist but I could not confirm current law). The Health Department cottage food page returned 404. SDSU Extension (not read in full) says the law was amended in January 2026. Treat cap and venues as unconfirme
