<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loomwork · workflow automation</title>
<style>
:root{--bg:#17142a;--panel:#211d3a;--panel2:#2a2549;--line:#3a3463;--text:#efe7d6;--dim:#a79fc4;--thread:#d08a4c;--thread2:#e9b36f;--ok:#7fc59a;--bad:#e7786f;--warn:#e8c25d;--sel:#8fb7ff;--trig:#6aa4c8;--c1:#d08a4c;--c2:#7fc59a;--c3:#8fb7ff;--c4:#c792ea;--c5:#e8c25d;--c6:#e7786f}
*{box-sizing:border-box}body{margin:0;font:13px/1.4 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--thread)}button.pri{background:var(--thread);color:#1b1408;border-color:var(--thread);font-weight:600}
textarea{width:100%;font-family:Consolas,monospace;font-size:12px}
header{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;letter-spacing:.5px;margin-right:6px}.logo svg{width:22px;height:22px}
#wfname{width:220px;font-weight:600}#mode{margin-left:auto;color:var(--dim);font-size:12px}
main{flex:1;display:flex;min-height:0}
#lib{width:210px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#lib input{margin:8px}#libl{overflow:auto;flex:1;padding:0 8px 8px}
.grp{color:var(--dim);font-size:11px;text-transform:uppercase;margin:10px 0 4px}
.lt{padding:5px 8px;border:1px solid var(--line);border-left:3px solid var(--thread);border-radius:6px;margin:3px 0;cursor:grab;background:var(--panel2);user-select:none}
.lt.trig{border-left-color:var(--trig)}.lt:hover{border-color:var(--thread)}
#stage{flex:1;position:relative;overflow:hidden;background:
 repeating-linear-gradient(90deg,transparent 0 23px,rgba(208,138,76,.05) 23px 24px),repeating-linear-gradient(0deg,transparent 0 23px,rgba(143,183,255,.04) 23px 24px)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--thread);stroke-width:2.2;pointer-events:stroke;cursor:pointer}#wires path:hover{stroke:var(--bad);stroke-width:3.5}
#wires path.back{stroke-dasharray:6 4}#wires path.live{stroke:var(--sel);stroke-dasharray:4 3}
.node{position:absolute;width:170px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;user-select:none;cursor:move;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.node.sel{border-color:var(--sel)}.node.trig{border-radius:18px 10px 10px 18px}.node.off{opacity:.45}
.node .hd{padding:6px 8px 2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .ty{padding:0 8px 6px;color:var(--dim);font-size:11px}
.node.ok{border-color:var(--ok)}.node.err{border-color:var(--bad)}.node.skip{border-style:dashed}
.node.imp{border:2px dashed #d9a441;background:repeating-linear-gradient(135deg,var(--panel) 0 10px,rgba(217,164,65,.10) 10px 20px)}.node.imp .ty::before{content:"⚠ "}
.badge{position:absolute;right:6px;top:-9px;background:var(--ok);color:#10200f;border-radius:9px;padding:0 6px;font-size:11px;font-weight:700}
.badge.err{background:var(--bad);color:#2a0f0d}.pin{position:absolute;left:6px;top:-9px;font-size:12px}
.port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--thread);cursor:crosshair}
.port.in{left:-7px}.port.out{right:-7px}.port.err{border-color:var(--bad)}
.plabel{position:absolute;right:10px;font-size:10px;color:var(--dim);pointer-events:none}
.note{background:#3b3420;border-color:#6b5a2c;cursor:move}.note .ty{white-space:pre-wrap}
#side{width:330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side .tabs{display:flex;gap:2px;padding:6px 6px 0}#side .tabs button{border-radius:6px 6px 0 0;border-bottom:none}#side .tabs button.on{background:var(--thread);color:#1b1408}
#sidebody{overflow:auto;padding:8px;flex:1;border-top:1px solid var(--line)}
.f{margin:0 0 8px}.f label{display:block;color:var(--dim);font-size:11px;margin-bottom:2px}.f input,.f select{width:100%}
.row{display:flex;gap:4px;margin:2px 0}.row input,.row select{flex:1;min-width:0}
.hint{color:var(--dim);font-size:11px}
table.d{border-collapse:collapse;width:100%;font-size:11px}table.d td,table.d th{border:1px solid var(--line);padding:2px 4px;text-align:left;vertical-align:top;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:var(--bg);padding:6px;border-radius:6px;margin:4px 0;max-height:320px;overflow:auto}
#dock{height:170px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
#dock .tabs{display:flex;gap:4px;padding:4px 8px;align-items:center}#dock .tabs button.on{background:var(--thread);color:#1b1408}
#dockbody{flex:1;overflow:auto;padding:0 8px 6px;font-size:12px}
.st{display:inline-block;width:62px}.st.ok{color:var(--ok)}.st.error{color:var(--bad)}.st.skipped,.st.disabled{color:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(10,8,20,.7);display:none;align-items:center;justify-content:center;z-index:9}
.modal.on{display:flex}.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(860px,92vw);max-height:86vh;overflow:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel2);cursor:pointer}.card:hover{border-color:var(--thread)}
.card b{display:block}.tag{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:8px;padding:0 5px;margin:2px 2px 0 0;color:var(--dim)}
#toast{position:fixed;bottom:184px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--thread);padding:6px 12px;border-radius:8px;display:none;z-index:10}
.sw{display:inline-flex;align-items:center;gap:4px;color:var(--dim)}
</style></head><body>
<header>
 <span class="logo"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="#a79fc4" stroke-width="1.2"/><path d="M6 3v18M12 3v18M18 3v18" stroke="#d08a4c" stroke-width="2"/><ellipse cx="12" cy="12" rx="5" ry="2.2" fill="#e9b36f"/></svg>Loomwork</span>
 <input id="wfname" value="New workflow" title="Workflow name">
 <button id="b-new" title="Start an empty workflow">New</button><button id="b-open">Open</button><button id="b-tpl">Templates</button>
 <button id="b-save">Save</button><button id="b-run" class="pri" title="Run the whole workflow (Ctrl+Enter)">▶ Run</button>
 <label class="sw" title="Active = its triggers (schedule, webhook, file, forum, app event) start it by themselves in the local engine"><input type="checkbox" id="active"> Active</label>
 <button id="b-imp">Import</button><button id="b-exp">Export</button>
 <span id="mode"></span>
</header>
<main>
 <aside id="lib"><input id="q" placeholder="Search nodes…" autocomplete="off"><div id="libl"></div></aside>
 <section id="stage"><div id="world"><svg id="wires" width="1" height="1"></svg></div></section>
 <aside id="side"><div class="tabs"><button data-t="set" class="on">Settings</button><button data-t="in">Input</button><button data-t="out">Output</button><button data-t="wf">Workflow</button></div><div id="sidebody"></div></aside>
</main>

<div class="modal" id="m"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

  $$('#dock .tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.d === S.dock); });
  var body = $('#dockbody');
  if (S.dock === 'log') {
    var ex = S.last; if (!ex) { body.innerHTML = '<p class="hint">Run the workflow (▶ Run or Ctrl+Enter) to see each node here.</p>'; return; }
    body.innerHTML = '<p class="hint">' + esc(ex.status || '') + (ex.ms != null ? ' · ' + ex.ms + ' ms' : '') + (ex.error ? ' · <span style="color:var(--bad)">' + esc(ex.error.message) + '</span>' : '') + '</p>' +
      ex.steps.map(function (s) { return '<div data-node="' + s.node + '" style="cursor:pointer"><span class="st ' + s.status + '">' + s.status + '</span> ' + esc(s.name) + ' <span class="hint">· ' + (s.inCount || 0) + ' in → ' + (s.outCounts || []).join(' / ') + ' out · ' + (s.ms || 0) + ' ms' + (s.tries > 1 ? ' · ' + s.tries + ' tries' : '') + (s.pinnedUsed ? ' · pinned' : '') + '</span>' + (s.error ? ' <span style="color:var(--bad)">' + esc(s.error) + '</span>' : '') + '</div>'; }).join('');
    $$('[data-node]', body).forEach(function (e) { e.onclick = function () { S.sel = e.dataset.node; S.sideTab = 'out'; draw(); renderSide(); }; });
  }
  if (S.dock === 'runs') {
    Store.runs(S.wf.id).then(function (rs) {
      body.innerHTML = (rs || []).length ? rs.map(function (r) { return '<div><span class="st ' + r.status + '">' + esc(r.status) + '</span> ' + esc(r.started) + ' <span class="hint">· ' + esc(r.mode || '') + ' · ' + (r.ms || 0) + ' ms</span> ' + (LIVE ? '<button data-open="' + r.runId + '">open</button> <button data-replay="' + r.runId + '">replay</button>' : '') + (r.error ? ' <span style="color:var(--bad)">' + esc(r.error.message) + '</span>' : '') + '</div>'; }).join('') : '<p class="hint">No runs saved for this workflow yet.</p>';
      $$('[data-open]', body).forEach(function (b) { b.onclick = function () { api('/api/runs/' + b.dataset.open).then(setLast); }; });
      $$('[data-replay]', body).forEach(function (b) { b.onclick = function () { toast('Replaying with the same trigger data…'); api('/api/runs/' + b.dataset.replay + '/replay', { wait: true }).then(function (ex) { setLast(ex); toast('Replay: ' + ex.status, ex.status !== 'ok'); }); }; });
    });
  }
  if (S.dock === 'chart') {
    Store.runs(S.wf.id).then(function (rs) { body.innerHTML = runChart((rs || []).slice(0, 60).reverse()) + (LIVE ? '<p class="row"><label class="hint">Keep run logs for <input id="k-days" type="number" min="1" style="width:60px" value="30"> days (the newest 20 per workflow always stay)</label> <button id="k-go">Clean up now</button></p>' : '<p class="hint">In the tab the last 20 runs are kept.</p>');
      if ($('#k-go')) { api('/api/settings').then(function (st) { if (st && st.keepDays) $('#k-days').value = st.keepDays; }); $('#k-go').onclick = function () { var d = +$('#k-days').value || 30; api('/api/settings', { keepDays: d }).then(function () { return api('/api/runs/prune', { keepDays: d }); }).then(function (r) { toast('Deleted ' + r.deleted + ' old run logs, kept ' + r.kept); renderDock(); }); }; }
    });
  }
  if (S.dock === 'set') {
    if (!LIVE) { body.innerHTML = '<p class="hint">Settings live in the local Loomwork engine. Open http://127.0.0.1:8821 to change them.</p>'; return; }
    var TR = [['forumDir', 'Forum folder', 'forum trigger (the folder that holds the threads folder)'], ['busDir', 'Message folder', 'message trigger'], ['claimsFile', 'Claims file', 'claims trigger (a .json file)']];
    api('/api/settings').then(function (st) {
      body.innerHTML = '<p class="hint">Trigger folders on this computer. Blank = that trigger is off. Only a full path that exists is taken.</p>' +
        TR.map(function (t) { var on = (st.triggersOff || []).indexOf(t[0]) < 0; return '<div class="row" style="margin:2px 0"><label style="width:120px">' + t[1] + '</label><input id="s-' + t[0] + '" style="flex:1;min-width:280px" value="' + esc(st[t[0]] || '') + '" placeholder="blank = off"> <span class="st ' + (on ? 'ok' : 'skipped') + '" id="s-st-' + t[0] + '">' + (on ? 'on' : 'off') + '</span> <span class="hint">' + t[2] + '</span></div>'; }).join('') +
        '<p class="row"><button id="s-save">Save settings</button> <span id="s-msg" class="hint"></span></p>';
      $('#s-save').onclick = function () {
        var b = {}; TR.forEach(function (t) { b[t[0]] = $('#s-' + t[0]).value.trim(); });
        fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Loom-Token': LIVE_TOKEN }, body: JSON.stringify(b) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) { if (!x.ok) { $('#s-msg').textContent = x.j.error || 'not saved'; $('#s-msg').style.color = 'var(--bad)'; toast('Not saved: ' + (x.j.error || ''), true); return; }
            toast('Settings saved: ' + (3 - (x.j.triggersOff || []).length) + ' of 3 triggers on'); renderDock(); });
      };
    });
  }
  if (S.dock === 'ver') {
    Store.versions(S.wf.id).then(function (vs) {
      body.innerHTML = (vs || []).length ? vs.slice().reverse().map(function (v) { return '<div>v' + v.version + ' <span class="hint">· ' + esc(v.updated) + ' · ' + v.nodes + ' nodes ' + esc(v.note ? '· ' + v.note : '') + '</span> <button data-v="' + v.version + '">restore</button></div>'; }).join('') : '<p class="hint">Save to start the version history.</p>';
      $$('[data-v]', body).forEach(function (b) { b.onclick = function () { Store.version(S.wf.id, +b.dataset.v).then(function (w) { if (!w) return; delete w.versionNote; load(w); toast('Version ' + b.dataset.v + ' loaded: Save to keep it'); }); }; });
    });
  }
}

var isDirty = false;
function dirty() { isDirty = true; $('#b-save').textContent = 'Save •'; }
function save() {
  S.wf.name = $('#wfname').value || 'Untitled'; S.wf.active = $('#active').checked;
  var note = prompt('Note for this version (optional)', '') || '';
  return Store.save(JSON.parse(JSON.stringify(S.wf)), note).then(function (w) { if (w && w.version) { S.wf.version = w.version; S.wf.updated = w.updated; } isDirty = false; $('#b-save').textContent = 'Save'; toast('Saved, version ' + S.wf.version + (S.wf.active ? (LIVE ? ' · active: triggers are on' : ' · active needs the local engine') : '')); renderSide(); if (S.dock === 'ver') renderDock(); });
}
$('#b-save').onclick = save;
function load(wf) { S.wf = wf; S.wf.nodes = S.wf.nodes || []; S.wf.connections = S.wf.connections || []; $('#wfname').value = wf.name || ''; $('#active').checked = !!wf.active; S.sel = null; S.last = null; isDirty = false; $('#b-save').textContent = 'Save'; fit(); draw(); renderSide(); renderDock(); }
function fit() { if (!S.wf.nodes.length) { S.view = { x: 40, y: 20, z: 1 }; return; } var r = $('#stage').getBoundingClientRect(), xs = S.wf.nodes.map(function (n) { return n.pos[0]; }), ys = S.wf.nodes.map(function (n) { return n.pos[1]; }); var w = Math.max.apply(null, xs) - Math.min.apply(null, xs) + 240, h = Math.max.apply(null, ys) - Math.min.apply(null, ys) + 140; var z = Math.min(1.2, Math.max(.35, Math.min(r.width / w, r.height / h))); S.view = { z: z, x: 30 - Math.min.apply(null, xs) * z, y: 30 - Math.min.apply(null, ys) * z }; }
$('#b-new').onclick = function () { if (isDirty && !confirm('Drop unsaved changes?')) return; load(blank()); };
function modal(html) { $('#mbox').innerHTML = html + '<p style="text-align:right;margin:10px 0 0"><button id="m-x">Close</button></p>'; $('#m').classList.add('on'); $('#m-x').onclick = closeModal; }
function closeModal() { $('#m').classList.remove('on'); }
$('#m').onclick = function (e) { if (e.target.id === 'm') closeModal(); };
$('#b-open').onclick = function () {
  Store.list().then(function (l) {
    S.saved = l || [];
    modal('<h3>Open a workflow</h3>' + (l.length ? '<div class="cards">' + l.map(function (w) { return '<div class="card" data-id="' + esc(w.id) + '"><b>' + esc(w.name) + '</b><span class="hint">' + w.nodes + ' nodes · v' + w.version + (w.active ? ' · active' : '') + '<br>' + esc(w.updated || '') + '</span></div>'; }).join('') + '</div>' : '<p class="hint">Nothing saved yet. Start from a template or build one.</p>'));
    $$('.card', $('#mbox')).forEach(function (c) { c.onclick = function () { Store.get(c.dataset.id).then(function (w) { closeModal(); load(w); }); }; });
  });
};
$('#b-tpl').onclick = function () {
  var tags = {}; TEMPLATES.forEach(function (t) { (t.tags || []).forEach(function (g) { tags[g] = 1; }); });
  modal('<h3>Templates</h3><p class="hint">Starter workflows. Picking one makes your own copy; nothing runs until you press Run or turn it Active.</p><input id="t-q" placeholder="Search templates…" style="width:100%;margin-bottom:8px"><div class="cards" id="t-l"></div>');
  function list() { var q = $('#t-q').value.toLowerCase(); $('#t-l').innerHTML = TEMPLATES.filter(function (t) { return !q || (t.name + ' ' + t.about + ' ' + (t.tags || []).join(' ')).toLowerCase().indexOf(q) >= 0; }).map(function (t) { return '<div class="card" data-id="' + t.id + '"><b>' + esc(t.name) + '</b><span class="hint">' + esc(t.about) + '</span><br>' + (t.tags || []).map(function (g) { return '<span class="tag">' + esc(g) + '</span>'; }).join('') + '<span class="tag">' + t.nodes.length + ' nodes</span></div>'; }).join(''); $$('.card', $('#t-l')).forEach(function (c) { c.onclick = function () { var t = JSON.parse(JSON.stringify(TEMPLATES.filter(function (x) { return x.id === c.dataset.id; })[0])); t.id = 'w' + Date.now().toString(36); t.fromTemplate = c.dataset.id; closeModal(); load(t); dirty(); toast('Template copied: change it, then Save'); }; }); }
  $('#t-q').oninput = list; list();
};
$('#b-exp').onclick = function () {
  var lw = JSON.stringify(S.wf, null, 1), nx = null, rep = null, why = '', cur = 'lw';
  try { var r = Loom.toN8n(S.wf); nx = JSON.stringify(r.n8n, null, 1); rep = r.report; } catch (e) { why = e.message; }
  modal('<h3>Export</h3><p class="hint">This workflow as JSON. Credentials are never in it (nodes only name a vault entry).</p><p><label><input type="radio" name="x-f" value="lw" checked> Loomwork JSON</label> &nbsp; <label><input type="radio" name="x-f" value="n8n" id="x-n8n"' + (nx ? '' : ' disabled') + '> n8n workflow JSON</label></p><p class="hint" id="x-r"></p><textarea rows="16" id="x-t">' + esc(lw) + '</textarea><p><button id="x-dl" class="pri">Download .json</button> <button id="x-cp">Copy</button></p>');
  function txt() { return cur === 'n8n' ? nx : lw; }
  $$('input[name="x-f"]').forEach(function (r) { r.onchange = function () { cur = r.value; $('#x-t').value = txt();
    $('#x-r').textContent = cur !== 'n8n' ? '' : rep.native.length + ' node(s) written as n8n nodes; ' + rep.kept.length + ' kept as Loomwork nodes (n8n shows them as unknown, Loomwork reads them back exactly)' + (rep.kept.length ? ': ' + rep.kept.map(function (k) { return k.name; }).join(', ') : '') + (rep.renamed.length ? '. Renamed for n8n (names must differ): ' + rep.renamed.map(function (k) { return k.from + ' -> ' + k.to; }).join(', ') : '') + '. Drafts are never written as n8n nodes that send.'; }; });
  if (!nx) $('#x-r').textContent = 'n8n export not possible: ' + why;
  $('#x-dl').onclick = function () { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt()], { type: 'application/json' })); a.download = (S.wf.name || 'workflow').replace(/[^\w-]+/g, '_') + (cur === 'n8n' ? '.n8n.json' : '.loomwork.json'); a.click(); };
  $('#x-cp').onclick = function () { var t = $('#x-t'); t.select(); try { navigator.clipboard.writeText(txt()).then(function () { toast('Copied'); }, function () { document.execCommand('copy'); toast('Copied'); }); } catch (e) { document.execCommand('copy'); } };
};
$('#b-imp').onclick = function () {
  modal('<h3>Import</h3><p class="hint">Paste Loomwork JSON or an n8n workflow export, or open a file. It is checked before it loads; it gets a new id so nothing saved is overwritten. n8n nodes with no Loomwork match come in as marked placeholders that stop the run until you replace them.</p><textarea rows="14" id="i-t" placeholder="{ &quot;nodes&quot;: [...], &quot;connections&quot;: [...] }"></textarea><p><input type="file" id="i-f" accept=".json,application/json"> <button id="i-go" class="pri">Import</button></p><pre id="i-err" style="color:var(--bad);display:none"></pre>');
  $('#i-f').onchange = function () { var f = this.files[0]; if (f) f.text().then(function (t) { $('#i-t').value = t; }); };
  $('#i-go').onclick = function () { try { var w = importWf($('#i-t').value); closeModal(); load(w); dirty(); if (S.lastImport) showImportReport(S.lastImport); else toast('Imported ' + w.nodes.length + ' nodes: Save to keep it'); } catch (e) { $('#i-err').style.display = 'block'; $('#i-err').textContent = e.message; } };
};
function showImportReport(r) {
  var li = function (a) { return a.length ? '<ul>' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<p class="hint">none</p>'; };
  modal('<h3>Imported from n8n</h3><p id="imp-sum"><b>' + r.mapped.length + '</b> nodes mapped, <b>' + r.placeholders.length + '</b> placeholders (dashed amber: replace them before running), ' + r.expressions.length + ' expressions to check. Save to keep it.</p>' +
    '<h4>Placeholders</h4>' + li(r.placeholders.map(function (p) { return p.name + ' (' + p.type + '): ' + p.why; })) +
    '<h4>Expressions Loomwork cannot read yet</h4>' + li(r.expressions.map(function (e) { return e.where + ': ' + e.n8n + ' (' + e.problem + ')'; })) +
    '<h4>Written-down guesses</h4>' + li(r.assumptions.concat(r.skippedLines)) + '<p><button class="pri" id="imp-ok">OK</button></p>');
  $('#imp-ok').onclick = closeModal;
}
function importWf(text) {
  var w = JSON.parse(text);
  if (Loom.looksN8n && Loom.looksN8n(w)) {
    var r = Loom.fromN8n(w); w = r.workflow;
    w.nodes.forEach(function (n, i) { n.pos = n.pos || [60 + 220 * i, 160]; n.params = n.params || {}; });
    S.lastImport = r.report; return w;
  }
  S.lastImport = null;
  if (!w || !Array.isArray(w.nodes)) throw new Error('No "nodes" list: this is not a Loomwork workflow.');
  w.connections = w.connections || [];
  var errs = Loom.validate(w); if (errs.length) throw new Error('It does not check out:\n' + errs.join('\n'));
  w.nodes.forEach(function (n, i) { n.pos = n.pos || [60 + 220 * i, 160]; n.params = n.params || {}; n.name = n.name || n.id; });
  w.id = 'w' + Date.now().toString(36); w.active = false; delete w.version; return w;
}
window.LoomUI = { load: load, runAll: runAll, testNode: testNode, importWf: importWf, save: save, state: S, addNode: addNode };

$('#mode').innerHTML = LIVE ? '● Connected to the local engine · ' + esc(location.host) : IN_UDS ? 'Tab mode · saves in this tab · machine nodes need <b>python loomd.py</b>' : 'Browser mode · saves in this browser';
if (LIVE) setInterval(function () { api('/api/ping').then(function (p) { $('#dockhint').textContent = 'engine: ' + p.running + ' running, ' + p.queue + ' waiting' + (p.waitingRam ? ' (waiting for free memory)' : '') + (p.freeGB != null ? ' · ' + p.freeGB.toFixed(1) + ' GB free' : ''); }).catch(function () { $('#dockhint').textContent = 'engine not answering'; }); }, 5000);
renderLib();
Store.list().then(function (l) {
  S.saved = l || [];
  if (l && l.length) return Store.get(l[l.length - 1].id).then(load);
  var t = JSON.parse(JSON.stringify(TEMPLATES.filter(function (x) { return x.id === 't_demo_orders'; })[0] || blank())); t.id = 'w' + Date.now().toString(36); load(t);
});
window.addEventListener('resize', function () { draw(); });
</script>
