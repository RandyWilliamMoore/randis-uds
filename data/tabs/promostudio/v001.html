<style>
:root{--bg:#0a0f1c;--pn:#111a2e;--pn2:#16223b;--ln:#26365a;--tx:#e4ecff;--tx2:#9fb0d4;--ac:#5ee6ff;--ac2:#a98bff;--ok:#5fd38a;--warn:#ffb454;--bad:#ff6b6b;--yt:#ff3d3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--ln);background:linear-gradient(90deg,#120b22,#0a1428)}
header h1{font-size:17px;margin:0;letter-spacing:2px}header h1 b{color:var(--yt)}header .sp{flex:1}
nav{display:flex;gap:4px}nav button,.btn{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on,.btn.pri{background:linear-gradient(90deg,#7a5cff,#3fb7ff);border-color:transparent;color:#fff;font-weight:600}.btn:hover{border-color:var(--ac)}.btn.sm{padding:3px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 86px)}main.one{display:block;overflow:auto;padding:18px}
#list{border-right:1px solid var(--ln);overflow:auto;padding:10px}#work{overflow:auto;padding:16px 20px}
.it{padding:7px 9px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center;border:1px solid transparent}.it:hover{background:var(--pn)}.it.on{background:var(--pn2);border-color:var(--ac)}
.it .k{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:1px}.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#3a4766}.dot.d{background:var(--warn)}.dot.p{background:var(--ok)}
input,select,textarea{background:#0c1426;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;font:inherit}textarea{width:100%;min-height:90px;resize:vertical}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px 14px;margin:0 0 12px}.card h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}.card h3 .sp{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:var(--tx2)}.small{font-size:12.5px}.tiny{font-size:11px}
.cnt{font:11px Consolas,monospace;color:var(--tx2)}.cnt.over{color:var(--bad)}
.opt{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed #22314f}.opt span{flex:1}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--ln);padding:5px 6px;text-align:left;vertical-align:top}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:#1c2a49;font-size:11.5px;margin:1px}
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#1e2c4c;border:1px solid var(--ac);padding:7px 16px;border-radius:6px;opacity:0;transition:.25s;pointer-events:none}#toast.on{opacity:1}
footer{height:26px;line-height:26px;font-size:11px;color:var(--tx2);padding:0 14px;border-top:1px solid var(--ln);white-space:nowrap;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.warn{color:var(--warn)}

gn A Tanker's War, or take on a friend on the same keyboard or over the internet. Earn coins for upgrades and gear and paint your tank your way in the garage.", "feats": ["Defend Your Base mode against waves of enemies", "Story mode: A Tanker's War", "Versus a Friend on the same keyboard, or online by hosting or joining with an invite code (online needs Randis UDS), with chat and rematches", "Map codes: the same code always makes the same map, or roll a random one", "Garage: upgrades, gear and custom paint details (stripes, spots, digital camo, stars, crosses, rings)", "Earn coins in every battle to spend on your tank", "Real items linked from the maker's Etsy shop"]}, {"key": "games:bindy-and-louis", "kind": "games", "slug": "bindy-and-louis", "name": "Bindy & Louis", "by": "Randy", "blurb": "Bindy the binder clip helps you fix your own stuff with 320 repair tips, then teams up with Louis, the repair guy, to fight Mega Corp for the right to repair.", "version": 1, "download": "", "about": "Bindy & Louis is two things in one: a friendly repair helper and an arcade game. Ask Bindy, a talking binder clip, about anything broken and get one of 320 repair tips, then play Repair Wars, where Bindy teams up with Louis the repair guy to fight Mega Corp for the right to repair.", "feats": ["Helper: ask Bindy about your broken phone, laptop or gadget and get repair tips, with careful warnings", "320 repair tips built in", "Repair Wars arcade game: stages, power-ups like the 3-way Multi-Tool and the rapid-fire Power Drill, and a final showdown with Mega Corp", "Top repair YouTubers (Louis Rossmann, Hugh Jeffreys and more)", "Top repair resources and tools", "Sound and volume controls (M to mute)"]}, {"key": "games:blockwild", "kind": "games", "slug": "blockwild", "name": "Blockwild", "by": "Randy", "blurb": "An original voxel sandbox: an endless generated world of plains, forests, deserts, snow, mountains, oceans and caves. Break and place 22 block types in Survival (health, cr ourself.", "feats": ["Machine settings across LHC eras: beam energy, bunches per beam, protons per bunch and crossing angle", "Start a fill, collide, and dump the beam", "Ring view of the Geneva area from above and a detector cross-section event display", "Live beam readout: dipole field and current, beam losses and crossing factor", "Systems panel, totals and a control room log", "Risk department: odds of getting this far unscathed, runs since the last portal and universes lost", "Tempt fate button to open a portal on purpose", "Did you know? facts, plus links to CERN, its experiments, open data, YouTube channels and physics lessons", "Sound on and off"]}, {"key": "games:mail-sorter", "kind": "games", "slug": "mail-sorter", "name": "Mail Sorter", "by": "Randy", "blurb": "The mail just keeps coming. Can you keep up? Sort it, score points for tricks, find free snacks in the break room and win coworker clout in break-time mini games.", "version": 2, "download": "", "about": "Mail Sorter is a fast, funny office game: the mail just keeps coming, so sort it before the pile buries you. Score points for tricks, hunt for free snacks around the break room, and win coworker clout in break-time mini games, unless you rage quit and have to beg for your job back.", "feats": ["Sort an endless pile of letters to the right people (the Patel Family, Aunt Gladys, Current Resident...)", "Points for tricks, coworker clout and aura", "Union-mandated break room: make a coffee and find a clean cup", "Snack hunt in couch cushions, the vending machine tray, the junk drawer and behind the water cooler", "STAK-O-TRON 2, a busted old arcade machine mini game", "Rage Quit, then beg for your job back"]}, {"key": "games:marble-collector", "kind": "games", "slug": "marble-collector", "name": "Marble Collector", "by": "Randy", "blurb": "Play marbles in an arena, keep the cool ones you win, and build a prized set.", "version": 7, "download": "", "about": "Marble Collector is a game of marbles with a
