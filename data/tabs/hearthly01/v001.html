<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearthly</title>
<style>
:root{--bg:#1d1a17;--rail:#15120f;--side:#25211c;--main:#2c2722;--line:#3a332b;--ink:#efe6da;--dim:#a89a88;--ember:#e0884a;--ember2:#f2a65e;--moss:#7fb6a4;--warn:#e07a7a;--hi:rgba(224,136,74,.14);--r:14px;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--line);border-radius:9px;padding:7px 12px}
button.pri{background:var(--ember);color:#1d1a17;font-weight:600}button.pri:hover{background:var(--ember2)}
button.ghost{background:transparent;color:var(--dim)}button.ghost:hover{color:var(--ink)}
input,select,textarea{background:#1a1714;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
input:focus,textarea:focus{border-color:var(--ember)}
.hidden{display:none!important}
#app{display:grid;grid-template-columns:72px 240px 1fr 232px;height:100vh;height:100dvh}
#rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;overflow-y:auto}
.hallbtn{width:48px;height:48px;border-radius:50% 50% 50% 18%;background:var(--side);display:grid;place-items:center;font-weight:700;position:relative;transition:border-radius .15s,background .15s;user-select:none}
.hallbtn:hover,.hallbtn.on{border-radius:16px;background:var(--ember);color:#1d1a17}
.hallbtn.home{background:#3b2f24;font-size:22px}.hallbtn.add{background:transparent;border:2px dashed var(--line);color:var(--moss);font-size:24px}
.hallbtn .dot{position:absolute;right:-2px;bottom:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;display:grid;place-items:center;border:3px solid var(--rail)}
.sep{width:32px;height:2px;background:var(--line);border-radius:2px}
#side{background:var(--side);display:flex;flex-direction:column;min-width:0}
#sidehead{padding:14px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:6px;min-height:52px}
#sidehead span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:70px}#sidehead button{padding:4px 5px;flex:none}
#sidelist{flex:1;overflow-y:auto;padding:8px}
.grp{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:12px 6px 4px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;color:var(--dim);cursor:pointer;position:relative}
.item:hover{background:#2f2a24;color:var(--ink)}.item.on{background:#3a322a;color:var(--ink)}
.item.unread{color:var(--ink);font-weight:600}
.item .badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px}
.hash{color:var(--ember);font-weight:700;width:14px;text-align:center}
#me{display:flex;align-items:center;gap:8px;padding:10px;background:#211d19;border-top:1px solid var(--line)}
#me .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#1d1a17;position:relative;flex:none}
.av .st{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:3px solid var(--side)}
.st.online{background:#7cc47a}.st.idle{background:#e2c25c}.st.dnd{background:var(--warn)}.st.offline{background:#6b6258}
#main{background:var(--main);display:flex;flex-direction:column;min-width:0}
#mainhead{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);min-height:52px}
#mainhead .t{font-weight:700}#mainhead .topic{color:var(--dim);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
#msgs{flex:1;overflow-y:auto;padding:10px 0}
.msg{display:grid;grid-template-columns:52px 1fr;padding:3px 16px 3px 8px;position:relative}
.msg:hover{background:rgba(0,0,0,.12)}.msg.ment{background:var(--hi);box-shadow:inset 3px 0 var(--ember)}
.msg .av{margin:4px auto 0}.msg.cont .av{visibility:hidden;height:0}.msg.cont .who{display:none}
.who{font-weight:600}.when{color:var(--dim);font-size:11px;margin-left:6px;font-weight:400}
.body{white-space:pre-wrap;word-wrap:break-word;line-height:1.4}
.body code{background:#1a1714;padding:1px 5px;border-radius:5px;font-family:Consolas,monospace;font-size:13px}
.mention{background:rgba(224,136,74,.28);color:var(--ember2);border-radius:5px;padding:0 3px;font-weight:600}
.msg.sys{color:var(--dim);font-style:italic}.msg.sys .body::before{content:"→ ";color:var(--moss)}
.reacts{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{background:#231f1b;border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:13px;cursor:pointer}
.chip.mine{border-color:var(--ember);background:rgba(224,136,74,.15)}
.tools{position:absolute;right:14px;top:-10px;display:none;background:var(--side);border:1px solid var(--line);border-radius:9px;padding:2px}
@media (hover:hover){.msg:hover .tools{display:flex}}.msg.touch .tools{display:flex}.tools button{background:transparent;padding:3px 7px}
#typing{height:18px;color:var(--dim);font-size:12px;padding:0 18px}
#composer{padding:0 14px 14px;position:relative}
#composer form{display:flex;gap:8px;background:#36302a;border-radius:var(--r);padding:6px}
#composer textarea{flex:1;border:0;background:transparent;resize:none;max-height:140px;padding:8px}
#attach{background:transparent;border:0;font-size:18px;padding:0 6px;cursor:pointer}
.att{display:inline-flex;gap:8px;align-items:center;padding:7px 11px;border-radius:8px;background:#0003;margin-top:4px;color:inherit;text-decoration:none;max-width:100%}.att span{color:var(--dim);font-size:12px}
.att-img img{display:block;max-width:min(320px,100%);max-height:240px;border-radius:8px;margin-top:4px;background:#0002}
#main.drop{outline:2px dashed var(--moss);outline-offset:-6px}
#suggest{position:absolute;bottom:62px;left:14px;right:14px;background:var(--side);border:1px solid var(--line);border-radius:10px;padding:4px;max-height:200px;overflow-y:auto}
#suggest div{padding:6px 10px;border-radius:7px;cursor:pointer}#suggest div.on,#suggest div:hover{background:#3a322a}
#more{display:block;margin:4px auto 8px}
.empty{color:var(--dim);text-align:center;margin-top:20vh;padding:0 20px}
#members{background:var(--side);overflow-y:auto;padding:8px;border-left:1px solid var(--line)}
.mem{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer}
.mem:hover{background:#2f2a24}.mem.off{opacity:.45}
.rolepill{display:inline-block;border-radius:8px;padding:1px 7px;font-size:11px;margin:2px 3px 0 0;border:1px solid}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20}
.card{background:var(--side);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(420px,92vw);max-height:88vh;overflow-y:auto}
.card h2{margin:0 0 12px;font-size:19px}.card label{display:block;color:var(--dim);font-size:12px;margin:10px 0 4px}
.card input,.card select{width:100%}.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.perm{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:4px 0}.perm input{width:auto}
.code{font-family:Consolas,monospace;font-size:20px;background:#1a1714;padding:10px;border-radius:10px;text-align:center;letter-spacing:.06em;user-select:all}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3a322a;border:1px solid var(--line);padding:9px 16px;border-radius:12px;z-index:30;max-width:90vw}
#login{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#3b2a1c,#15120f 70%);display:grid;place-items:center;z-index:25}
.logo{font-size:34px;font-weight:800;letter-spacing:-.02em}.logo b{color:var(--ember)}
.flame{display:inline-block;width:26px;height:34px;background:linear-gradient(var(--ember2),var(--ember));border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-right:8px;vertical-align:-4px;transform:rotate(-8deg)}
#netbar{background:var(--warn);color:#fff;text-align:center;font-size:13px;padding:3px}
.reply-q{font-size:12.5px;color:var(--dim);display:flex;gap:6px;align-items:baseline;cursor:pointer;margin:2px 0 1px;padding-left:8px;border-left:2px solid var(--line);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.reply-q b{color:var(--ink);font-weight:600}.edited{color:var(--dim);font-size:11px;margin-left:5px}.pinmark{font-size:11px;margin-left:6px}
.bot{font-size:10px;background:var(--moss);color:#1d1a17;border-radius:4px;padding:0 4px;margin-left:5px;font-weight:700;vertical-align:1px}
#cbar{display:flex;gap:8px;align-items:center;background:#2f2a24;border-radius:10px 10px 0 0;padding:6px 12px;font-size:13px;color:var(--dim);margin:0 6px}
#cbar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#cbar.editing{color:var(--ember2)}
.hit{padding:8px 10px;border-radius:9px;cursor:pointer;border:1px solid var(--line);margin:6px 0}.hit:hover{background:#2f2a24}.hit small{color:var(--dim)}
.msg.flash{animation:flash 1.6s ease-out}@keyframes flash{from{background:rgba(224,136,74,.38)}to{background:transparent}}
.emogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.emogrid button{background:transparent;font-size:21px;padding:4px}.emogrid button:hover{background:var(--line)}
.hbtn{background:transparent;color:var(--dim);padding:5px 7px}.hbtn:hover{color:var(--ink)}
.lvl{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px;border:1px solid var(--line);margin:6px 0;cursor:pointer}.lvl input{width:auto;margin-top:3px}.lvl small{display:block;color:var(--dim)}
#mnav,.back{display:none}
@media (max-width:720px){
 #app{grid-template-columns:64px 1fr;grid-template-rows:1fr 58px}
 #main,#members{grid-column:1/3;grid-row:1}
 body:not(.v-chat) #main{display:none} body:not(.v-mem) #members{display:none}
 body.v-chat #rail,body.v-chat #side,body.v-mem #rail,body.v-mem #side{display:none}
 #rail{grid-row:1}#side{grid-row:1}
 #mnav{display:flex;grid-column:1/3;grid-row:2;background:var(--rail);border-top:1px solid var(--line);justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
 #mnav button{background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:4px 14px;position:relative}
 #mnav button .i{font-size:20px}#mnav button.on{color:var(--ember2)}
 #mnav .badge{position:absolute;top:0;right:8px;background:var(--warn);color:#fff;border-radius:8px;font-size:10px;padding:0 5px}
 .back{display:inline-block;background:transparent;font-size:20px;padding:4px 8px 4px 0}
 .tools{top:auto;bottom:-14px;z-index:2}
 #composer textarea{font-size:16px}
 .hallbtn{width:44px;height:44px}
 #toast{bottom:76px}
}
</style>
</head>
<body class="v-side">
<div id="login">
 <div class="card" style="text-align:center">
  <div class="logo"><span class="flame"></span>Hearth<b>ly</b></div>
  <p style="color:var(--dim);margin:6px 0 16px">Gather round. Chat with your people.</p>
  <label style="text-align:left">Your name</label><input id="lname" maxlength="24" placeholder="e.g. ember_fox" autocomplete="off">
  <label style="text-align:left">Server (this computer only)</label><input id="lurl">
  <div id="lerr" style="color:var(--warn);min-height:20px;margin-top:8px;font-size:13px"></div>
  <div class="row" style="justify-content:center"><button class="pri" id="lgo" style="width:100%">Join</button></div>
  <p style="color:var(--dim);font-size:12px;margin-top:14px">No server running? Start one:<br><code>python hearthly_server.py</code></p>
 </div>
</div>
<div id="netbar" class="hidden">Lost the server. Trying again…</div>
<div id="app">
 <nav id="rail"></nav>
 <aside id="side"><div id="sidehead"></div><div id="sidelist"></div>
  <div id="me"></div></aside>
 <main id="main"><div id="mainhead"></div><div id="msgs"></div><div id="typing"></div>
  <div id="composer"><div id="suggest" class="hidden"></div><div id="cbar" class="hidden"></div><form id="send"><button type="button" id="attach" title="Send a file (or drop one here, or paste a picture)">📎</button><input type="file" id="fpick" hidden><textarea id="box" rows="1" placeholder="Message"></textarea><button class="pri" title="Send">➤</button></form></div></main>
 <aside id="members"></aside>
 <nav id="mnav"><button data-v="side"><span class="i">☰</span>Halls</button><button data-v="chat"><span class="i">💬</span>Chat</button><button data-v="mem"><span class="i">👥</span>Members</button></nav>
</div>
<div id="scrim" class="hidden"><div class="card" id="dlg"></div></div>
<div id="toast" class="hidden"></div>
<script>
"use strict";
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const QUICK = ["👍","❤️","😂","🔥","🎉","👀"];
const store = (() => { try { const k = "hearthly"; return {get: () => JSON.parse(localStorage.getItem(k) || "{}"), set: v => localStorage.setItem(k, JSON.stringify(v))}; } catch (e) { let m = {}; return {get: () => m, set: v => m = v}; } })();
const S = {ws: null, me: null, halls: {}, dms: {}, users: {}, directory: [], perms: [], msgs: {}, more: {}, cur: {hall: null, chan: null}, unread: {}, ment: {}, rid: 0, wait: {}, typing: {}, view: "side",
  notify: {}, reads: {}, reply: null, editing: null};
const EMOJI = ["👍","👎","❤️","😂","🔥","🎉","👀","🙏","😮","😢","😡","🤔","👏","💯","✅","❌","⭐","🚀","☕","🍕","🌙","☀️","🌧️","🐾","🎵","📌","💡","🛠️","🧡","💚","💙","💜","😎","🥳","😴","🤝","👋","🙌","🤯","🫶"];
window.hearthly = {S, act: (t, o) => act(t, o)};

function defaultUrl() { const p = new URLSearchParams(location.search).get("server"); if (p) return p;
  if (location.protocol.startsWith("http") && /^(127\.0\.0\.1|localhost)$/.test(location.hostname)) return `ws://${location.host}/ws`;
  return "ws://127.0.0.1:8814/ws"; }
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.remove("hidden"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.add("hidden"), 2600); }

function connect(name, url) {
  const saved = store.get(); url = url || saved.url || defaultUrl();
  if (!/^wss?:\/\/(127\.0\.0\.1|localhost|\[::1\])(:\d+)?\//.test(url)) { $("#lerr").textContent = "Hearthly only talks to a server on this computer (127.0.0.1)."; return; }
  const ws = new WebSocket(url); S.ws = ws;
  ws.onopen = () => { $("#netbar").classList.add("hidden"); ws.send(JSON.stringify({t: "hello", name, token: saved.url === url ? saved.token : null})); };
  ws.onmessage = e => onEvent(JSON.parse(e.data), url, name);
  ws.onclose = () => { if (S.ws !== ws) return; S.ws = null; if (S.me) { $("#netbar").classList.remove("hidden"); setTimeout(() => connect(S.me.name, url), 1500); } else $("#lerr").textContent ||= "Can't reach the server at " + url; };
}
function act(t, o = {}) { return new Promise((res, rej) => { if (!S.ws || S.ws.readyState !== 1) return rej(new Error("not connected")); const rid = ++S.rid; S.wait[rid] = {res, rej}; S.ws.send(JSON.stringify({t, rid, ...o})); setTimeout(() => { if (S.wait[rid]) { delete S.wait[rid]; rej(new Error("timeout")); } }, 8000); }); }

function onEvent(m, url, name) {
  if (m.rid && S.wait[m.rid]) { const w = S.wait[m.rid]; delete S.wait[m.rid]; m.t === "error" ? w.rej(new Error(m.e)) : w.res(m); if (m.t === "error") toast(m.e); return; }
  switch (m.t) {
    case "error": if (m.re === "hello") { $("#lerr").textContent = m.e; S.ws.close(); } else toast(m.e); break;
    case "ready": store.set({url, token: m.token, name: m.me.name}); S.uploadMax = m.upload_max || 0; S.me = m.me; S.perms = m.perm_names; S.chanPermNames = m.chan_perm_names; S.halls = {}; S.dms = {};
      S.unread = Object.assign({}, m.unread || {}); S.ment = Object.assign({}, m.ment || {}); S.notify = m.notify || {}; S.reads = m.reads || {};
      m.halls.forEach(h => S.halls[h.id] = h); m.dms.forEach(d => S.dms[d.id] = d); Object.assign(S.users, m.users); m.directory.forEach(u => S.users[u.id] = u); S.directory = m.directory.map(u => u.id);
      $("#login").classList.add("hidden");
      if (!S.cur.hall && !S.cur.chan) { const h = Object.values(S.halls)[0]; h ? openHall(h.id) : openHome(); } else { S.msgs = {}; openChan(S.cur.chan, S.view !== "chat"); }
      render(); break;
    case "hall": S.halls[m.hall.id] = m.hall; if (m.users) Object.assign(S.users, m.users); if (!S.cur.hall && !S.cur.chan) openHall(m.hall.id);
      else if (S.cur.hall === m.hall.id && S.cur.chan && !m.hall.channels.some(c => c.id === S.cur.chan)) { delete S.msgs[S.cur.chan]; toast("You can't see that channel any more"); openHall(m.hall.id); }
      render(); if (S.cur.hall === m.hall.id) renderMsgs(); break;
    case "hall_gone": delete S.halls[m.hall]; if (S.cur.hall === m.hall) openHome(); toast("You were removed from a hall"); render(); break;
    case "dm": S.dms[m.dm.id] = m.dm; Object.assign(S.users, m.users); render(); break;
    case "presence": S.users[m.user.id] = m.user; if (!S.directory.includes(m.user.id)) S.directory.push(m.user.id); render(); break;
    case "msg": gotMsg(m.msg); break;
    case "react": { const l = S.msgs[m.channel]; const x = l && l.find(x => x.id === m.msg); if (x) { x.reactions = m.reactions; if (m.channel === S.cur.chan) renderMsgs(); } break; }
    case "deleted": { const l = S.msgs[m.channel]; const gone = l && l.find(x => x.id === m.msg);
      if (gone && gone.by !== S.me.id && !gone.system && gone.ts > (S.reads[m.channel] || 0) && S.unread[m.channel] > 0) { S.unread[m.channel]--; if (mentionsMe(gone) && S.ment[m.channel] > 0) S.ment[m.channel]--; render(); }
      if (l) { S.msgs[m.channel] = l.filter(x => x.id !== m.msg); if (m.channel === S.cur.chan) renderMsgs(); } break; }
    case "typing": S.typing[m.channel] = {user: m.user, until: Date.now() + 4000}; renderTyping(); break;
    case "edited": { const l = S.msgs[m.channel]; if (l) { const i = l.findIndex(x => x.id === m.msg.id); if (i >= 0) l[i] = m.msg; l.forEach(x => { if (x.reply && x.reply.id === m.msg.id) x.reply.text = m.msg.text.slice(0, 140); }); if (m.channel === S.cur.chan) renderMsgs(); } break; }
    case "pins": { const c = chanObj(m.channel); if (c) c.pins = m.pins; if (m.channel === S.cur.chan) { render(); renderMsgs(); } break; }
    case "read": S.reads[m.channel] = m.ts; if (!(S.msgs[m.channel] || []).some(x => x.ts > m.ts && x.by !== S.me.id)) { S.unread[m.channel] = 0; S.ment[m.channel] = 0; } render(); break;
    case "notify": S.notify[m.key] = m.level; render(); break;
  }
}
function chanObj(cid) { if (S.dms[cid]) return S.dms[cid]; for (const h of Object.values(S.halls)) { const c = h.channels.find(c => c.id === cid); if (c) return c; } return null; }
function levelOf(cid) { const h = chanHall(cid); return h ? (S.notify[h.id] || "mentions") : (S.notify.dms || "all"); }
function badgeOf(cid) { const l = levelOf(cid); return l === "none" ? 0 : l === "all" ? (S.unread[cid] || 0) : (S.ment[cid] || 0); }
let readT = {};
function markRead(cid) {
  const l = S.msgs[cid]; if (!l || !l.length) return; const ts = l[l.length - 1].ts;
  S.unread[cid] = 0; S.ment[cid] = 0; if ((S.reads[cid] || 0) >= ts) return;
  clearTimeout(readT[cid]); readT[cid] = setTimeout(() => { S.reads[cid] = ts; act("read", {channel: cid, ts}).catch(() => {}); }, 300);
}
function mentionsMe(msg) { const me = S.me.id, mm = msg.mentions || {}; if (msg.by === me) return false;
  if (mm.everyone || (mm.users || []).includes(me)) return true;
  const h = chanHall(msg.ch); return !!(h && h.members[me] && h.members[me].roles.some(r => (mm.roles || []).includes(r))); }
function gotMsg(msg) {
  (S.msgs[msg.ch] ||= []).push(msg); delete S.typing[msg.ch];
  const here = msg.ch === S.cur.chan && (S.view === "chat" || !phone()) && document.visibilityState !== "hidden";
  if (!here && msg.by !== S.me.id) { S.unread[msg.ch] = (S.unread[msg.ch] || 0) + 1; }

  if (e.key === "ArrowUp" && !box.value && S.cur.chan) { const mine = (S.msgs[S.cur.chan] || []).filter(x => x.by === S.me.id && !x.system && !x.as); if (mine.length) { e.preventDefault(); startEdit(mine[mine.length - 1].id); } return; }
  if (e.key === "Escape" && (S.reply || S.editing)) { e.preventDefault(); if (S.editing) box.value = ""; S.reply = null; S.editing = null; renderBar(); } });
$("#send").addEventListener("submit", e => { e.preventDefault(); const text = box.value.trim(); if (!text || !S.cur.chan) return; box.value = ""; box.style.height = "auto";
  if (S.editing) { const ed = S.editing; S.editing = null; renderBar(); act("edit", {channel: ed.ch, msg: ed.id, text}).catch(() => { box.value = text; }); return; }
  const rp = S.reply; S.reply = null; renderBar();
  act("send", {channel: S.cur.chan, text, reply: rp ? rp.id : undefined}).catch(() => { box.value = text; S.reply = rp; renderBar(); }); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.cur.chan && (S.view === "chat" || !phone())) { markRead(S.cur.chan); render(); } });
matchMedia("(max-width:720px)").addEventListener("change", () => { setView(S.view); render(); });
$("#lurl").value = store.get().url || defaultUrl(); $("#lname").value = store.get().name || "";
$("#lgo").onclick = () => { $("#lerr").textContent = ""; connect($("#lname").value.trim(), $("#lurl").value.trim()); };
$("#lname").addEventListener("keydown", e => { if (e.key === "Enter") $("#lgo").click(); });
setView("side");
if (store.get().token && store.get().name) connect(store.get().name, store.get().url);
</script>
