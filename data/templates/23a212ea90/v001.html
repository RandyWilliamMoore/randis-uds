<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Paint</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1e1f22;color:#e6e6e6;font:13px Segoe UI,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#top{display:flex;gap:6px;align-items:center;padding:6px;background:#2b2d31;border-bottom:1px solid #111;flex-wrap:wrap}
button{background:#3a3c42;color:#e6e6e6;border:1px solid #4a4c52;border-radius:4px;padding:5px 9px;cursor:pointer;font:inherit}
button:hover{background:#45474e}
button.on{background:#5865f2;border-color:#7983f5}
.sep{width:1px;height:24px;background:#444;margin:0 4px}
#main{flex:1;display:flex;overflow:hidden}
#tools{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;background:#2b2d31;border-right:1px solid #111;align-content:start}
#tools button{width:38px;height:34px;padding:0;font-size:16px}
#wrap{flex:1;overflow:auto;background:#141517;padding:12px}
#stage{position:relative;display:inline-block;box-shadow:0 0 0 1px #000,0 4px 14px #0008}
canvas{display:block}
#over{position:absolute;left:0;top:0;pointer-events:none}
#bottom{display:flex;align-items:center;gap:8px;padding:6px;background:#2b2d31;border-top:1px solid #111}
#pal{display:flex;flex-wrap:wrap;width:340px;gap:2px}
.sw{width:18px;height:18px;border:1px solid #000;cursor:pointer}
#cur{position:relative;width:40px;height:34px}
#c1,#c2{position:absolute;width:24px;height:24px;border:1px solid #000;cursor:pointer}
#c1{left:0;top:0;z-index:2}#c2{left:14px;top:10px}
input[type=color]{width:30px;height:26px;border:none;background:none;padding:0}
#status{margin-left:auto;color:#999}
</style>
</head>
<body>
<div id="top">
  <button id="undo">↶ Undo</button><button id="redo">↷ Redo</button>
  <div class="sep"></div>
  <button id="clear">New</button><button id="save">Save PNG</button>
  <label><button id="openb">Open</button><input type="file" id="file" accept="image/*" hidden></label>
  <div class="sep"></div>
  Size <input type="range" id="size" min="1" max="50" value="3"><span id="sz">3</span>
  <label><input type="checkbox" id="fillShape"> Fill shapes</label>
  <div class="sep"></div>
  W <input id="cw" type="number" value="800" style="width:60px"> H <input id="ch" type="number" value="500" style="width:60px">
  <button id="resize">Resize</button>
</div>
<div id="main">
  <div id="tools"></div>
  <div id="wrap"><div id="stage"><canvas id="cv"></canvas><canvas id="over"></canvas></div></div>
</div>
<div id="bottom">
  <div id="cur"><div id="c1"></div><div id="c2"></div></div>
  <input type="color" id="pick" title="Custom color">
  <div id="pal"></div>
  <span id="status"></span>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const ov=document.getElementById('over'),octx=ov.getContext('2d');
const tools=[['pencil','✏️'],['brush','🖌️'],['eraser','🧽'],['fill','🪣'],['picker','💧'],['spray','💨'],['line','／'],['rect','▭'],['ellipse','◯'],['rrect','▢'],['text','A'],['select','⬚']];
let tool='pencil',c1='#000000',c2='#ffffff',size=3,drawing=false,sx,sy,lx,ly,col,undoS=[],redoS=[],sel=null,sprayT;
const colors=['#000000','#7f7f7f','#880015','#ed1c24','#ff7f27','#fff200','#22b14c','#00a2e8','#3f48cc','#a349a4','#ffffff','#c3c3c3','#b97a57','#ffaec9','#ffc90e','#efe4b0','#b5e61d','#99d9ea','#7092be','#c8bfe7'];
const T=document.getElementById('tools');
tools.forEach(([id,ic])=>{const b=document.createElement('button');b.textContent=ic;b.title=id;b.dataset.t=id;b.onclick=()=>setTool(id);T.appendChild(b)});
function setTool(t){commitSel();tool=t;T.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t==t))}
setTool('pencil');
const P=document.getElementById('pal');
colors.forEach(c=>{const d=document.createElement('div');d.className='sw';d.style.background=c;d.onclick=()=>setC1(c);d.oncontextmenu=e=>{e.preventDefault();setC2(c)};P.appendChild(d)});
function setC1(c){c1=c;document.getElementById('c1').style.background=c;document.getElementById('pick').value=c}
function setC2(c){c2=c;document.getElementById('c2').style.background=c}
setC1(c1);setC2(c2);
document.getElementById('pick').oninput=e=>setC1(e.target.value);
document.getElementById('c2').onclick=()=>{const t=c1;setC1(c2);setC2(t)};
document.getElementById('size').oninput=e=>{size=+e.target.value;document.getElementById('sz').textContent=size};

function init(w,h,keep){
  const old=keep?ctx.getImageData(0,0,cv.width,cv.height):null;
  cv.width=ov.width=w;cv.height=ov.height=h;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  if(old)ctx.putImageData(old,0,0);
}
init(800,500);
function push(){undoS.push(ctx.getImageData(0,0,cv.width,cv.height));if(undoS.length>50)undoS.shift();redoS=[]}
function restore(from,to){if(!from.length)return;commitSel();to.push(ctx.getImageData(0,0,cv.width,cv.height));const d=from.pop();if(d.width!=cv.width||d.height!=cv.height){cv.width=ov.width=d.width;cv.height=ov.height=d.height}ctx.putImageData(d,0,0)}
document.getElementById('undo').onclick=()=>restore(undoS,redoS);
document.getElementById('redo').onclick=()=>restore(redoS,undoS);
document.getElementById('clear').onclick=()=>{push();ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)};
document.getElementById('resize').onclick=()=>{push();init(+document.getElementById('cw').value||800,+document.getElementById('ch').value||500,true)};
document.getElementById('save').onclick=()=>{commitSel();const a=document.createElement('a');a.download='painting.png';a.href=cv.toDataURL();a.click()};
document.getElementById('openb').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{push();init(im.width,im.height);ctx.drawImage(im,0,0);document.getElementById('cw').value=im.width;document.getElementById('ch').value=im.height};im.src=r.result};r.readAsDataURL(f)};

function pos(e){const r=cv.getBoundingClientRect();return[Math.floor(e.clientX-r.left),Math.floor(e.clientY-r.top)]}
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function flood(x,y,hex){
  const W=cv.width,H=cv.height,img=ctx.getImageData(0,0,W,H),d=img.data,i0=(y*W+x)*4;
  const t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],[r,g,b]=hexRgb(hex);
  if(t[0]==r&&t[1]==g&&t[2]==b&&t[3]==255)return;
  const m=(i)=>Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])+Math.abs(d[i+3]-t[3])<32;
  const st=[x,y];
  while(st.length){let cy=st.pop(),cx=st.pop(),i=(cy*W+cx)*4;
    while(cx>=0&&m(i)){cx--;i-=4}cx++;i+=4;let up=false,dn=false;
    while(cx<W&&m(i)){d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255;
      if(cy>0){if(m(i-W*4)){if(!up){st.push(cx,cy-1);up=true}}else up=false}
      if(cy<H-1){if(m(i+W*4)){if(!dn){st.push(cx,cy+1);dn=true}}else dn=false}
      cx++;i+=4}}
  ctx.putImageData(img,0,0);
}
function shape(c,x0,y0,x1,y1,shift){
  let w=x1-x0,h=y1-y0;
  if(shift&&tool!='line'){const s=Math.max(Math.abs(w),Math.abs(h));w=Math.sign(w||1)*s;h=Math.sign(h||1)*s}
  if(shift&&tool=='line'){const a=Math.round(Math.atan2(h,w)/(Math.PI/4))*Math.PI/4,l=Math.hypot(w,h);w=Math.cos(a)*l;h=Math.sin(a)*l}
  c.lineWidth=size;c.strokeStyle=col;c.fillStyle=col==c1?c2:c1;c.lineCap='round';c.lineJoin='round';c.beginPath();
  if(tool=='line'){c.moveTo(x0,y0);c.lineTo(x0+w,y0+h)}
  else if(tool=='rect')c.rect(x0,y0,w,h);
  else if(tool=='rrect'){const r=Math.min(15,Math.abs(w)/2,Math.abs(h)/2);c.roundRect?c.roundRect(Math.min(x0,x0+w),Math.min(y0,y0+h),Math.abs(w),Math.abs(h),r):c.rect(x0,y0,w,h)}
  else if(tool=='ellipse')c.ellipse(x0+w/2,y0+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2);
  if(document.getElementById('fillShape').checked&&tool!='line')c.fill();
  c.stroke();
}
function stroke(x0,y0,x1,y1){
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=tool=='eraser'?c2:col;
  ctx.lineWidth=tool=='pencil'?1:tool=='eraser'?size*3:size;
  if(tool=='pencil'){ctx.fillStyle=col;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++)ctx.fillRect(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),1,1);return}
  if(tool=='eraser'){ctx.lineCap='square'}
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
}
function spray(){ctx.fillStyle=col;const r=size*3;for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2,d=Math.random()*r;ctx.fillRect(lx+Math.cos(a)*d,ly+Math.sin(a)*d,1,1)}}

// selection
function drawSelBox(){octx.clearRect(0,0,ov.width,ov.height);if(!sel)return;if(sel.img)octx.putImageData(sel.img,sel.x,sel.y);octx.setLineDash([4,3]);octx.strokeStyle='#000';octx.lineWidth=1;octx.strokeRect(sel.x+.5,sel.y+.5,sel.w,sel.h);octx.setLineDash([])}
function commitSel(){if(sel&&sel.img){const t=document.createElement('canvas');t.width=sel.w;t.height=sel.h;t.getContext('2d').putImageData(sel.img,0,0);ctx.drawImage(t,sel.x,sel.y)}sel=null;octx.clearRect(0,0,ov.width,ov.height)}

cv.oncontextmenu=e=>e.preventDefault();
cv.onmousedown=e=>{
  const[x,y]=pos(e);col=e.button==2?c2:c1;sx=lx=x;sy=ly=y;
  if(tool=='picker'){const p=ctx.getImageData(x,y,1,1).data;const h='#'+[p[0],p[1],p[2]].map(v=>v.toString(16).padStart(2,'0')).join('');e.button==2?setC2(h):setC1(h);return}
  if(tool=='text'){const t=prompt('Text:');if(t){push();ctx.fillStyle=col;ctx.font=(size*4+8)+'px Segoe UI';ctx.textBaseline='top';ctx.fillText(t,x,y)}return}
  if(tool=='select'){
    if(sel&&x>=sel.x&&x<=sel.x+sel.w&&y>=sel.y&&y<=sel.y+sel.h){
      if(!sel.img){push();sel.img=ctx.getImageData(sel.x,sel.y,sel.w,sel.h);ctx.fillStyle=c2;ctx.fillRect(sel.x,sel.y,sel.w,sel.h)}
      sel.mv=[x-sel.x,y-sel.y];drawing=true;return}
    commitSel();sel={x,y,w:0,h:0,make:true};drawing=true;return}
  push();
  if(tool=='fill'){flood(x,y,col);return}
  drawing=true;
  if(tool=='spray'){spray();sprayT=setInterval(spray,30)}
  else if(['pencil','brush','eraser'].includes(tool))stroke(x,y,x,y);
};
window.onmousemove=e=>{
  const[x,y]=pos(e);
  document.getElementById('status').textContent=(x>=0&&y>=0&&x<cv.width&&y<cv.height?x+', '+y+'px  ':'')+cv.width+'×'+cv.height;
  if(!drawing)return;
  if(tool=='select'){
    if(sel.mv){sel.x=x-sel.mv[0];sel.y=y-sel.mv[1]}
    else{sel.x=Math.min(sx,x);sel.y=Math.min(sy,y);sel.w=Math.abs(x-sx);sel.h=Math.abs(y-sy)}
    drawSelBox();return}
  if(['line','rect','ellipse','rrect'].includes(tool)){octx.clearRect(0,0,ov.width,ov.height);shape(octx,sx,sy,x,y,e.shiftKey)}
  else if(tool=='spray'){lx=x;ly=y}
  else{stroke(lx,ly,x,y);lx=x;ly=y}
};
window.onmouseup=e=>{
  if(!drawing)return;drawing=false;clearInterval(sprayT);
  const[x,y]=pos(e);
  if(tool=='select'){if(sel.make){delete sel.make;if(sel.w<2||sel.h<2)sel=null}if(sel)delete sel.mv;drawSelBox();return}
  if(['line','rect','ellipse','rrect'].includes(tool)){octx.clearRect(0,0,ov.width,ov.height);shape(ctx,sx,sy,x,y,e.shiftKey)}
};
window.onkeydown=e=>{
  if(e.target.tagName=='INPUT')return;
  if(e.ctrlKey&&e.key=='z'){e.preventDefault();restore(undoS,redoS)}
  else if(e.ctrlKey&&e.key=='y'){e.preventDefault();restore(redoS,undoS)}
  else if(e.key=='Delete'&&sel){if(!sel.img){push();ctx.fillStyle=c2;ctx.fillRect(sel.x,sel.y,sel.w,sel.h)}sel=null;drawSelBox()}
  else if(e.key=='Enter'||e.key=='Escape')commitSel();
};
</script>
</body>
</html>
