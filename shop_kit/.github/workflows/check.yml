name: Shop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every shelf is in order
        run: python tools/build_index.py

      - name: The lists match the folders
        if: runner.os == 'Linux'
        run: git diff --exit-code -- config.js items.js software.js music.js

      - name: Get a browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Every page opens and runs
        run: python tools/check_site.py
